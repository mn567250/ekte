<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-en="zing — monitors">zing — 监控</title>
<script src="/locales.js"></script>
<script src="/lang.js"></script>
<script src="/v2/static/theme.js"></script>
<link rel="stylesheet" href="/v2/static/tokens.css" />
<link rel="stylesheet" href="/v2/static/zing.css" />
<link rel="stylesheet" href="/v2/static/fields.css" />
<link rel="stylesheet" href="/v2/static/jobs.css" />
<link rel="stylesheet" href="/v2/static/filterpanel.css" />
<style>
  /* ---- monitors page (v2) — page-only rules; colours via zing.css tokens ---- */
  /* inline field errors */
  .in[aria-invalid="true"] { border-color: var(--danger); }
  .in[aria-invalid="true"]:focus { box-shadow: 0 0 0 4px var(--danger-tint); }
  .ferr { margin: 6px 0 0; font-size: 12.5px; font-weight: 600; color: var(--danger); line-height: 1.45; }
  .ferr[hidden] { display: none; }
  /* number input with a unit suffix */
  .unit-in { position: relative; }
  .unit-in .in { padding-right: 96px; }
  .unit-in .unit {
    position: absolute; top: 0; bottom: 0; right: 14px; display: flex; align-items: center;
    font-size: 13px; font-weight: 600; color: var(--ink-muted); pointer-events: none;
    max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sw-t { font-style: normal; }
  /* zing.css styles every `.switch span` as the knob: keep the label text a plain inline span */
  .switch .sw-l { position: static; width: auto; height: auto; margin: 0; border-radius: 0; background: none; box-shadow: none; transition: none; }
  /* the unit suffix sits where the native spinner would */
  .unit-in input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  .unit-in input[type="number"]::-webkit-inner-spin-button,
  .unit-in input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .edit .unit-in .in { padding-right: 76px; }
  .edit .unit-in .unit { right: 10px; font-size: 12px; }
  .switch:has(input:disabled) { cursor: not-allowed; opacity: 0.55; }

  /* monitor cards */
  .mons { display: flex; flex-direction: column; gap: 12px; }
  .mon { padding: 18px 20px; min-width: 0; }
  @media (max-width: 520px) { .mon { padding: 16px; } }
  /* paused: a dashed card edge instead of fading the body (opacity pushed its
     text below 4.5:1, WCAG 1.4.3); the state itself is spelled out by the switch */
  .mon.off { border-style: dashed; border-color: var(--line); }
  .mon.flash { animation: mon-flash 1.6s ease-out; }
  @keyframes mon-flash { from { box-shadow: 0 0 0 3px var(--primary-tint), var(--shadow-card); } }
  .mon-top { display: flex; align-items: flex-start; gap: 10px 14px; flex-wrap: wrap; }
  .mon-title { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; min-width: 0; flex: 1 1 220px; }
  .mon-name {
    font-family: var(--disp); font-weight: 600; font-size: 17px; letter-spacing: -0.3px; margin: 0;
    overflow-wrap: anywhere; min-width: 0;
  }
  .mon-top .switch { flex: 0 1 auto; margin-left: auto; min-width: 0; max-width: 100%; flex-wrap: wrap; row-gap: 2px; }
  .mon-top .switch .sw-l, .mon-top .switch .sw-t { min-width: 0; overflow-wrap: anywhere; }
  .mon-url { font-family: var(--mono); font-size: 12.5px; color: var(--ink-muted); margin-top: 6px; overflow-wrap: anywhere; }
  .mon-meta {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 16px;
    margin: 14px 0 0; padding: 14px 0 0; border-top: 1px dashed var(--line);
  }
  /* each item spans a label row and a value row of the parent grid (subgrid),
     so a label that wraps (DE "Sprache der Warnungen") moves its whole row down
     and every value in the row still starts on the same line */
  .mon-meta > div { min-width: 0; display: grid; grid-row: span 2; grid-template-rows: subgrid; row-gap: 4px; align-content: start; }
  .mon-meta dt {
    font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-muted); margin: 0;
    align-self: end;
  }
  /* an open inline editor gets the whole row, so its field and Save / Cancel fit */
  .mon-meta > div:has(.edit) { grid-column: 1 / -1; }
  .mon-meta dd .edit { max-width: 440px; }
  .mon-meta dd { margin: 0; font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; line-height: 1.45; }
  .mon-meta dd code {
    font-size: 12px; background: var(--sunken); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px;
  }
  .mon-meta dd .aside { display: block; margin-top: 2px; }
  .mon-meta select.in { font-size: 13px; padding: 6px 30px 6px 10px; border-radius: 10px; background-position: right 15px center, right 10px center; }
  .mon-last {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: 14px;
    font-size: 13px; color: var(--ink-muted);
  }
  .mon-last b { color: var(--ink); }
  .mon-last a { font-weight: 700; font-size: 12.5px; text-decoration: none; }
  .mon-last a:hover { text-decoration: underline; }
  .mon-msg { margin-top: 10px; font-size: 13px; font-weight: 600; line-height: 1.45; }
  .mon-msg:empty { display: none; }
  .mon-msg.ok { color: var(--success); }
  .mon-msg.bad { color: var(--danger); }
  /* the actions span the card, like the report's page actions (report.css) */
  .mon-act { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .mon-act .btn { flex: 1 1 200px; min-width: 0; padding: 12px 14px; white-space: normal; text-align: center; }
  .mon-act .ask { flex-basis: 100%; font-size: 13px; font-weight: 600; color: var(--danger); }
  @media (max-width: 520px) { .mon-act .btn { flex-basis: 100%; } }
  .mon-prog { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13px; font-weight: 700; color: var(--info); }
  .mon-prog .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--info-tint); overflow: hidden; }
  .mon-prog .bar > span { display: block; height: 100%; background: var(--info); border-radius: 3px; transition: width .4s ease; }
  .mon-prog b { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .spin { display: inline-flex; animation: mon-spin 1s linear infinite; }
  @keyframes mon-spin { to { transform: rotate(360deg); } }
  #list-title:focus { outline: none; }
  .mon-meta dd .edit { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  .mon-meta dd .edit .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .mon-meta dd .edit .in { font-size: 13px; padding: 7px 10px; border-radius: 10px; }
  .mon-meta dd .link { margin-left: 6px; }
  /* negative block margins: the pen button does not make its line taller, so
     "Stored ✎" starts on the same line as the plain values beside it */
  .mon-meta dd .link.icon-only { padding: 6px; line-height: 0; vertical-align: middle; margin-block: -6px; }
  .mon-meta dd .link.icon-only .zicon { width: 16px; height: 16px; }
  /* draft: a watch scheduled from a history run that still needs its interval / key */
  .setup {
    margin-top: 14px; padding: 14px 16px; border-radius: 14px;
    background: var(--warning-tint); border: 1px solid var(--warning);
  }
  .setup h4 { margin: 0 0 4px; font-size: 14px; font-weight: 700; color: var(--ink); }
  .setup > p { margin: 0 0 12px; font-size: 13px; color: var(--ink-muted); line-height: 1.5; }
  .setup .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; align-items: start; }
  .setup .lab { font-size: 12.5px; }
  .setup .go { margin-top: 12px; }
  .empty.boxed { border: 1.5px dashed var(--line); border-radius: 18px; }
  .empty p { margin: 8px 0 0; }
  .empty a { font-weight: 700; }
  .tabs [role="tab"] .count:empty { display: none; }
  .tabs [role="tab"] .count { font-variant-numeric: tabular-nums; }
  /* nested in the .tab-card: a quieter item surface instead of a second card shadow */
  .tab-card .mon { box-shadow: none; border-color: var(--line); border-radius: 16px; }
  .tab-card .section-title { margin-top: 0; }
  /* collapse toggle: the monitor's name is the button (as History's group headings) */
  .mtog {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%; margin: -3px 0; padding: 3px 6px 3px 2px; cursor: pointer;
    font: inherit; letter-spacing: inherit; color: inherit; text-align: left; background: none; border: 0; border-radius: 8px;
  }
  .mtog:hover { background: var(--sunken); }
  .mtog .t { overflow-wrap: anywhere; min-width: 0; }
  .mtog .zicon { width: 16px; height: 16px; flex: none; color: var(--ink-muted); transition: transform 0.2s; }
  .mtog[aria-expanded="false"] .zicon { transform: rotate(-90deg); }
  .mon-meta[hidden], .mon-act[hidden], .setup[hidden] { display: none; }
  /* filter fields (inside the shared panel above the card, filterpanel.css) */
  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 12px; align-items: end; }
  .fgrid .fq { grid-column: 1 / -1; }
  @media (min-width: 700px) { .fgrid .fq { grid-column: auto; } }
  .fgrid label { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .fgrid label > span { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-muted); overflow-wrap: anywhere; }
  .fgrid .in { font-size: 13.5px; padding: 8px 11px; border-radius: 10px; }
  .fgrid select.in { padding-right: 30px; background-position: right 16px center, right 11px center; }
  .mon-tools { display: flex; justify-content: flex-end; margin: -4px 0 8px; }
  .mon-tools[hidden] { display: none; }
  .mon-tools .linkbtn { font-size: 12.5px; font-weight: 600; }
  .nomatch p { margin: 0 0 10px; }
  .mon:focus { outline: none; }
  .mon:focus-visible { outline: 3px solid var(--info); outline-offset: 3px; }

  /* API key storage: native radios dressed as a segmented control (as the
     audit page's endpoint type) */
  .keystore { margin: 12px 0 16px; }
  .keystore fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .keystore legend { padding: 0; }
  .keystore .hint { margin: 8px 0 0; }
  .seg.radio { display: grid; grid-template-columns: repeat(2, minmax(min-content, 1fr)); }
  @media (max-width: 480px) { .seg.radio { grid-template-columns: minmax(0, 1fr); } }
  .seg.radio > span { position: relative; display: grid; }
  .seg.radio label {
    text-align: center; cursor: pointer; font-family: var(--sans); font-weight: 600; font-size: 13px;
    color: var(--ink-muted); background: var(--surface); border: 1.5px solid transparent; border-radius: 11px;
    padding: 10px 8px; transition: background 0.15s, color 0.15s;
  }
  .seg.radio input {
    appearance: none; position: absolute; inset: 0; z-index: 1; margin: 0; cursor: pointer;
    border: 1.5px solid var(--border); border-radius: 11px; background: transparent; transition: border-color 0.15s;
  }
  .seg.radio input:hover { border-color: var(--ink-muted); }
  .seg.radio input:hover + label { color: var(--ink); }
  .seg.radio input:checked { border-color: var(--primary); }
  .seg.radio input:checked + label { color: var(--on-primary); background: var(--primary); }
  .seg.radio input:disabled { cursor: not-allowed; }
  .seg.radio input:disabled + label { opacity: 0.6; }
</style>
</head>
<body>
<div class="wrap">
  <header class="znav" data-page="monitors"></header>
  <main id="main" tabindex="-1">
    <div class="hero">
      <h1 data-en="Put a <span class='u'>scheduled sentinel</span> on your relay">给中转站设个<span class="u">定时哨兵</span></h1>
      <p data-en="Every monitor re-runs an audit you already ran, on your machine, at the interval you set. To add one, open a run in <a href='/v2/history'>History</a> and choose <b>Schedule as monitor</b> — then set its interval here and switch it on. When the risk crosses your threshold or gets worse than last time, zing alerts your webhooks (Slack / Feishu / DingTalk / generic JSON).">每个监控都会在你本地、按设定的间隔重跑一次你已经跑过的检测。添加方式：在<a href="/v2/history">检测历史</a>中打开一次运行，选择<b>设为监控</b>，然后在这里设置间隔并启用。一旦风险越线或较上次恶化，zing 就向你配置的 Webhook（Slack / 飞书 / 钉钉 / 通用 JSON）推送告警。</p>
    </div>

    <!-- the page notice (notice.js) -->
    <div class="znote" id="note" hidden></div>

    <!-- where the monitors' API keys are kept: the user's choice -->
    <section class="card card-pad keystore">
      <fieldset id="keystore">
        <legend class="lab" data-en="API key storage">API 密钥保存方式</legend>
        <div class="seg radio">
          <span><input type="radio" name="keystore" id="ks-memory" value="memory" aria-describedby="ks-hint" disabled><label for="ks-memory" data-en="Don't store keys">不保存密钥</label></span><span><input type="radio" name="keystore" id="ks-encrypted" value="encrypted" aria-describedby="ks-hint" disabled><label for="ks-encrypted" data-en="Store encrypted on this machine">加密保存在本机</label></span>
        </div>
        <p class="hint" id="ks-hint"></p>
      </fieldset>
    </section>

    <!-- the master key that encrypts the stored API keys (only when they are stored) -->
    <div id="mk-bar" aria-live="polite"></div>

    <!-- filters of the Configure list (filterpanel.js), above the card as on History and Knowledge -->
    <section class="card filters" id="filters" hidden></section>

    <div class="card card-pad tab-card">
      <div class="tabs" role="tablist" aria-label="监控视图" data-en-aria-label="Monitor views">
        <button type="button" role="tab" id="tab-configure" aria-selected="true" aria-controls="panel-configure" tabindex="0"><span class="pico" data-icon="bell"></span><span data-en="Configure">配置</span></button>
        <button type="button" role="tab" id="tab-running" aria-selected="false" aria-controls="panel-running" tabindex="-1"><span class="pico" data-icon="play"></span><span data-en="Running">运行中</span> <span class="count" id="run-count"></span></button>
      </div>

      <section role="tabpanel" id="panel-configure" aria-labelledby="tab-configure" tabindex="0">
        <!-- list -->
        <h2 class="section-title" id="list-title" tabindex="-1"><span data-en="Configured monitors">已配置的监控</span> <span class="count" id="count"></span></h2>
        <div class="mon-tools" id="mon-tools" hidden><button type="button" class="linkbtn" id="mall"></button></div>
        <div class="mons" id="list" aria-live="polite"><p class="empty" data-en="Loading…">加载中…</p></div>
        <p class="reassure"><span class="pico" id="lock-icon"></span> <span id="reassure-text"></span></p>
      </section>

      <section role="tabpanel" id="panel-running" aria-labelledby="tab-running" tabindex="0" hidden>
        <p class="jh" data-en="Monitor runs in progress. A run of the same relay waits for any other audit of it to finish, so results are never skewed.">正在进行的监控运行。同一中转站的运行会等它的其他检测结束后再开始，结果不会互相干扰。</p>
        <p class="jempty" id="jobs-empty" data-en="No monitors are running">当前没有运行中的监控</p>
        <ul class="jlist" id="jobs"></ul>
      </section>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var L = window.ZING_LANG;

  function icon(name, opts) {
    return typeof window.zingIcon === "function" ? window.zingIcon(name, opts) : "";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // T(zh, en) with {name} placeholders filled after translation.
  function Tf(zh, en, vals) {
    var s = T(zh, en);
    Object.keys(vals || {}).forEach(function (k) {
      s = s.split("{" + k + "}").join(String(vals[k]));
    });
    return s;
  }

  // ---- vocabulary ------------------------------------------------------- //
  var THRESHOLD = {
    low: ["低及以上", "Low and above"],
    medium: ["中及以上", "Medium and above"],
    high: ["仅高", "High only"],
  };
  var RISK_CLASS = { clean: "good", low: "sky", medium: "warn", high: "bad", inconclusive: "grey" };

  function riskLabel(v) {
    return window.ZING_I18N ? window.ZING_I18N.label("RISK_LEVEL", v) : v;
  }
  function fmtEvery(sec) {
    sec = Number(sec) || 0;
    if (sec >= 3600 && sec % 3600 === 0) return Tf("每 {n} 小时", "every {n} h", { n: sec / 3600 });
    if (sec >= 60 && sec % 60 === 0) return Tf("每 {n} 分钟", "every {n} min", { n: sec / 60 });
    return Tf("每 {n} 秒", "every {n} s", { n: sec });
  }
  function fmtTime(ts) {
    if (!ts) return T("从未运行", "Never run");
    try {
      return L.dateFmt({ dateStyle: "medium", timeStyle: "short" }).format(new Date(ts * 1000));
    } catch (e) {
      return new Date(ts * 1000).toLocaleString();
    }
  }
  function fmtScore(v) {
    var n = Number(v);
    return isFinite(n) ? String(Math.round(n)) : "—";
  }
  function langOptions(selected) {
    return L.langs().map(function (l) {
      return '<option value="' + esc(l.code) + '"' + (l.code === selected ? " selected" : "") + ">" + esc(l.label) + "</option>";
    }).join("");
  }
  function thresholdOptions(selected) {
    return ["low", "medium", "high"].map(function (v) {
      return '<option value="' + v + '"' + (v === selected ? " selected" : "") + ">" + esc(T(THRESHOLD[v][0], THRESHOLD[v][1])) + "</option>";
    }).join("");
  }
  function isHttpUrl(s) {
    return /^https?:\/\/\S+$/i.test(s);
  }
  function hooksText(n) {
    if (!n) return T("无 Webhook", "No webhooks");
    if (n === 1) return T("1 个 Webhook", "1 webhook");
    return Tf("{n} 个 Webhook", "{n} webhooks", { n: n });
  }

  // ---- list state --------------------------------------------------------- //
  var watches = null; // last list from the server
  var loadErr = false;
  // per-monitor transient UI state:
  //   running, confirm, busy, msg (fn), msgKind,
  //   edit: null | "interval" | "key" | "hooks" | "dims"   (an open inline editor)
  //   vals: {interval, key, hooks, dims}                    (typed values, kept across re-renders)
  //   errs: {interval, key, hooks, dims}                    (fn → message)
  var ui = {};
  function st(id) { return ui[id] || (ui[id] = { vals: {}, errs: {} }); }

  // A watch scheduled from a history run starts without an interval, so it
  // needs one before it runs. The key is optional, exactly as on the audit page
  // (self-hosted relays such as Ollama or LM Studio need none): history never
  // stores it, so the setup box offers it once, but never requires it.
  function needsInterval(w) { return w.interval_sec == null; }
  function needsSetup(w) { return needsInterval(w); }

  function minutesOf(raw) {
    raw = String(raw == null ? "" : raw).trim();
    if (!/^\d+$/.test(raw)) return null;
    var n = parseInt(raw, 10);
    return n >= 1 ? n : null;
  }
  function hooksOf(raw) {
    return String(raw == null ? "" : raw).split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function checkInterval(raw) {
    return minutesOf(raw) == null
      ? function () { return T("请选择运行间隔。", "Choose how often it runs."); }
      : null;
  }
  // The intervals offered (minutes). A monitor never runs more often than one
  // run takes: the server rounds the measured run time up to one of these.
  var STEPS = [5, 10, 15, 20, 30, 60, 120, 180, 240, 360, 480, 720, 1440];
  function minMinutes(w) { return Math.max(1, Math.round((w.min_interval_sec || 300) / 60)); }
  function fmtDuration(sec) {
    sec = Number(sec) || 0;
    if (sec < 60) return Tf("{n} 秒", "{n} s", { n: Math.max(1, Math.round(sec)) });
    if (sec < 3600) return Tf("{n} 分钟", "{n} min", { n: Math.round(sec / 6) / 10 });
    return Tf("{n} 小时", "{n} h", { n: Math.round(sec / 360) / 10 });
  }
  function checkKey(raw) {
    return String(raw == null ? "" : raw).trim()
      ? null
      : function () { return T("请填写 API 密钥（或 env:变量名）。", "Enter the API key (or env:VAR)."); };
  }
  // An embedding monitor's claimed vector length: 0 (or empty) takes it from the knowledge base.
  function dimsOf(raw) {
    raw = String(raw == null ? "" : raw).trim();
    if (raw === "") return 0;
    if (!/^\d+$/.test(raw)) return null;
    var n = parseInt(raw, 10);
    return n <= 65536 ? n : null;
  }
  function checkDims(raw) {
    return dimsOf(raw) == null
      ? function () { return T("请输入 0 到 65536 之间的整数。", "Enter a whole number from 0 to 65536."); }
      : null;
  }
  function checkHooks(raw) {
    var lines = hooksOf(raw);
    for (var i = 0; i < lines.length; i++) {
      if (!isHttpUrl(lines[i])) {
        var line = i + 1;
        return function () {
          return Tf("第 {n} 行不是以 http:// 或 https:// 开头的地址。", "Line {n} is not a URL starting with http:// or https://.", { n: line });
        };
      }
    }
    return null;
  }

  // ---- card pieces -------------------------------------------------------- //
  function isRunning(w) { return !!(w.running || st(w.id).running); }
  function badge(w) {
    if (isRunning(w)) return '<span class="badge sky"><span class="spin">' + icon("refresh") + "</span> " + esc(T("运行中", "Running")) + "</span>";
    if (needsSetup(w)) return '<span class="badge warn">' + esc(T("待设置", "Needs setup")) + "</span>";
    if (w.last_risk) {
      return '<span class="badge ' + (RISK_CLASS[w.last_risk] || "grey") + '">' + esc(riskLabel(w.last_risk)) + "</span>";
    }
    if (w.last_run_ts) return '<span class="badge grey">' + esc(T("无结果", "No result")) + "</span>";

  }
  function meta(dt, dd) {

  // Own copy of the pen glyph: a browser-cached older /icons.js has no "pen", which left an empty button.

    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
    '<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>';
  function linkBtn(act, id, label) {

  function saveCancel(act, id) {
    return '<div class="row">' +
      '<button type="button" class="btn sm pri" data-act="save-' + act + '" data-id="' + id + '">' + icon("check") + esc(T("保存", "Save")) + "</button>" +
      '<button type="button" class="btn sm" data-act="cancel" data-id="' + id + '">' + esc(T("取消", "Cancel")) + "</button></div>";
  }
  // The interval picker: the draft's setup and the configured card's editor share it.
  function intervalInput(w, s, small) {
    var v = s.vals.interval != null ? s.vals.interval : (w.interval_sec ? String(Math.round(w.interval_sec / 60)) : "");
    var floor = minMinutes(w);
    var steps = STEPS.filter(function (m) { return m >= floor; });
    if (!steps.length) steps = [STEPS[STEPS.length - 1]];
    var opts = "";
    if (!minutesOf(v)) opts += '<option value="" selected>' + esc(T("请选择…", "Choose…")) + "</option>";
    // an interval set before (outside the steps, or now below the run time) stays selectable as is
    if (minutesOf(v) && steps.indexOf(minutesOf(v)) < 0) {
      opts += '<option value="' + esc(v) + '" selected>' + esc(fmtEvery(minutesOf(v) * 60)) + "</option>";
    }
    steps.forEach(function (m) {
      opts += '<option value="' + m + '"' + (minutesOf(v) === m ? " selected" : "") + ">" + esc(fmtEvery(m * 60)) + "</option>";
    });
    var hint = w.run_duration_sec
      ? Tf("上次完整运行耗时 {d}，因此最短间隔为{every}。", "One full run took {d}, so it runs at most {every}.",
          { d: fmtDuration(w.run_duration_sec), every: fmtEvery(floor * 60) })
      : "";

      (small ? ' aria-label="' + esc(T("检测间隔", "Check interval")) + '"' : "") +
      ' aria-describedby="ivh-' + w.id + " ive-" + w.id + '"' + invalid(s.errs.interval) + ">" + opts + "</select>" +
      '<p class="hint" id="ivh-' + w.id + '">' + esc(hint) + "</p>" + err("ive-" + w.id, s.errs.interval);
  }
  // The key field, paired with the relay URL (a hidden username field) so the
  // browser's password manager can fill the key saved from the audit page.
  function keyInput(w, s, small) {
    return '<input class="sr-only" type="text" tabindex="-1" aria-hidden="true" readonly autocomplete="username"' +
      ' id="ku-' + w.id + '" value="' + esc(w.base_url || "") + '">' +
      '<input class="in mono" type="password" id="k-' + w.id + '" data-secret="ku-' + w.id + '" data-act="f-key" data-id="' + w.id + '"' +
      ' autocomplete="current-password" spellcheck="false" autocapitalize="off"' +
      ' placeholder="' + esc(T("sk-... 或 env:ZING_API_KEY", "sk-... or env:ZING_API_KEY")) + '"' +
      (small ? ' aria-label="' + esc(T("API 密钥", "API key")) + '"' : "") +

  function setupBox(w, s) {
    var fields = "";

    }

      fields += '<div><label class="lab" for="k-' + w.id + '">' + esc(T("API 密钥", "API key")) + ' <span class="opt">' + esc(T("（可选）", "(optional)")) + "</span></label>" + keyInput(w, s) +
        '<p class="hint">' + esc(T("检测历史不保存密钥。本地或自托管模型可留空。", "History never stores the key. Leave it empty for a local or self-hosted model.")) + "</p></div>";
    }

      '<div class="fields">' + fields + "</div>" +
      '<button type="submit" class="btn pri go" data-act="activate" data-id="' + w.id + '"' + (s.busy ? ' disabled aria-busy="true"' : "") + ">" +
      icon("play") + esc(T("启用监控", "Activate monitor")) + "</button></form>";

  function intervalCell(w, s) {

        esc(T("无法读取，请重新输入", "Unreadable – re-enter")) + "</span>" + linkBtn("edit-key", w.id, T("输入", "Enter"));

  // The profile pinned when the monitor was created: every run audits against

  function kbCell(w) {
    var kb = w.kb;

  // History link that pre-fills the relay / model / suite filters for this monitor.
  function historyHref(w, reportId) {
    var host = "";
    try { host = new URL(w.base_url).host; } catch (e) { host = w.base_url || ""; }
    var q = [["surface", w.surface && w.surface !== "chat" ? w.surface : ""],
      ["host", host], ["model", w.claimed_model || w.model || ""], ["suite", w.suite || ""]]
      .filter(function (p) { return p[1]; })
      .map(function (p) { return p[0] + "=" + encodeURIComponent(p[1]); }).join("&");
    return "/v2/history" + (q ? "?" + q : "") + "#r-" + reportId;
  }

  // Wire protocol: a forced one, or what "auto" detects for this endpoint.
  function protoCell(w) {
    var api = w.api_resolved || w.api || "auto";
    return "<code>" + esc(api) + "</code> · " +
      esc(w.api_auto ? T("自动识别", "auto-detected") : T("手动指定", "set manually"));
  }
  var STREAM = {

  // What the monitor audits: a chat endpoint, an embeddings one or a rerank one.
  var SURFACE = { chat: ["对话", "Chat"], embedding: ["嵌入", "Embeddings"], rerank: ["重排", "Reranking"] };
  function isChat(w) { return !w.surface || w.surface === "chat"; }

  // The embedding and rerank speed probes are gated like the chat one; monitors have no baseline.

      ' data-act="f-dims" data-id="' + w.id + '" aria-label="' + esc(T("声称维度", "Claimed dimension")) + '"' +

  function dimsCell(w, s) {

  function card(w) {
    var s = st(w.id);
    var name = w.name || "watch";
    var draft = needsSetup(w);
    var embed = w.surface === "embedding";
    // embeddings and rerank (any non-chat surface) do not stream: no streaming mode to show
    var tool = !isChat(w);
    var claimed = w.claimed_model && w.claimed_model !== w.model
      ? '<span class="aside">' + esc(T("声称的模型", "Claimed model")) + " <code>" + esc(w.claimed_model) + "</code></span>"
      : "";
    var lastParts = [];
    if (!draft || w.last_run_ts) {
      lastParts.push("<span>" + esc(T("上次运行", "Last run")) + ": <b>" + esc(fmtTime(w.last_run_ts)) + "</b></span>");
    }
    if (w.last_score != null) {
      lastParts.push("<span>" + esc(T("评分", "Score")) + " <b>" + esc(fmtScore(w.last_score)) + "</b>/100</span>");
    }
    if (w.last_report_id != null) {
      lastParts.push('<a href="' + esc(historyHref(w, w.last_report_id)) + '">' + esc(T("在检测历史中查看", "Open in history")) + " →</a>");
    }
    if (w.source_report_id != null) {
      lastParts.push('<a href="' + esc(historyHref(w, w.source_report_id)) + '">' + esc(Tf("来自运行 #{n}", "From run #{n}", { n: w.source_report_id })) + " →</a>");
    }
    var running = isRunning(w);
    if (!running) s.stopping = false;
    var waiting = !running && !draft && w.enabled;
    var actions;
    if (s.confirm) {
      actions =
        '<span class="ask" id="ask-' + w.id + '">' + esc(T("删除这个监控？", "Delete this monitor?")) + "</span>" +
        '<button type="button" class="btn danger" data-act="del-yes" data-id="' + w.id + '" aria-describedby="ask-' + w.id + '">' + icon("trash") + esc(T("删除", "Delete")) + "</button>" +
        '<button type="button" class="btn" data-act="del-no" data-id="' + w.id + '">' + esc(T("取消", "Cancel")) + "</button>";
    } else {
      // A draft can run once right away; the interval is only for the schedule.
      var run =
        running
          ? '<button type="button" class="btn danger" data-act="stop" data-id="' + w.id + '"' + (s.stopping ? ' disabled aria-busy="true"' : "") + ">" +
            icon("x") + esc(s.stopping ? T("正在取消…", "Cancelling…") : T("取消运行", "Cancel run")) + "</button>"
          : '<button type="button" class="btn' + (draft ? "" : " pri") + '" data-act="run" data-id="' + w.id + '">' +
            icon("play") + esc(T("立即运行", "Run now")) + "</button>";
      actions = run +
        '<button type="button" class="btn danger" data-act="del" data-id="' + w.id + '"' + (running ? " disabled" : "") + ">" + icon("trash") + esc(T("删除", "Delete")) + "</button>";
    }
    var stateLine = running
      ? '<span>' + esc(T("状态", "Status")) + ': <b>' + esc(w.queued
          ? T("排队中：等待该中转站上的另一项检测结束", "Queued: waiting for another audit of this relay to finish")
          : T("正在运行", "Running now")) + "</b></span>"
      : waiting ? '<span>' + esc(T("状态", "Status")) + ': <b>' + esc(T("等待下次计划运行", "Waiting for next scheduled run")) + "</b></span>" : "";
    if (stateLine) lastParts.unshift(stateLine);
    var pct = Math.max(0, Math.min(100, Number(w.progress) || 0));
    var progress = running
      ? '<div class="mon-prog"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"' +
        ' aria-label="' + esc(Tf("{name} 的运行进度", "Progress of {name}", { name: name })) + '"><span style="width:' + pct + '%"></span></div>' +
        "<b>" + pct + "%</b></div>"
      : "";
    var langLabel = T("告警语言", "Alert language");
    var thrLabel = T("告警阈值", "Alert threshold");
    var swText = draft ? T("待设置", "Needs setup") : w.enabled ? T("启用中", "Enabled") : T("已暂停", "Paused");
    // collapsed: name, status, URL, last run and progress stay; the settings,
    // the setup box and the actions are hidden
    var shut = isShut(w), hide = shut ? " hidden" : "";
    var controls = "md-" + w.id + " ma-" + w.id + (draft ? " sb-" + w.id : "");
    return (
      '<article class="card mon' + (w.enabled ? "" : " off") + '" id="w-' + w.id + '" data-id="' + w.id + '" aria-labelledby="mn-' + w.id + '">' +
        '<div class="mon-top">' +
          // the name is the collapse toggle: heading navigation still lands on it
          '<div class="mon-title"><h3 class="mon-name" id="mn-' + w.id + '"><button type="button" class="mtog" data-act="fold" data-id="' + w.id + '"' +
            ' aria-expanded="' + !shut + '" aria-controls="' + controls + '" title="' + esc(shut ? T("显示详情", "Show details") : T("隐藏详情", "Hide details")) + '">' +
            icon("chevronDown") + '<span class="t">' + esc(name) + "</span></button></h3>" + badge(w) + "</div>" +
          '<label class="switch"><input type="checkbox" role="switch" data-act="enabled" data-id="' + w.id + '"' + (w.enabled ? " checked" : "") +
            (draft ? " disabled" : "") + ' aria-labelledby="swl-' + w.id + '" aria-describedby="mn-' + w.id + " sws-" + w.id + '"><span></span> ' +
            '<span class="sw-l" id="swl-' + w.id + '">' + esc(T("监控生效", "Monitor active")) + "</span> " +
            '<em class="sw-t" id="sws-' + w.id + '">(' + esc(swText) + ")</em></label>" +
        "</div>" +
        '<div class="mon-body">' +
          '<div class="mon-url">' + esc(w.base_url || "") + "</div>" +
          '<dl class="mon-meta" id="md-' + w.id + '"' + hide + ">" +
            meta(T("请求的模型", "Model to request"), "<code>" + esc(w.model || "?") + "</code>" + claimed) +
            meta(T("接口类型", "Endpoint type"), surfaceCell(w)) +
            meta(T("测试套件", "Test suite"), "<code>" + esc(w.suite || "standard") + "</code>" +
              (w.suite === "custom" && (w.dimensions || []).length ? " <code>" + esc(w.dimensions.join(", ")) + "</code>" : "") +
              (tool ? toolPerfNote(w) : "")) +
            meta(T("协议", "Protocol"), protoCell(w)) +
            (embed ? meta(T("声称维度", "Claimed dimension"), dimsCell(w, s))
              : tool ? "" : meta(T("性能探测请求", "Performance probe requests"), streamCell(w))) +
            meta(T("检测间隔", "Check interval"), intervalCell(w, s)) +
            meta(T("API 密钥", "API key"), keyCell(w, s)) +
            meta(thrLabel, '<select class="in" data-act="alert" data-id="' + w.id + '" aria-label="' + esc(thrLabel + " — " + name) + '">' + thresholdOptions(w.alert_on || "medium") + "</select>") +
            meta(T("Webhook", "Webhooks"), hooksCell(w, s)) +
            meta(langLabel, '<select class="in" data-act="lang" data-id="' + w.id + '" aria-label="' + esc(langLabel + " — " + name) + '">' + langOptions(w.language) + "</select>") +
            meta(T("知识库资料", "Knowledge profile"), kbCell(w)) +
          "</dl>" +
          (lastParts.length ? '<div class="mon-last">' + lastParts.join("") + "</div>" : "") +
        "</div>" +
        progress +
        (draft ? setupBox(w, s) : "") +
        '<div class="mon-msg ' + (s.msgKind || "") + '" role="status">' + (s.msg ? esc(s.msg()) : "") + "</div>" +
        '<div class="mon-act" id="ma-' + w.id + '"' + hide + ">" + actions + "</div>" +
      "</article>"
    );
  }

  // ---- collapsed cards (per viewer; storage may be missing or throw) ------- //
  var CKEY = "zing.v2.monitors.collapsed", FKEY = "zing.v2.monitors.filters", OKEY = "zing.v2.monitors.filtersOpen";
  function loadJSON(k, dflt) {
    try { var v = JSON.parse(localStorage.getItem(k) || "null"); return v && typeof v === "object" ? v : dflt; } catch (e) { return dflt; }
  }
  function saveJSON(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ }
  }
  var collapsed = (function () {
    var c = loadJSON(CKEY, {}), out = {};
    Object.keys(c).forEach(function (k) { if (c[k] === true) out[k] = true; });
    return out;
  })();
  function isShut(w) { return !!collapsed[w.id]; }
  function setShut(id, shut) {
    var s = st(id);
    if (shut) {
      collapsed[id] = true;
      // an open editor or delete question goes with the hidden part
      s.edit = null; s.vals = {}; s.errs = {}; s.confirm = false;
    } else {
      delete collapsed[id];
    }
  }
  function paintTools(shown) {
    var box = $("mon-tools"), b = $("mall");
    box.hidden = shown.length < 2;
    var anyOpen = shown.some(function (w) { return !isShut(w); });
    b.setAttribute("data-all", anyOpen ? "collapse" : "expand");
    b.textContent = anyOpen ? T("全部折叠", "Collapse all") : T("全部展开", "Expand all");
  }
  $("mall").addEventListener("click", function () {
    var shut = this.getAttribute("data-all") === "collapse";
    (watches || []).filter(matches).forEach(function (w) { setShut(w.id, shut); });
    saveJSON(CKEY, collapsed);
    render();
  });

  // ---- filters (filterpanel.js) ------------------------------------------- //
  var FDEF = { q: "", status: "", risk: "", surface: "", host: "", suite: "" };
  var F = (function () {

    if (F.surface && surfaceOf(w) !== F.surface) return false;
    if (F.host && hostOf(w) !== F.host) return false;
    if (F.suite && suiteOf(w) !== F.suite) return false;

  // the values that exist (in a fixed order where there is one); the current
  // pick stays listed even when no monitor has it any more
  function distinct(fn, cur, order) {

      risk: distinct(riskOf, F.risk, ["high", "medium", "low", "clean", "inconclusive", "none"]).map(function (v) { return { v: v, t: riskName(v) }; }),
      surface: distinct(surfaceOf, F.surface, ["chat", "embedding", "rerank"]).map(function (v) { return { v: v, t: surfaceName(v) }; }),
      host: distinct(hostOf, F.host).map(function (v) { return { v: v, t: v }; }),

  var FLABEL = {
    status: ["状态", "Status"], risk: ["上次风险", "Last risk"], surface: ["接口类型", "Endpoint type"],
    host: ["中转站 / 厂商", "Relay / provider"], suite: ["套件", "Suite"],

  // Runs started by the scheduler (or another tab) finish without the page

  // soon as the tab is visible again.
  var pollTimer = null, pollDue = false;
  function schedulePoll() {

  function load() {

      .then(function (r) {

      .then(function (rows) {

  // Saving or using an API key may need the master key first: ZingMasterKey

  function withKey(doFetch) {

  function patch(id, body) {

        headers: { "Content-Type": "application/json" },

      });

      return r.json().catch(function () { return {}; }).then(function (j) {

  // Draft: validate the missing fields, then set them and switch it on in one PATCH.
  function activate(id) {
    var w = byId(id), s = st(id);

  // typed values survive re-renders (another card's load() repaints the whole list)

  $("list").addEventListener("click", function (ev) {

          } else if (rep) {

  $("list").addEventListener("keydown", function (ev) {

  $("list").addEventListener("change", function (ev) {

    } else if (act === "lang" || act === "alert") {
      var body = act === "lang" ? { language: t.value } : { alert_on: t.value };
      patch(id, body).then(function () {
        s.msgKind = "ok";
        s.msg = act === "lang"
          ? function () { return T("告警语言已保存。", "Alert language saved."); }
          : function () { return T("告警阈值已保存。", "Alert threshold saved."); };
        return load();
      }, function (e) {
        failMsg(id, e);
        load();
      });
    }
  });

  // /v2/watches#w-<id>: arriving from History's "Schedule as monitor", or
  // "Open monitor" in the Running list (same page: a hashchange)
  var m = /^#w-(\d+)$/.exec(location.hash || "");
  if (m) {
    flashId = m[1];
    focusSetup = true;
  }

  // ---------- API key storage: the user's choice, and the page notice ----------
  // The radios pick where API keys are kept; the notice (notice.js) says which
  // mode is in effect, asks before a switch, reports its outcome, and names the
  // monitors that wait for a key. Most important message first:
  // critical: status unreachable / switch failed; warning: a switch to confirm
  // (stop storing), keys to re-enter, master key locked; info: a switch to
  // confirm (store) or the mode in effect; success: the switch just done.
  var ks = { st: null, err: false, ask: null, fail: null, done: null, busy: false };

  function keysStored(c) {
    c = c || {};
    return (c.encrypted || 0) + (c.locked || 0) + (c.plain || 0);
  }
  function countOf(status) {
    return (watches || []).filter(function (w) { return w.key_status === status; }).length;
  }
  function loadSecret() {
    return fetch("/api/secret")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) { ks.st = d; ks.err = false; }, function () { ks.err = true; })
      .then(function () { paintStorage(); paintNote(); });
  }
  function paintStorage() {
    var mode = ks.ask || (ks.st && ks.st.storage);
    ["memory", "encrypted"].forEach(function (m) {
      var r = $("ks-" + m);
      r.checked = m === mode;
      r.disabled = !ks.st || ks.busy;
    });
    // the hint explains the option that is checked (in effect, or about to be)
    $("ks-hint").textContent = !mode ? "" : mode === "memory"
      ? T("API 密钥只保存在 zing serve 的内存中，从不写入磁盘；每次重启后需重新输入。需要无人值守运行的监控可使用 env:变量名。",
        "API keys stay in the memory of zing serve and are never written to disk; enter them again after each restart. Use env:VAR for monitors that must run unattended.")
      : T("API 密钥加密保存在本机 ~/.zing/watches.db 中；用于解密的主密钥从不写入磁盘，每次重启后需输入。",
        "API keys are stored encrypted in ~/.zing/watches.db on this machine; the master key that decrypts them is never written to disk — enter it after each restart.");
    $("reassure-text").innerHTML = ks.st && ks.st.storage === "encrypted"
      ? T("全程<b>本地运行</b>。API Key 仅<b>加密</b>保存在本机 <b>~/.zing</b> 的本地数据库里，<b>绝不</b>出现在监控列表里、也不会发给浏览器。用于解密的主密钥<b>从不写入磁盘</b>：由你保管，每次重启后再输入。",
        "Everything <b>runs locally</b>. The API key is stored <b>encrypted</b>, only in the local database under <b>~/.zing</b> on this machine; it <b>never</b> appears in the monitor list and is never sent to the browser. The master key that decrypts it is <b>never written to disk</b>: you keep it, and enter it after each restart.")
      : T("全程<b>本地运行</b>。API Key <b>不会被保存</b>：它只留在 zing serve 的内存中，<b>绝不</b>写入磁盘、出现在监控列表里或发给浏览器。zing serve 重启后请重新输入。",
        "Everything <b>runs locally</b>. The API key is <b>not stored</b>: it stays in the memory of zing serve only and is <b>never</b> written to disk, shown in the monitor list or sent to the browser. Enter it again after zing serve restarts.");
  }
  function paintNote() {
    var n = null, c = (ks.st && ks.st.counts) || {};
    var missing = countOf("missing"), unreadable = countOf("unreadable"), locked = countOf("locked");
    if (ks.err) {
      n = { level: "critical", title: T("无法读取密钥状态", "The key status cannot be read"),
        detail: T("本地服务已停止或重启。", "The local server stopped or restarted."),
        actions: [{ act: "retry", label: T("重试", "Retry"), primary: true }] };
    } else if (ks.ask === "memory") {
      var stored = keysStored(c);
      n = { level: ks.fail ? "critical" : "warning", title: T("不再保存 API 密钥？", "Stop storing API keys?"),
        detail: stored
          ? (stored === 1 ? T("已保存的 1 个 API 密钥将移入 zing serve 的内存，并从 watches.db 中清除；主密钥不再需要。zing serve 重启后需重新输入，相关监控会等待。",
            "The 1 stored API key moves into the memory of zing serve and is erased from watches.db; the master key is no longer needed. After a restart of zing serve you enter it again; its monitor waits until then.")
            : Tf("已保存的 {n} 个 API 密钥将移入 zing serve 的内存，并从 watches.db 中清除；主密钥不再需要。zing serve 重启后需重新输入，相关监控会等待。",
            "The {n} stored API keys move into the memory of zing serve and are erased from watches.db; the master key is no longer needed. After a restart of zing serve you enter them again; their monitors wait until then.", { n: stored }))
          : T("之后输入的 API 密钥只保存在 zing serve 的内存中，重启后需重新输入。",
            "API keys you enter from now on stay in the memory of zing serve only; enter them again after a restart."),
        items: ks.fail ? [ks.fail] : null,
        actions: [{ act: "ks-yes", label: T("不再保存", "Stop storing keys"), primary: true },
          { act: "ks-no", label: T("取消", "Cancel") }] };
    } else if (ks.ask === "encrypted") {
      var held = c.memory || 0;
      n = { level: ks.fail ? "critical" : "info", icon: "lock", title: T("在本机加密保存 API 密钥？", "Store API keys encrypted on this machine?"),
        detail: T("API 密钥将用主密钥加密后保存在 ~/.zing/watches.db 中，重启后监控照常运行。主密钥从不写入磁盘：你现在创建（或输入）它，每次重启后再输入。",
          "API keys are kept in ~/.zing/watches.db, encrypted with a master key, so monitors keep their keys across restarts. The master key is never written to disk: you create (or enter) it now and enter it after every restart.") +
          (held ? " " + (held === 1 ? T("内存中的 1 个密钥会被保存。", "The 1 key held in memory is stored.")
            : Tf("内存中的 {n} 个密钥会被保存。", "The {n} keys held in memory are stored.", { n: held })) : ""),
        items: ks.fail ? [ks.fail] : null,
        actions: [{ act: "ks-yes", label: T("加密保存", "Store encrypted"), primary: true },
          { act: "ks-no", label: T("取消", "Cancel") }] };
    } else if (ks.done) {
      var m = ks.done.moved || 0;
      n = ks.done.mode === "memory"
        ? { level: "success", title: T("API 密钥不再保存", "API keys are no longer stored"),
          detail: (m ? (m === 1 ? T("1 个密钥已移入内存，并已从 watches.db 中清除。", "1 key moved into memory and was erased from watches.db.")
            : Tf("{n} 个密钥已移入内存，并已从 watches.db 中清除。", "{n} keys moved into memory and were erased from watches.db.", { n: m })) + " " : "") +
            T("zing serve 重启后需重新输入。", "Enter them again after a restart of zing serve.") }
        : { level: "success", title: T("API 密钥现已加密保存", "API keys are now stored encrypted"),
          detail: (m ? (m === 1 ? T("1 个密钥已加密保存到 watches.db。", "1 key was encrypted into watches.db.")
            : Tf("{n} 个密钥已加密保存到 watches.db。", "{n} keys were encrypted into watches.db.", { n: m })) + " " : "") +
            T("每次重启后输入主密钥。", "Enter the master key after each restart.") };
      n.actions = [{ act: "ks-change", label: T("更改", "Change") }];
      // monitors that still wait for a key are named under the outcome
      if (missing + unreadable) {
        n.items = [missing + unreadable === 1 ? T("1 个监控需要重新输入 API 密钥。", "1 monitor needs its API key again.")
          : Tf("{n} 个监控需要重新输入 API 密钥。", "{n} monitors need their API key again.", { n: missing + unreadable })];
        n.actions.unshift({ act: "show-key", label: T("查看", "Show"), primary: true });
      }
    } else if (missing || unreadable) {
      var k = missing + unreadable;
      n = { level: "warning",
        title: k === 1 ? T("1 个监控需要重新输入 API 密钥", "1 monitor needs its API key again")
          : Tf("{n} 个监控需要重新输入 API 密钥", "{n} monitors need their API key again", { n: k }),
        detail: missing
          ? T("API 密钥不保存，zing serve 重启后已丢失。这些监控会等待，直到你重新输入密钥。",
            "API keys are not stored, so they were lost when zing serve restarted. These monitors wait until you enter the key again.")
          : T("加密它们的主密钥已丢失或更换。", "The master key that encrypted them was lost or changed."),
        actions: [{ act: "show-key", label: T("查看", "Show"), primary: true }] };
    } else if (locked && ks.st && ks.st.state === "locked") {
      n = { level: "warning", icon: "lock", title: T("主密钥已锁定", "Master key locked"),
        detail: locked === 1 ? T("1 个使用已加密 API 密钥的监控在等待你输入主密钥。", "1 monitor with an encrypted API key waits until you enter it.")
          : Tf("{n} 个使用已加密 API 密钥的监控在等待你输入主密钥。", "{n} monitors with an encrypted API key wait until you enter it.", { n: locked }),
        actions: [{ act: "unlock", label: T("解锁", "Unlock"), primary: true }] };
    } else if (ks.st) {
      n = ks.st.storage === "memory"
        ? { level: "info", icon: "lock", title: T("API 密钥不会被保存", "API keys are not stored"),
          detail: T("你输入的密钥只留在 zing serve 的内存中，从不写入磁盘；重启后需重新输入。env: 变量引用照常工作。",
            "Keys you enter stay in the memory of zing serve only and are never written to disk; enter them again after a restart. env:VAR references keep working.") }
        : { level: "info", icon: "lock", title: T("API 密钥已加密保存", "API keys are stored encrypted"),
          detail: T("保存在本机 ~/.zing/watches.db 中；用于解密的主密钥从不写入磁盘。",
            "In ~/.zing/watches.db on this machine; the master key that decrypts them is never written to disk.") };
      n.actions = [{ act: "ks-change", label: T("更改", "Change") }];
    }
    window.ZingNotice.show($("note"), n);
  }
  function focusNote(act) {
    var b = $("note").querySelector('[data-note-act="' + act + '"]');
    if (b) b.focus();
  }
  function focusStorage() {
    var r = document.querySelector('input[name="keystore"]:checked') || $("ks-memory");
    r.focus();
  }
  function askStorage(mode) {
    ks.ask = ks.st && mode !== ks.st.storage ? mode : null;
    ks.fail = null;
    ks.done = null;
    // focus stays on the radio (no change of context on input): the notice,
    // a status region, announces the question and holds the confirm button
    paintStorage();
    paintNote();
  }
  function switchStorage() {
    var mode = ks.ask;
    if (!mode || ks.busy || !window.ZingMasterKey) return;
    ks.busy = true;
    paintStorage();
    window.ZingMasterKey.setStorage(mode).then(function (res) {
      ks.busy = false;
      if (res.ok) {
        ks.ask = null;
        ks.fail = null;
        ks.done = { mode: mode, moved: res.body.moved || 0 };
        ks.st = res.body;
      } else if (res.status === 423) {
        // the master key dialog was cancelled: nothing changed
        ks.fail = mode === "encrypted"
          ? T("需要先创建或输入主密钥。", "A master key has to be created or entered first.")
          : T("需要先输入主密钥，才能取出已保存的密钥。", "Enter the master key first, so the stored keys can be moved.");
      } else {
        var e = res.body && res.body.error;
        ks.fail = e ? L.server(e) : T("出错了，请重试。", "Something went wrong — please try again.");
      }
      paintStorage();
      paintNote();
      focusNote(ks.ask ? "ks-yes" : "ks-change");
      load();
      return loadSecret();
    }, function () {
      ks.busy = false;
      ks.fail = T("出错了，请重试。", "Something went wrong — please try again.");
      paintStorage();
      paintNote();
    });
  }
  $("keystore").addEventListener("change", function (ev) {
    if (ev.target && ev.target.name === "keystore") askStorage(ev.target.value);
  });
  $("note").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-note-act]");
    if (!b) return;
    var act = b.getAttribute("data-note-act");
    if (act === "retry") loadSecret();
    else if (act === "ks-yes") switchStorage();
    else if (act === "ks-no") { askStorage(null); focusStorage(); }
    else if (act === "ks-change") focusStorage();
    else if (act === "unlock" && window.ZingMasterKey) {
      window.ZingMasterKey.ensure().then(function (ok) { if (ok) { load(); loadSecret(); } });
    } else if (act === "show-key") {
      var w = (watches || []).filter(function (x) { return x.key_status === "missing" || x.key_status === "unreadable"; })[0];
      if (w) location.hash = "#w-" + w.id;
    }
  });
  window.addEventListener("zing:masterkey", function () { loadSecret(); });

  // ---------- tabs: Configure / Running (v2/tabs.js, v2/jobs.js) ----------
  document.querySelectorAll("[data-icon]").forEach(function (el) { el.innerHTML = icon(el.getAttribute("data-icon")); });
  var tabs = window.ZingTabs.init(document.querySelector(".tabs[role=tablist]"), {
    // #w-<id> deep links name a monitor in the Configure tab
    fromHash: function (h) { return /^w-/.test(h) ? "configure" : h; },
  });
  window.addEventListener("hashchange", function () {
    var h = /^#w-(\d+)$/.exec(location.hash || "");
    if (!h) return;
    tabs.select("configure", false, true);
    flashId = h[1];
    focusSetup = true;
    render();
  });
  window.ZingJobs.init($("jobs"), {
    kind: "monitor",
    onChange: function (active, rows) {
      // the tab stays selectable while nothing runs: the panel says so;
      // the count names the active runs
      $("jobs-empty").hidden = rows > 0;
      $("run-count").textContent = active > 0 ? String(active) : "";
    },
    // a finished run changes the monitor's last-run status
    onFinish: function () { load(); },
  });

  $("lock-icon").innerHTML = icon("lock");
  if (window.ZingMasterKey) window.ZingMasterKey.mountBar($("mk-bar"), function () { load(); loadSecret(); });
  // language switch: re-render everything in place
  window.addEventListener("zing:lang", function () { filtersKey = null; render(); paintStorage(); paintNote(); });
  load();
  loadSecret();
})();
</script>
</body>
</html>
