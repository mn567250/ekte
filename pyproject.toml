[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekte"
version = "0.33.1"
description = "LLM relay reality check: audit whether an API relay actually serves the model it claims, from the command line, a local web UI, an HTTP API or CI."
dynamic = ["readme"]  # README.md with absolute links: scripts/hatch_readme.py
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "ekte contributors" }]
keywords = [
    "llm",
    "openai",
    "api",
    "relay",
    "proxy",
    "audit",
    "model-fingerprinting",
    "context-window",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # PDF reports: pure Python, BSD-licensed, no system libraries.
    "reportlab>=4.0",
    # Evidence files (raw request/response pairs, ekte.evidence): zstd streams.
    "zstandard>=0.22",
    # Windows ships no IANA time zone database; zoneinfo needs it for the
    # analytics time zones.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Token counts always use the built-in heuristic (no runtime downloads, so ekte
# runs in restricted environments); the empty extra keeps older install commands
# working (zing-audit[tokenizers] -> `pip install 'ekte[tokenizers]'`).
tokenizers = []
# Local web UI: `ekte serve`.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Encrypts the API keys stored for monitors (ekte/secretbox.py).
    "cryptography>=42",
]
# Accessibility tests of the web UI (tests/a11y, `pytest -m a11y`): a real
# browser via Playwright; run `playwright install chromium` once.
a11y = ["playwright>=1.47"]
# PDF reports are part of the core install now; the empty extra keeps older
# install commands working (zing-audit[pdf] -> `pip install 'ekte[pdf]'`).
pdf = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # parallel runs: pytest -n auto (the a11y suite keeps one report per worker)
    "pytest-xdist>=3.5",
    # per-test time limit (tool.pytest.ini_options): a hung test fails with
    # its name and every thread's stack instead of stalling CI
    "pytest-timeout>=2.3",
    # coverage floor in CI (tool.coverage in this file)
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # reads exported PDFs back in the tests
    "pypdf>=4.0",
    # validates real outputs against the published JSON Schemas
    "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/mn567250/ekte"
Repository = "https://github.com/mn567250/ekte"
Issues = "https://github.com/mn567250/ekte/issues"

[project.scripts]
ekte = "ekte.cli:run"

[tool.hatch.build.targets.wheel]
# packages=["ekte"] already bundles ekte/knowledge/data/*.yaml (data/ is a real
# subpackage). Do NOT also force-include them — that adds a second file at the same
# archive path and aborts the wheel build.
packages = ["ekte"]

[tool.hatch.metadata.hooks.custom]
path = "scripts/hatch_readme.py"

[tool.hatch.build.targets.sdist]
# Ship the source the package needs; keep scratch/reference material out of the
# sdist (there is no .git here, so hatchling can't infer it from VCS).
include = [
    "/ekte",
    "/tests",
    "/docs",
    "/examples",
    "/scripts/hatch_readme.py",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
# Third-party test files are not redistributed (NOTICE; scripts/check_dist_contents.py):
# axe-core is MPL-2.0; the a11y tests skip when it is absent.
exclude = ["/tests/a11y/vendor/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# pytest-timeout: no test (setup, call and teardown together) may take longer.
# The slowest unit tests take about 5 s; a hung one fails after this long with
# its node id and pytest-xdist replaces the worker. "thread" works on every OS
# (signal is POSIX-only) and catches a test blocked in C code. Slow on purpose?
# @pytest.mark.timeout(seconds) on that test. The browser tests (tests/a11y)
# get A11Y_TIMEOUT from tests/a11y/conftest.py instead.
# Under pytest-xdist, pytest-timeout's stack dump goes to the worker's stderr
# and is lost; CI passes -o faulthandler_timeout=<a little less>, whose dump
# reaches the log (.github/workflows/ci.yml).
timeout = 120
timeout_method = "thread"
markers = [
    "a11y: browser accessibility tests of web UI v2 (BITV 2.0 / EN 301 549 / WCAG 2.1 AA); need the a11y extra",
    "bitv(*steps): the BITV 2.0 / EN 301 549 test steps (\"9.1.4.3\", …) an a11y test decides (axe=True: only through axe rule results); feeds the conformance report (tests/a11y/results.py)",
]

[tool.coverage.run]
source = ["ekte"]

[tool.coverage.report]
# whole-package floor; the floors for the command line, the judge and the media
# auditor are in scripts/check_coverage.py (docs/reference/stability.md#os)
fail_under = 93
skip_empty = true

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
