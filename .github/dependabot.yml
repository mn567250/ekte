version: 2
updates:
  # Python dependencies and uv.lock. pyproject.toml ranges stay open; the
  # lockfile pins the tested set, so this only refreshes the lockfile.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
