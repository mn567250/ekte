name: Knowledge base update
description: Add or correct a provider or model entry in the knowledge base
labels: ["knowledge-base"]
body:
  - type: input
    id: provider
    attributes:
      label: Provider
    validations:
      required: true
  - type: input
    id: model_id
    attributes:
      label: Model id
      description: The exact id as sent in API requests
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: New entry, or the field and value to correct
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Link to the provider documentation or announcement
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date of the source
      description: YYYY-MM-DD
    validations:
      required: true
