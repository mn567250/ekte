# Example consumer workflow for the `ekte relay audit` composite action.
#
# Copy this into your own repo (or use the action directly from mn567250/ekte).
# It runs a relay health audit on a daily schedule and on demand, then gates a
# follow-up step on the result. The relay key comes from a repository secret —
# create one named RELAY_API_KEY under Settings → Secrets and variables → Actions.
name: Relay audit

on:
  schedule:
    # 06:00 UTC every day. Adjust to taste.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      fail-on-risk:
        description: "Fail the run when risk >= this level."
        required: false
        default: "high"
        type: choice
        options: ["low", "medium", "high"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit relay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # This copy runs the action from the same checkout (uses: ./). In your own
      # repo, drop the checkout and pin the action to the full commit SHA of an
      # ekte release instead, with the version in a comment:
      #   uses: mn567250/ekte@<full-commit-sha> # vX.Y.Z
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit the relay
        id: ekte
        uses: ./
        with:
          base-url: https://relay.example.com/v1
          api-key: ${{ secrets.RELAY_API_KEY }}
          model: gpt-4o
          claimed-model: gpt-4o
          declared-provider: openai
          suite: standard
          fail-on-risk: ${{ inputs.fail-on-risk || 'high' }}
          # version: ekte==X.Y.Z   # optional: pin the CLI too

      - name: Show the verdict
        # `always()` so this still reports even when the gate above failed.
        if: always()
        env:
          RISK: ${{ steps.ekte.outputs.risk }}
          SCORE: ${{ steps.ekte.outputs.score }}
          RATING: ${{ steps.ekte.outputs.rating }}
        run: |
          echo "risk=$RISK"
          echo "score=$SCORE"
          echo "rating=$RATING"
