name: Security

on:
  pull_request:
  push:
    branches: [main]
  # new advisories appear without code changes
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vulnerabilities:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install --upgrade pip && pip install uv pip-audit pyyaml

      - name: Audit uv.lock
        # fails on any known vulnerability not covered by an unexpired entry in
        # .github/vulnerability-ignores.yml
        run: python scripts/check_vulnerabilities.py
