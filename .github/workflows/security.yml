name: Security

on:
  pull_request:
  push:
    branches: [main]
  # new advisories appear without code changes
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerabilities:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install --upgrade pip && pip install uv pip-audit pyyaml

      - name: Audit uv.lock
        # fails on any known vulnerability not covered by an unexpired entry in
        # .github/vulnerability-ignores.yml
        run: python scripts/check_vulnerabilities.py
