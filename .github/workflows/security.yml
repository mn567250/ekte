name: Security

on:
  pull_request:
  push:
    branches: [main]
  # new advisories appear without code changes
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vulnerabilities:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install --upgrade pip && pip install uv pip-audit pyyaml

      - name: Audit uv.lock
        # fails on any known vulnerability not covered by an unexpired entry in
        # .github/vulnerability-ignores.yml
        run: python scripts/check_vulnerabilities.py
