name: Distribution contents

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dist-contents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build and check wheel and sdist
        run: uv run --no-project python scripts/check_dist_contents.py
