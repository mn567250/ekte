name: Distribution contents

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dist-contents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build wheel and sdist
        run: uv build --out-dir dist
      - name: Check wheel and sdist contents and the PyPI description links
        run: uv run --no-project python scripts/check_dist_contents.py dist
      - name: Check that PyPI can render the description
        run: uvx --from 'twine==7.0.0' twine check --strict dist/*
