name: CI

on:
  push:
    branches: [main, a11y/integration, perf/integration, analytics/integration]
  pull_request:
    branches: [main, a11y/integration, perf/integration, analytics/integration]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev,web]'

      - name: Lint (ruff)
        run: ruff check zing tests

      - name: Type-check (mypy)
        run: mypy zing

      - name: Test (pytest)
        # pytest-xdist (dev extra): one worker per CPU
        run: pytest -q -n auto

  a11y:
    # Browser accessibility tests of web UI v2 (BITV 2.0 / EN 301 549 /
    # WCAG 2.1 AA), see docs/ACCESSIBILITY.md. Informational for now:
    # continue-on-error keeps known violations from failing the run. Drop it
    # (and make the check required) once the suite is green.
    # Split into 4 parallel shards (ZING_A11Y_SHARD, tests/a11y/conftest.py),
    # each on its own runner; a11y-report merges their results.
    name: accessibility ${{ matrix.shard }}/4 (informational)
    # Slow browser suite: not on PRs into the perf integration branch (it runs
    # on the integration branch's own pushes and on its PR into main).
    if: github.event_name != 'pull_request' || github.base_ref != 'perf/integration'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,web,a11y]'
          playwright install --with-deps chromium
      - name: Test (pytest -m a11y, shard ${{ matrix.shard }}/4)
        env:
          ZING_A11Y_SHARD: ${{ matrix.shard }}/4
          # per-step results for the BITV conformance report (tests/a11y/results.py)
          ZING_A11Y_RESULTS: a11y-results-${{ matrix.shard }}.json
          # findings, one file per xdist worker (tests/a11y/harness.py)
          ZING_A11Y_REPORT: a11y-report-${{ matrix.shard }}.json
        run: pytest tests/a11y -m a11y -n auto --dist worksteal -q -p no:cacheprovider
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-shard-${{ matrix.shard }}
          path: |
            a11y-report*.json
            a11y-results-*.json
          if-no-files-found: ignore

  a11y-report:
    # One conformance report from all shards, plus the optional LLM review.
    name: accessibility report (informational)
    needs: a11y
    # not on PRs into the perf integration branch, like the a11y job
    if: always() && (github.event_name != 'pull_request' || github.base_ref != 'perf/integration')
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # only whether the secret exists; the key itself is passed to one step
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: a11y-shard-*
          merge-multiple: true
      - name: Conformance report (bitv-report.json)
        # standard library only; merges the shards' results
        run: python -m tests.a11y.conformance --results a11y-results-*.json --out bitv-report.json
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            a11y-report*.json
            a11y-results-*.json
            bitv-report.json
          if-no-files-found: ignore
      # Optional advisory LLM review of texts (tests/a11y/README.md); runs
      # only when the ANTHROPIC_API_KEY secret is configured, never blocks.
      - name: Install (LLM review)
        if: always() && env.HAS_ANTHROPIC_API_KEY == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,web,a11y]'
          playwright install --with-deps chromium
      - name: LLM review (advisory)
        if: always() && env.HAS_ANTHROPIC_API_KEY == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m tests.a11y.llm_review --out a11y-llm-review.json
      - name: Upload LLM review
        if: always() && env.HAS_ANTHROPIC_API_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a11y-llm-review
          path: a11y-llm-review.json
          if-no-files-found: ignore

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: python -m pip install --upgrade build && python -m build
      - name: Verify the wheel imports and loads the knowledge base
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/zing --version
          /tmp/verify/bin/zing kb >/dev/null
