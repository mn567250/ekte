name: CI

on:
  push:
    branches: [main, "*/integration"]
  pull_request:
    branches: [main, "*/integration"]
  # nightly full accessibility run (the other jobs skip it)
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Linux: every supported Python. macOS and Windows: the oldest and the
        # newest supported Python (docs/reference/stability.md#os).
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - {os: macos-latest, python-version: "3.11"}
          - {os: macos-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.11"}
          - {os: windows-latest, python-version: "3.14"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev,web]'

      - name: Lint (ruff)
        run: ruff check ekte tests

      - name: Type-check (mypy)
        run: mypy ekte

      - name: Test (pytest)
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        # pytest-xdist (dev extra): one worker per CPU
        run: pytest -q -n auto

      - name: Test with coverage (pytest-cov)
        # One Linux run measures coverage: the whole package must stay above
        # [tool.coverage.report] fail_under, and the command line, the judge
        # and the media auditor above their floors (scripts/check_coverage.py).
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pytest -q -n auto --cov=ekte --cov-report=term-missing:skip-covered --cov-report=json
          python scripts/check_coverage.py coverage.json

  a11y-scope:
    # Which pages the a11y suite tests on this run (tests/a11y/pages.py):
    # everything on pushes (main and the integration branches), the nightly
    # run and manual runs; on pull requests only the pages the PR's changes
    # can affect (none for a docs-only PR, all of them when a shared or
    # unmapped UI file changes).
    name: accessibility scope
    # not on PRs into the perf integration branch (see the a11y job)
    if: github.event_name != 'pull_request' || github.base_ref != 'perf/integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.scope.outputs.run }}
      full: ${{ steps.scope.outputs.full }}
      pages: ${{ steps.scope.outputs.pages }}
      reason: ${{ steps.scope.outputs.reason }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the whole history (commits and trees, no old file contents) for
          # the PR's merge base
          fetch-depth: 0
          filter: blob:none
      - name: Pages to test
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # standard library only: the runner's python3, no setup
        run: |
          case "$EVENT" in
            pull_request)
              python3 -m tests.a11y.affected --base "$BASE_SHA" --head "$HEAD_SHA" --github-output ;;
            push) python3 -m tests.a11y.affected --full "push to $GITHUB_REF_NAME" --github-output ;;
            schedule) python3 -m tests.a11y.affected --full "nightly run" --github-output ;;
            *) python3 -m tests.a11y.affected --full "$EVENT" --github-output ;;
          esac

  a11y:
    # Browser accessibility tests of web UI v2 (BITV 2.0 / EN 301 549 /
    # WCAG 2.1 AA), see docs/dev/accessibility.md. Informational for now:
    # continue-on-error keeps known violations from failing the run. Drop it
    # (and make the check required) once the suite is green.
    # Parallel jobs from a11y-scope's matrix: a full run is 4 round-robin
    # shards (EKTE_A11Y_SHARD, tests/a11y/conftest.py); a partial run selects
    # its pages (EKTE_A11Y_PAGES) and shares them out over 1-4 jobs by their
    # weight (tests/a11y/pages.py). a11y-report merges the results.
    name: accessibility ${{ matrix.shard }}${{ matrix.pages != 'all' && format(' {0}', matrix.pages) || '' }} (informational)
    needs: a11y-scope
    # Slow browser suite: not on PRs into the perf integration branch (it runs
    # on the integration branch's own pushes and on its PR into main; the
    # scope job is skipped there, and so is this one), and not when the
    # change affects no page.
    if: needs.a11y-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.a11y-scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,web,a11y]'
          echo "playwright=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.install.outputs.playwright }}
      - name: Install Chromium
        # the system libraries still come from apt; the browser itself from
        # the cache when this Playwright version was installed before
        run: playwright install --with-deps chromium
      - name: Test (pytest -m a11y, pages ${{ matrix.pages }}, shard ${{ matrix.shard }})
        env:
          EKTE_A11Y_PAGES: ${{ matrix.pages }}
          EKTE_A11Y_SHARD: ${{ matrix.shard }}
          # per-step results for the BITV conformance report (tests/a11y/results.py)
          EKTE_A11Y_RESULTS: a11y-results-${{ strategy.job-index }}.json
          # findings, one file per xdist worker (tests/a11y/harness.py)
          EKTE_A11Y_REPORT: a11y-report-${{ strategy.job-index }}.json
        run: pytest tests/a11y -m a11y -n auto --dist worksteal -q -p no:cacheprovider
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-shard-${{ strategy.job-index }}
          path: |
            a11y-report*.json
            a11y-results-*.json
          if-no-files-found: ignore

  a11y-report:
    # One conformance report from all shards of a full run, plus the optional
    # LLM review. A partial run (some pages) uploads its findings only: a
    # conformance report built from it would be incomplete.
    name: accessibility report (informational)
    needs: [a11y-scope, a11y]
    # whenever the a11y job ran (so not on PRs into the perf integration
    # branch, nor for changes that affect no page)
    if: always() && needs.a11y-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      # only whether the secret exists; the key itself is passed to one step
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      FULL: ${{ needs.a11y-scope.outputs.full }}
      PAGES: ${{ needs.a11y-scope.outputs.pages }}
      REASON: ${{ needs.a11y-scope.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Download shard results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: a11y-shard-*
          merge-multiple: true
      # Optional LLM review of texts (tests/a11y/README.md); runs only when
      # the ANTHROPIC_API_KEY secret is configured, never blocks. It runs
      # before the conformance report, which counts a completed review as the
      # manual part of the steps it covers (a skipped one is ignored).
      - name: Install (LLM review)
        if: always() && env.HAS_ANTHROPIC_API_KEY == 'true'
        # a failed install must not keep the conformance report from being built
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,web,a11y]'
          playwright install --with-deps chromium
      - name: LLM review (advisory)
        if: always() && env.HAS_ANTHROPIC_API_KEY == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # the pages this run tested
        run: python -m tests.a11y.llm_review --pages "$PAGES" --out a11y-llm-review.json
      - name: Upload LLM review
        if: always() && env.HAS_ANTHROPIC_API_KEY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-llm-review
          path: a11y-llm-review.json
          if-no-files-found: ignore
      - name: Conformance report (bitv-report.json)
        # standard library only; merges the shards' results; full runs only
        if: env.FULL == 'true'
        run: python -m tests.a11y.conformance --results a11y-results-*.json --llm a11y-llm-review.json --out bitv-report.json
      - name: Summary
        if: always()
        run: |
          {
            echo "### Accessibility tests"
            echo
            if [ "$FULL" = true ]; then
              echo "Full run, every page: $REASON."
              echo
              echo "Findings and the BITV conformance report (bitv-report.json): artifact a11y-report."
            else
              echo "Partial run, pages **$PAGES** only: $REASON."
              echo
              echo "No BITV conformance report: that needs a full run (pushes, the nightly run, a manual run)."
              echo "Findings: artifact a11y-report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: |
            a11y-report*.json
            a11y-results-*.json
            bitv-report.json
          if-no-files-found: ignore

  build:
    name: build distribution
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: python -m pip install --upgrade build && python -m build
      - name: Verify the wheel imports and loads the knowledge base
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/ekte --version
          /tmp/verify/bin/ekte kb >/dev/null

  workflow-lint:
    name: workflow lint (zizmor)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Lint workflows and action.yml
        # script injection, unpinned actions, excessive permissions, credential
        # persistence, ... (config: .github/zizmor.yml). The pinned version
        # keeps results reproducible; bump it deliberately.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.31.1 --no-progress .
