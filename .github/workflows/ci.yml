name: CI

on:
  push:
    branches: [main, "*/integration"]
  pull_request:
    branches: [main, "*/integration"]
  # nightly full accessibility run (the other jobs skip it)
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Linux: every supported Python. macOS and Windows: the oldest and the
        # newest supported Python (docs/reference/stability.md#os).
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - {os: macos-latest, python-version: "3.11"}
          - {os: macos-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.11"}
          - {os: windows-latest, python-version: "3.14"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev,web]'

      - name: Lint (ruff)
        run: ruff check ekte tests

      - name: Type-check (mypy)
        run: mypy ekte

      # A hung test fails after pytest-timeout's 120 s ([tool.pytest.ini_options]
      # timeout) with its name; faulthandler_timeout prints every thread's
      # stack 10 s before (pytest-timeout's own dump is lost under xdist). The
      # step limits are the backstop for a hang outside a test (collection,
      # xdist teardown). The suite takes 1-2 minutes on Linux and macOS but
      # 7-10 on Windows, where every saved test run costs ~5 fsyncs and ~14
      # file opens that are slow there; hence the longer Windows limit.
      # --durations lists the slowest tests, to spot one creeping towards the
      # limit.
      - name: Test (pytest)
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 10 }}
        # pytest-xdist (dev extra): one worker per CPU
        run: pytest -q -n auto --durations=20 -o faulthandler_timeout=110

      - name: Test with coverage (pytest-cov)
        # One Linux run measures coverage: the whole package must stay above
        # [tool.coverage.report] fail_under, and the command line, the judge
        # and the media auditor above their floors (scripts/check_coverage.py).
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        timeout-minutes: 10
        run: |
          pytest -q -n auto --durations=20 -o faulthandler_timeout=110 --cov=ekte --cov-report=term-missing:skip-covered --cov-report=json
          python scripts/check_coverage.py coverage.json

  benchmark-scope:
    # Whether the performance budget job runs: not for a pull request that
    # changes only documentation (docs/**, *.md) or locale fragments; always
    # on pushes and manual runs. Same base...head comparison as a11y-scope.
    name: performance budget scope
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the whole history (commits and trees, no old file contents) for
          # the PR's merge base
          fetch-depth: 0
          filter: blob:none
      - name: Code changed?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            # a failed diff runs the benchmark
            if files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
              code=$(printf '%s\n' "$files" | grep -Ev '^docs/|\.md$|^ekte/i18n/locales/fragments/|^$' || true)
              if [ -z "$code" ]; then run=false; fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "performance budget: run=$run ($EVENT)"

  benchmark:
    # The p95 budgets of the query core, the Analytics widgets and the History
    # API (tests marked slow, EKTE_BENCH=1) on the 20k-run fixture of
    # scripts/bench_fixture.py, built once per job. One serial run (no xdist)
    # on one runner, so the timings are not shared with other tests. The job
    # summary shows every case's p50 / p95 (scripts/bench_report.py); the
    # JSON is the bench-report artifact. See docs/dev/web-server.md#benchmark.
    #
    # CI budgets: shared runners are slower and noisier than the reference
    # machine of the local budgets (50 ms; 5 ms for /api/version), so the job
    # sets its own. Rule: the smallest round value (a multiple of 10 ms) that
    # the slowest case of 5 calibration runs stays under by at least 30 %
    # (slowest p95 <= 0.7 x budget).
    # Calibration (#162, 2026-11-10, 5 workflow_dispatch runs of this job,
    # ubuntu-latest, Python 3.12): slowest case every time "leaderboard,
    # relay x model" (tests/test_analytics_widgets.py), p95 130.9, 150.0,
    # 170.3, 182.8 and 199.9 ms (p50 87-121 ms: a spiky tail); next slowest
    # "aggregate kpis, by relay x model" (tests/test_query.py), at most
    # 116.2 ms. 199.9 / 0.7 = 285.6 -> 290 ms.
    # /api/version: no budget test yet (#150 adds it); 10 ms is a placeholder
    # that the PR adding the test calibrates the same way.
    # Recalibrate (5 manual runs, the rule above) when cases are added or
    # the runner image changes the timings.
    name: performance budget
    needs: benchmark-scope
    if: needs.benchmark-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EKTE_BENCH: "1"
      EKTE_BENCH_REPORT: bench-report.json
      EKTE_BENCH_BUDGET_MS: "290"
      EKTE_BENCH_VERSION_BUDGET_MS: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev,web]'
      - name: Budget tests (pytest -m slow, serial)
        # every test marked slow, so new budget tests are picked up; their
        # cases go to EKTE_BENCH_REPORT (tests/bench_report.py)
        run: pytest tests -m slow -p no:xdist -q -p no:cacheprovider -rs --durations=0
      - name: Summary
        if: always()
        # the table goes to the job summary and to the log
        run: |
          python scripts/bench_report.py "$EKTE_BENCH_REPORT" \
            --note "CI budget: p95 below $EKTE_BENCH_BUDGET_MS ms ($EKTE_BENCH_VERSION_BUDGET_MS ms for /api/version); locally 50 ms (5 ms)." \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: bench-report.json
          retention-days: 14
          if-no-files-found: ignore

  a11y-scope:
    # Which pages the a11y suite tests on this run (tests/a11y/pages.py):
    # everything on pushes (main and the integration branches), the nightly
    # run and manual runs; on pull requests only the pages the PR's changes
    # can affect (none for a docs-only PR, all of them when a shared or
    # unmapped UI file changes).
    name: accessibility scope
    # not on PRs into the perf integration branch (see the a11y job)
    if: github.event_name != 'pull_request' || github.base_ref != 'perf/integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.scope.outputs.run }}
      full: ${{ steps.scope.outputs.full }}
      pages: ${{ steps.scope.outputs.pages }}
      reason: ${{ steps.scope.outputs.reason }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the whole history (commits and trees, no old file contents) for
          # the PR's merge base
          fetch-depth: 0
          filter: blob:none
      - name: Pages to test
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # standard library only: the runner's python3, no setup
        run: |
          case "$EVENT" in
            pull_request)
              python3 -m tests.a11y.affected --base "$BASE_SHA" --head "$HEAD_SHA" --github-output ;;
            push) python3 -m tests.a11y.affected --full "push to $GITHUB_REF_NAME" --github-output ;;
            schedule) python3 -m tests.a11y.affected --full "nightly run" --github-output ;;
            *) python3 -m tests.a11y.affected --full "$EVENT" --github-output ;;
          esac

  a11y:
    # Browser accessibility tests of web UI v2 (BITV 2.0 / EN 301 549 /
    # WCAG 2.1 AA), see docs/dev/accessibility.md. Informational for now:
    # continue-on-error keeps known violations from failing the run. Drop it
    # (and make the check required) once the suite is green.
    # Parallel jobs from a11y-scope's matrix: a full run is 4 round-robin
    # shards (EKTE_A11Y_SHARD, tests/a11y/conftest.py); a partial run selects
    # its pages (EKTE_A11Y_PAGES) and shares them out over 1-4 jobs by their
    # weight (tests/a11y/pages.py). a11y-report merges the results.
    name: accessibility ${{ matrix.shard }}${{ matrix.pages != 'all' && format(' {0}', matrix.pages) || '' }} (informational)
    needs: a11y-scope
    # Slow browser suite: not on PRs into the perf integration branch (it runs
    # on the integration branch's own pushes and on its PR into main; the
    # scope job is skipped there, and so is this one), and not when the
    # change affects no page.
    if: needs.a11y-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.a11y-scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,web,a11y]'
          echo "playwright=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.install.outputs.playwright }}
      - name: Install Chromium
        # the system libraries still come from apt; the browser itself from
        # the cache when this Playwright version was installed before
        run: playwright install --with-deps chromium
      - name: Test (pytest -m a11y, pages ${{ matrix.pages }}, shard ${{ matrix.shard }})
        env:
          EKTE_A11Y_PAGES: ${{ matrix.pages }}
          EKTE_A11Y_SHARD: ${{ matrix.shard }}
          # per-step results for the BITV conformance report (tests/a11y/results.py)
          EKTE_A11Y_RESULTS: a11y-results-${{ strategy.job-index }}.json
          # findings, one file per xdist worker (tests/a11y/harness.py)
          EKTE_A11Y_REPORT: a11y-report-${{ strategy.job-index }}.json
        # each browser test may take 600 s (A11Y_TIMEOUT, tests/a11y/conftest.py);
        # every thread's stack is printed 10 s before a hung one fails
        run: pytest tests/a11y -m a11y -n auto --dist worksteal -q -p no:cacheprovider -o faulthandler_timeout=590
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-shard-${{ strategy.job-index }}
          path: |
            a11y-report*.json
            a11y-results-*.json
          if-no-files-found: ignore

  a11y-report:
    # One conformance report from all shards of a full run, plus the optional
    # LLM review. A partial run (some pages) uploads its findings only: a
    # conformance report built from it would be incomplete.
    name: accessibility report (informational)
    needs: [a11y-scope, a11y]
    # whenever the a11y job ran (so not on PRs into the perf integration
    # branch, nor for changes that affect no page)
    if: always() && needs.a11y-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      # only whether the secret exists; the key itself is passed to one step
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      FULL: ${{ needs.a11y-scope.outputs.full }}
      PAGES: ${{ needs.a11y-scope.outputs.pages }}
      REASON: ${{ needs.a11y-scope.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Download shard results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: a11y-shard-*
          merge-multiple: true
      # Optional LLM review of texts (tests/a11y/README.md); runs only when
      # the ANTHROPIC_API_KEY secret is configured, never blocks. It runs
      # before the conformance report, which counts a completed review as the
      # manual part of the steps it covers (a skipped one is ignored).
      - name: Install (LLM review)
        if: always() && env.HAS_ANTHROPIC_API_KEY == 'true'
        # a failed install must not keep the conformance report from being built
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,web,a11y]'
          playwright install --with-deps chromium
      - name: LLM review (advisory)
        if: always() && env.HAS_ANTHROPIC_API_KEY == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # the pages this run tested
        run: python -m tests.a11y.llm_review --pages "$PAGES" --out a11y-llm-review.json
      - name: Upload LLM review
        if: always() && env.HAS_ANTHROPIC_API_KEY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-llm-review
          path: a11y-llm-review.json
          if-no-files-found: ignore
      - name: Conformance report (bitv-report.json)
        # standard library only; merges the shards' results; full runs only
        if: env.FULL == 'true'
        run: python -m tests.a11y.conformance --results a11y-results-*.json --llm a11y-llm-review.json --out bitv-report.json
      - name: Summary
        if: always()
        run: |
          {
            echo "### Accessibility tests"
            echo
            if [ "$FULL" = true ]; then
              echo "Full run, every page: $REASON."
              echo
              echo "Findings and the BITV conformance report (bitv-report.json): artifact a11y-report."
            else
              echo "Partial run, pages **$PAGES** only: $REASON."
              echo
              echo "No BITV conformance report: that needs a full run (pushes, the nightly run, a manual run)."
              echo "Findings: artifact a11y-report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: |
            a11y-report*.json
            a11y-results-*.json
            bitv-report.json
          if-no-files-found: ignore

  build:
    name: build distribution
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: python -m pip install --upgrade build && python -m build
      - name: Verify the wheel imports and loads the knowledge base
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/ekte --version
          /tmp/verify/bin/ekte kb >/dev/null

  workflow-lint:
    name: workflow lint (zizmor)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Lint workflows and action.yml
        # script injection, unpinned actions, excessive permissions, credential
        # persistence, ... (config: .github/zizmor.yml). The pinned version
        # keeps results reproducible; bump it deliberately.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.31.1 --no-progress .
