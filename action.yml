name: "ekte relay audit"
description: "Audit whether an LLM relay serves its claimed model (货不对板检测); fail CI when risk meets your threshold."
author: "ekte contributors"
branding:
  icon: "shield"
  color: "purple"

inputs:
  base-url:
    description: "Relay base URL, e.g. https://relay.example.com/v1."
    required: true
  api-key:
    description: >-
      Relay API key. Pass a caller secret (e.g. ${{ secrets.RELAY_API_KEY }}).
      It is forwarded to ekte via an environment variable and is never echoed.
    required: true
  model:
    description: "Model id actually sent in requests."
    required: true
  claimed-model:
    description: "Model the relay claims to serve, if different from `model`."
    required: false
    default: ""
  api:
    description: "Wire protocol: auto | openai | anthropic | responses."
    required: false
    default: "auto"
  declared-provider:
    description: "Provider hint for KB lookup (openai, anthropic, deepseek, ...)."
    required: false
    default: ""
  suite:
    description: "Detector suite: smoke | standard | deep | full."
    required: false
    default: "standard"
  fail-on-risk:
    description: "Fail the job when risk >= this level: low | medium | high."
    required: false
    default: "high"
  python-version:
    description: "Python version used to install and run ekte."
    required: false
    default: "3.12"
  version:
    description: >-
      pip install spec for ekte. Defaults to the latest published `ekte`.
      Pin it for reproducible runs, e.g. `ekte==0.33.0`.
    required: false
    default: "ekte"

outputs:
  risk:
    description: "Risk level reported by ekte (clean | low | medium | high | inconclusive)."
    value: ${{ steps.audit.outputs.risk }}
  score:
    description: "Overall score 0-100 (may be empty if ekte could not score the relay)."
    value: ${{ steps.audit.outputs.score }}
  rating:
    description: "Human-readable rating from the verdict (may be empty)."
    value: ${{ steps.audit.outputs.rating }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ekte
      shell: bash
      env:
        EKTE_VERSION_SPEC: ${{ inputs.version }}
      run: |
        python -m pip install --upgrade pip
        pip install "$EKTE_VERSION_SPEC"

    - name: Run ekte audit
      id: audit
      shell: bash
      # The relay key is passed through the environment (never on the command
      # line and never echoed). `ekte check --api-key env:VAR` resolves it.
      env:
        EKTE_RELAY_API_KEY: ${{ inputs.api-key }}
        # Inputs reach the script through the environment, never by splicing
        # the expression into it (script injection).
        IN_BASE_URL: ${{ inputs.base-url }}
        IN_MODEL: ${{ inputs.model }}
        IN_API: ${{ inputs.api }}
        IN_SUITE: ${{ inputs.suite }}
        IN_FAIL_ON_RISK: ${{ inputs.fail-on-risk }}
        IN_CLAIMED_MODEL: ${{ inputs.claimed-model }}
        IN_DECLARED_PROVIDER: ${{ inputs.declared-provider }}
      run: |
        set -o pipefail

        args=(
          check
          --base-url "$IN_BASE_URL"
          --api-key "env:EKTE_RELAY_API_KEY"
          --model "$IN_MODEL"
          --api "$IN_API"
          --suite "$IN_SUITE"
          --fail-on-risk "$IN_FAIL_ON_RISK"
          --compact
        )
        if [ -n "$IN_CLAIMED_MODEL" ]; then
          args+=(--claimed-model "$IN_CLAIMED_MODEL")
        fi
        if [ -n "$IN_DECLARED_PROVIDER" ]; then
          args+=(--declared-provider "$IN_DECLARED_PROVIDER")
        fi

        # Capture the compact JSON verdict. ekte exits non-zero when the gate
        # trips (or 2 on a config error); remember that code and re-raise it
        # after we have parsed and surfaced the verdict.
        set +e
        report="$(ekte "${args[@]}")"
        code=$?
        set -e
        printf '%s\n' "$report"

        # Parse risk/score/rating from the compact JSON shape:
        #   {"verdict": {"risk": "...", "score": <num|null>, "rating": "...|null"}}
        # Reads from a temp file so the JSON never reaches a shell variable that
        # could be word-split, and so the key (which is not in the report) stays
        # out of any parsing surface.
        printf '%s' "$report" >"${RUNNER_TEMP:-/tmp}/ekte-report.json"
        python - "${RUNNER_TEMP:-/tmp}/ekte-report.json" <<'PY' >>"$GITHUB_OUTPUT"
        import json, sys

        with open(sys.argv[1], encoding="utf-8") as fh:
            report = json.load(fh)
        verdict = report.get("verdict", {})
        risk = verdict.get("risk", "") or ""
        score = verdict.get("score")
        score = "" if score is None else str(score)
        rating = verdict.get("rating", "") or ""
        print(f"risk={risk}")
        print(f"score={score}")
        print(f"rating={rating}")
        PY

        # Concise human summary on the run's Summary tab.
        python - "${RUNNER_TEMP:-/tmp}/ekte-report.json" "$IN_FAIL_ON_RISK" "$code" <<'PY' >>"$GITHUB_STEP_SUMMARY"
        import json, sys

        with open(sys.argv[1], encoding="utf-8") as fh:
            report = json.load(fh)
        threshold, code = sys.argv[2], sys.argv[3]
        v = report.get("verdict", {})
        target = report.get("target", {})
        score = v.get("score")
        score = "—" if score is None else score
        status = "FAILED" if code != "0" else "passed"
        print("## ekte relay audit")
        print("")
        print(f"- **Target:** `{target.get('name', '?')}` "
              f"(`{target.get('model', '?')}` @ `{target.get('base_url', '?')}`)")
        print(f"- **Risk:** `{v.get('risk', '?')}`  ·  "
              f"**Score:** `{score}`/100  ·  **Rating:** `{v.get('rating') or '—'}`")
        print(f"- **Gate:** fail-on-risk `{threshold}` → **{status}**")
        headline = v.get("headline")
        if headline:
            print("")
            print(f"> {headline}")
        PY

        # Re-raise ekte's own exit code so the gate (or config error) fails the job.
        exit "$code"
