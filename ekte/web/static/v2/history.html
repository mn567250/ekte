<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-en="ekte — audit history">ekte — audit history</title>
<script src="/locales.js"></script>
<script src="/lang.js"></script>
<script src="/static/theme.js"></script>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/static/tokens.css" />
<link rel="stylesheet" href="/static/ekte.css" />
<link rel="stylesheet" href="/static/filterpanel.css" />
<link rel="stylesheet" href="/static/report.css" />
<link rel="stylesheet" href="/static/perf.css" />
<link rel="stylesheet" href="/static/chartmotion.css" />
<style>
  /* History page. Tokens only (ekte.css); light + dark.
   *
   * Every group shares ONE column grid (--cols), so Risk / Score / Grade line
   * up across relays. Below 600px each row stacks instead (no h-scroll).
   *
   * Colour families (.f-good, .f-sky, …) come from the server (family of a
   * row's risk, score and grade, of a trend's last value): no grading here. */
  /* Columns: time (with mode / suite under it) · risk · score · grade · chevron.
     Mode sits under the date instead of in its own column so the longest date
     ("Sep 29, 2026, 3:40 PM") and risk label (DE "Abweichungen gefunden", FR
     "Tromperie sur la marchandise") of every language stay on one line. */
  .hist { --cols: minmax(0, 1.1fr) minmax(0, 1.5fr) 2.8em 4.8em 18px; --cgap: 12px; --del: 36px; }

  .hist { margin-top: 22px; overflow: hidden; }
  .hist:focus { outline: none; }
  .hist .state { padding: 26px 22px; color: var(--ink-muted); font-size: 14px; }
  .hist .state.loading { font-family: var(--mono); font-size: 13px; color: var(--ink-muted); }
  .hist .errbox { margin: 18px; }

  /* shared column header = sort controls (+ collapse / expand all groups) */
  .colhead { display: grid; grid-template-columns: 1fr calc(var(--del) * 3 + 12px); gap: 6px; padding: 10px 18px 6px; border-bottom: 1px solid var(--line); align-items: center; }
  /* same font size as .rmain, so the em columns line up with the rows */
  .colhead .cells { display: grid; grid-template-columns: var(--cols); gap: var(--cgap); padding: 0 10px; align-items: center; font-size: 13px; }
  .colhead .slabel { display: none; }
  .colhead .gall { justify-self: end; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .sortb {
    display: inline-flex; align-items: center; gap: 3px; min-width: 0; max-width: 100%; padding: 4px 4px; margin: 0 -4px; cursor: pointer; justify-self: start;
    font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink-muted);
    background: none; border: 0; border-radius: 6px; transition: color 0.12s, background 0.12s;
  }
  .sortb .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sortb.n .t { overflow: visible; }
  .sortb .zicon { width: 12px; height: 12px; flex: none; opacity: 0; transition: transform 0.2s; }
  .sortb:hover { color: var(--ink); background: var(--sunken); }
  .sortb[data-dir] { color: var(--ink); }
  .sortb[data-dir] .zicon { opacity: 1; }
  .sortb[data-dir="asc"] .zicon { transform: rotate(180deg); }
  /* numeric columns are narrow: their labels end at the column's right edge
     and grow to the left, Score into the free end of the wide Risk column */
  .sortb.n { justify-self: end; flex-direction: row-reverse; max-width: none; margin: 0 -4px 0 -10px; }
  .sortb[data-sort="score"] { margin-left: -120px; }

  /* group collapse toggle: the group heading's text is the button */
  .gtog {
    display: inline-flex; align-items: center; gap: 8px; max-width: 100%; margin: -3px 0 -3px -26px; padding: 3px 6px 3px 4px; cursor: pointer;
    font: inherit; letter-spacing: inherit; color: inherit; text-align: left; background: none; border: 0; border-radius: 8px;
  }
  .gtog:hover { background: var(--sunken); }
  .gtog .t { overflow-wrap: anywhere; min-width: 0; }
  .gtog .zicon { width: 16px; height: 16px; flex: none; color: var(--ink-muted); transition: transform 0.2s; }
  .gtog[aria-expanded="false"] .zicon { transform: rotate(-90deg); }
  .gbody[hidden] { display: none; }
  .group.shut .grp-h { padding-bottom: 16px; }

  /* group */
  .grp-h { display: flex; align-items: center; gap: 14px; padding: 18px 18px 8px 28px; flex-wrap: wrap; }
  .group + .group { border-top: 1px solid var(--line); }
  /* off-screen groups skip style/layout/paint until scrolled near; their
     rendered rows stay in the DOM, so find-in-page, Tab order and the
     accessibility tree are unaffected (--gh, set per group, estimates the
     height until the real one is known; nothing in a group draws past its
     padding, so the paint containment clips no focus ring). A group with an open report keeps normal rendering (the
     containment would clip the report's popovers). Browsers without :has()
     drop the rule and render as before. */
  .group:not(:has(.panel:not([hidden]))) { content-visibility: auto; contain-intrinsic-size: auto var(--gh, 1300px); }
  .gtitle { flex: 1 1 220px; min-width: 0; }
  .gtitle h2 { font-family: var(--disp); font-weight: 600; font-size: 17px; letter-spacing: -0.3px; margin: 0; overflow-wrap: anywhere; }
  .gtitle .gu { display: flex; align-items: center; gap: 6px; margin-top: 4px; min-width: 0; }
  .gtitle .gu .gk { flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-muted); }
  .gtitle .gu .gn { font-size: 13px; font-weight: 600; color: var(--ink-muted); overflow-wrap: anywhere; min-width: 0; }
  /* group trends (one or two of score, grade, latency p50, TTFT p50, decode
     speed p50, error rate: GET /api/metrics history_trends). Every tile has
     a fixed size that depends only on its metric, never on its values or on
     which other trends are shown, so the trends line up across groups:
       [ sparkline (--sw, both rows) | caption over latest value (--vw) ]
     A selected trend always renders its tile: a group with one run reserves
     the sparkline's space, a metric without data shows a dash. Every tile
     carries the divider space; the first one hides its line. Too many tiles
     for the header wrap onto a second line (the same in every group). */
  .hist { --sw: 96px; --sh: 36px; }
  .trend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px 16px; flex: 0 1 auto; min-width: 0; margin-left: auto; }
  .tr {
    display: grid; grid-template-columns: var(--sw) minmax(var(--vw), max-content); grid-template-rows: auto auto; column-gap: 9px; row-gap: 2px; align-items: end;
    flex: none; font-size: 17px; padding-left: 16px; border-left: 1px solid var(--line);
  }
  .tr:first-child { border-left-color: transparent; }
  /* --vw (in the value's 17px) fits the widest value; the column grows to a
     longer caption (it depends on the language only), never to a value */
  .tr[data-m="score"] { --vw: 2.6em; } .tr[data-m="grade"] { --vw: 2.8em; }
  .tr[data-m="latency_p50"], .tr[data-m="ttft_p50"] { --vw: 4.8em; } .tr[data-m="decode_tps"] { --vw: 6.4em; }
  .tr[data-m="error_rate"] { --vw: 3.6em; }
  .tr .tl { grid-column: 2; grid-row: 1; text-align: right; font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
  .tr .tv { display: contents; }
  .tr .tv svg, .tr .tv .nospark { grid-column: 1; grid-row: 1 / 3; align-self: center; }
  .tr .tv .nospark { height: var(--sh); }
  .tr .tv b { grid-column: 2; grid-row: 2; contain: inline-size; text-align: right; line-height: 1.1; color: inherit; font-family: var(--disp); font-weight: 700; font-size: 1em; letter-spacing: -0.3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tr .tv b.none { color: var(--ink-muted); font-weight: 600; }
  .tr .tv b small { font-family: var(--sans); font-size: 11px; font-weight: 600; color: var(--ink-muted); letter-spacing: 0; margin-left: 2px; }
  .trend svg { display: block; overflow: visible; width: var(--sw); height: var(--sh); }
  .trend .area { fill: currentColor; opacity: 0.14; }
  .trend .line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .trend .base { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
  .trend .dot { fill: currentColor; }

  /* filter bar: the fields and frame are filters.js / filterpanel.js (+ .css);
     the trend picker below sits in the panel's body */
  .tsel { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .tsel > span { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-muted); margin-right: 4px; }
  /* "1 / 2", "2 / 2": how many trends are on, of the maximum */
  .tsel > .tcount { margin-left: -4px; text-transform: none; letter-spacing: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tsel button {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-family: var(--sans); font-weight: 600; font-size: 12.5px;
    color: var(--ink-muted); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-pill); padding: 5px 11px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tsel button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
  .tsel button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  .tsel button[aria-pressed="true"]::before { background: currentColor; }
  .tsel button:hover:not(:disabled) { border-color: var(--line); color: var(--ink); }
  .tsel button[aria-pressed="true"]:hover:not(:disabled) { border-color: var(--ink); }
  .tsel button:disabled { cursor: not-allowed; opacity: 0.7; }
  .nomatch { text-align: center; padding: 36px 22px; color: var(--ink-muted); font-size: 14.5px; }
  .nomatch p { margin: 0 0 14px; }

  /* colour families (text) */
  .f-good { color: var(--success); } .f-sky { color: var(--info); } .f-warn { color: var(--warning); }
  .f-bad { color: var(--danger); } .f-grey { color: var(--ink-muted); }
  /* trend series without a score family: latency = sky, tokens/s = violet
     (page-local token, >= 4.5:1 on --surface in both themes) */
  .f-lat { color: var(--info); } .f-tps { color: var(--chart-3); }

  /* rows */
  .rows { list-style: none; margin: 0; padding: 0 18px 10px; }
  .row + .row { border-top: 1px dotted var(--line); }
  .rline { display: grid; grid-template-columns: 1fr var(--del) var(--del) var(--del); gap: 6px; align-items: center; }
  .rmain {
    display: grid; grid-template-columns: var(--cols); gap: var(--cgap); align-items: center; width: 100%; min-width: 0;
    text-align: left; background: none; border: 0; border-radius: 12px; padding: 11px 10px; cursor: pointer;
    font-size: 13px; color: var(--ink-muted); transition: background 0.12s;
  }
  .rmain:hover { background: var(--sunken); }
  .rmain[aria-expanded="true"] { background: var(--sunken); color: var(--ink); }
  /* areas follow the DOM order (date, risk, score, grade, mode): reading and
     Tab order match what is shown (BITV 9.1.3.2) */
  .rmain {
    grid-template-areas: "date risk score grade cv" "mode . . . cv"; row-gap: 3px;
  }
  .rmain > span { min-width: 0; }
  .c-date { grid-area: date; align-self: end; } .c-score { grid-area: score; } .c-grade { grid-area: grade; }
  .c-risk { grid-area: risk; } .c-mode { grid-area: mode; align-self: start; } .c-cv { grid-area: cv; }
  .c-date { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 500; }
  .c-risk .badge { white-space: normal; text-align: left; line-height: 1.25; max-width: 100%; }
  .c-risk .badge .zicon { flex: none; }
  .c-score { text-align: right; font-family: var(--disp); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .c-grade { text-align: right; font-family: var(--disp); font-weight: 700; font-size: 16px; }
  .c-mode { font-family: var(--mono); font-size: 11.5px; color: var(--ink-muted); overflow-wrap: anywhere; }
  .c-mode b { font-weight: 600; color: var(--ink); }
  .c-mode .perf, .c-mode .proto { display: block; color: var(--ink-muted); margin-top: 2px; }
  .c-cv { display: inline-flex; justify-content: flex-end; color: var(--ink-muted); }
  .c-cv .zicon { width: 15px; height: 15px; transition: transform 0.2s; }
  .rmain[aria-expanded="true"] .c-cv .zicon { transform: rotate(180deg); }
  .rdel, .rsched, .rrerun {
    width: var(--del); height: var(--del); display: grid; place-items: center; border-radius: 10px; cursor: pointer;
    background: none; border: 1px solid transparent; color: var(--ink-muted); transition: color 0.12s, background 0.12s, border-color 0.12s;
  }
  .rdel .zicon, .rsched .zicon, .rrerun .zicon { width: 15px; height: 15px; }
  .rsched:not(:disabled):hover, .rrerun:hover { color: var(--primary); background: var(--sunken); border-color: var(--primary); }
  .rsched:disabled { opacity: 0.5; cursor: progress; }
  .rsched.bymon:disabled { opacity: 0.35; cursor: not-allowed; }
  .rmsg { margin: 2px 10px 10px; font-size: 12.5px; font-weight: 600; color: var(--danger); }
  .rmsg:empty { display: none; }
  .rdel:hover { color: var(--danger); background: var(--danger-tint); border-color: var(--danger); }

  /* inline confirmation (row delete + clear all) */
  .confirm {
    display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin: 2px 0 10px; padding: 10px 12px;
    border: 1px solid var(--danger); background: var(--danger-tint); border-radius: 12px; font-size: 13px; color: var(--danger); font-weight: 600;
  }
  .confirm[hidden] { display: none; }
  .confirm .msg { flex: 1 1 200px; min-width: 0; }
  .confirm .btns { display: flex; gap: 8px; }
  .btn.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--on-primary); }
  .btn.danger-solid:hover:not(:disabled) { background: var(--danger); border-color: var(--danger); }

  /* expanded report */
  .panel { padding: 6px 0 14px; }
  .panel[hidden] { display: none; }
  .panel .state { padding: 14px 10px; }
  .panel .zr { box-shadow: none; }

  /* list footer: quiet clear-history */
  /* "Show more" under a group's first rows */
  .gmore { padding: 2px 28px 16px; }
  .gmore .btn { max-width: 100%; white-space: normal; text-align: center; }
  .lfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 18px 14px 28px; border-top: 1px solid var(--line); background: var(--sunken); }
  .lfoot .aside { font-size: 12px; }
  .lfoot .confirm { flex: 1 1 100%; margin: 0; }
  .clr { color: var(--ink-muted); font-weight: 600; font-size: 12.5px; }
  .clr:hover { color: var(--danger); }
  .clr .zicon { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }

  .empty-box { text-align: center; padding: 44px 22px 40px; }
  .empty-box .ic { color: var(--ink-muted); margin-bottom: 10px; }
  .empty-box .ic .zicon { width: 34px; height: 34px; }
  .empty-box p { margin: 0 0 16px; color: var(--ink-muted); font-size: 15px; }

  /* phones: stacked rows, no horizontal scroll */
  @media (max-width: 600px) {
    /* sort controls as one wrapping row of buttons */
    .colhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 14px 8px 16px; }
    .colhead .cells { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 0; }
    .colhead .slabel { display: inline; font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-muted); }
    .sortb, .sortb.n { margin: 0; flex-direction: row; }
    .colhead .gall { margin-left: auto; }
    .gtog { margin-left: -6px; }
    .grp-h { padding: 16px 14px 6px 16px; }
    .rows { padding: 0 8px 8px; }
    .gmore { padding: 2px 16px 14px; }
    .lfoot { padding: 12px 14px; }
    .rmain {
      grid-template-columns: auto auto minmax(0, 1fr) 18px; gap: 6px 10px; padding: 11px 8px;
      grid-template-areas: "date date date cv" "risk risk risk risk" "score grade mode mode";
    }
    .c-date, .c-mode { align-self: auto; }
    .c-score, .c-grade { text-align: left; }
    .c-mode .perf, .c-mode .proto { display: inline; margin: 0; }
    .c-mode .perf::before, .c-mode .proto::before { content: " · "; }
    .rline { align-items: start; }
    .rdel, .rsched, .rrerun { margin-top: 4px; }
    /* the title keeps the full width; the fixed-size trend tiles stack below it */
    .grp-h { align-items: flex-start; gap: 10px 14px; }
    .gtitle { flex: 1 1 100%; }
    /* stacked tiles of one shared width */
    .hist { --sw: 84px; }
    .trend { flex: none; flex-direction: column; align-items: flex-end; gap: 8px; }
    .tr, .tr[data-m] { --vw: 6.4em; padding-left: 0; border-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="znav" data-page="history"></header>
  <main id="main" tabindex="-1">
    <div class="hero">
      <h1 data-en="Audit <span class='u'>history</span> &amp; trends">Audit <span class='u'>history</span> & trends</h1>
      <p data-en="Every verification you have run on this machine. Grouped by &quot;relay + claimed model&quot;, with a health-score trend line; click any row to expand that report.">Every verification you have run on this machine. Grouped by "relay + claimed model", with a health-score trend line; click any row to expand that report.</p>
    </div>
    <!-- the page notice (notice.js) -->
    <div class="znote" id="note" hidden></div>

    <section class="card filters" id="filters" hidden></section>

    <section class="card hist" id="hist" tabindex="-1" aria-busy="true">
      <div class="state loading" data-en="Loading history…">Loading history…</div>
    </section>
    <p class="sr-only" id="sortst" role="status"></p>
  </main>
</div>
<script src="/i18n.js"></script>
<script src="/perf.js"></script>
<script src="/static/chartmotion.js"></script>
<script src="/icons.js"></script>
<script src="/static/nav.js"></script>
<script src="/static/notice.js"></script>
<script src="/static/filterpanel.js"></script>
<script src="/static/filters.js"></script>
<script src="/static/trendpick.js"></script>
<script src="/static/report.js"></script>
<script>
(function () {
  "use strict";
  // Draws only: groups, rows and trend tiles come from GET /api/history/groups
  // and /api/history/runs (ekte/web/history_api.py), filters and the view
  // (sort, trends, focus run) live in the URL query string (filters.js). The
  // server decides filtering, grouping, order, grades and colour families.
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var ico = function (n, o) { return window.ekteIcon ? window.ekteIcon(n, o || {}) : ""; };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };
  // T(zh, en) with {name} placeholders filled after translation
  var Tf = function (zh, en, vars) {
    return T(zh, en).replace(/\{(\w+)\}/g, function (m, k) { return vars && k in vars ? vars[k] : m; });
  };
  var num = function (s) { return typeof s === "number" ? String(Math.round(s)) : "—"; };
  // risk badge icons (the badge colour is the server's family.risk)
  var RISKI = { clean: "check", low: "warning", medium: "warning", high: "x", inconclusive: "info" };

  var host = $("#hist"), fbar = $("#filters");
  // the shared filters this page shows (ekte/web/query.py schema)
  var FLD = ["q", "surface", "relay", "model", "suite", "mode", "api", "detect", "stream", "risk", "min_score", "range", "exec", "watch"];
  var DEF_TRENDS = "score,latency_p50", DEF_SORT = "-time", SORTS = ["time", "risk", "score", "grade"];
  var FOCUS = "runs.focus";
  var cat = null; // GET /api/metrics: { byId, order, max, grades, labels }
  var state = {
    groups: null, // the loaded groups (null until the first load)
    totalGroups: 0, totalRuns: 0, after: null, error: null,
    rows: {}, // run id -> its row (every loaded group)
    reports: {}, open: null, confirm: null, nextIdx: 0,
  };

  // per-viewer view setting (storage may be missing or throw): collapsed groups (by key)
  var CKEY = "ekte.v2.history.collapsed";
  state.collapsed = (function () {
    try {
      var c = JSON.parse(localStorage.getItem(CKEY) || "null"), out = {};
      if (c && typeof c === "object") Object.keys(c).forEach(function (k) { if (c[k] === true) out[k] = true; });
      return out;
    } catch (e) { return {}; }
  })();
  function saveCollapsed() {
    try { localStorage.setItem(CKEY, JSON.stringify(state.collapsed)); } catch (e) { /* ignore */ }
  }

  // a link to one run (#r-<id>: the audit page, older monitor links) focuses it
  (function () {
    var m = /^#r-(\d+)$/.exec(location.hash || "");
    if (m && !/(^|[?&])runs\.focus=/.test(location.search)) {
      var u = new URLSearchParams(location.search);
      u.set(FOCUS, m[1]);
      try { history.replaceState(history.state, "", location.pathname + "?" + u.toString() + location.hash); } catch (e) { /* ignore */ }
    }
  })();

  var F = window.EkteFilters.create({
    section: fbar,
    fields: FLD,
    page: "history",
    defaults: { "trend.metrics": DEF_TRENDS, "groups.sort": DEF_SORT },
    foot: function () { return '<span id="fcount" aria-live="polite">' + esc(countText()) + "</span>"; },
    extra: function () { return trendPickerHTML(); },
    onChange: onChange,
  });

  function onChange(st, changed) {
    var filters = changed.some(function (k) { return FLD.indexOf(k) >= 0 || k === "from" || k === "to"; });
    if (filters && st[FOCUS]) F.set({ "runs.focus": null }); // a filtered list starts at its top
    if (filters || changed.indexOf("groups.sort") >= 0) load();
    else if (changed.indexOf("trend.metrics") >= 0) reloadTrends();
  }

  // any shared filter in the URL (the URL is the view)
  function isFiltered() {
    var parsed = window.EkteFilters.parse(location.search, FLD, []);
    return Object.keys(parsed).some(function (k) { return k.indexOf(".") < 0; });
  }
  function focusRun() {
    var v = F.state()[FOCUS];
    return v != null && /^\d+$/.test(String(v)) ? String(v) : null;
  }
  function sortValue() {
    var v = String(F.state()["groups.sort"] || DEF_SORT);
    return SORTS.indexOf(v.replace(/^-/, "")) >= 0 ? v : DEF_SORT;
  }
  function sortState() {
    var v = sortValue();
    return { key: v.replace(/^-/, ""), dir: v.charAt(0) === "-" ? "desc" : "asc" };
  }

  /* ---------------- counts ---------------- */
  function countText() {
    if (!state.groups) return "";
    var all = note.status && typeof note.status.runs === "number" ? Math.max(note.status.runs, state.totalRuns) : state.totalRuns;
    return Tf("显示 {shown} / {n} 条记录", "Showing {shown} of {n} audits", { shown: state.totalRuns, n: all });
  }
  function footText() {
    var all = note.status && typeof note.status.runs === "number" ? Math.max(note.status.runs, state.totalRuns) : state.totalRuns;
    return isFiltered() ? countText() : Tf("共 {n} 条记录", "Saved audits: {n}", { n: all });
  }
  function syncCounts() {
    var fc = $("#fcount"), hc = $("#hcount");
    if (fc) fc.textContent = countText();
    if (hc) hc.textContent = footText();
  }

  function fmtTime(ts) {
    if (!ts) return "—";
    var d = new Date(ts);
    if (isNaN(d)) return String(ts);
    try {
      return EKTE_LANG.dateFmt({ dateStyle: "medium", timeStyle: "short" }).format(d);
    } catch (e) {
      return d.toLocaleString();
    }
  }

  /* ---------------- sorting (on the server) ---------------- */
  var SORTL = {
    time: ["时间", "Time"], risk: ["风险", "Risk"], score: ["健康分", "Score"], grade: ["评级", "Grade"],
  };
  function sortName(k) { return T(SORTL[k][0], SORTL[k][1]); }
  function sortStateText() {
    var s = sortState();
    return Tf("已按{key}排序，{dir}", "Sorted by {key}, {dir}", {
      key: sortName(s.key),
      dir: s.dir === "asc" ? T("升序", "ascending") : T("降序", "descending"),
    });
  }
  // a new column starts descending (newest, most severe, best first); the
  // active column flips direction
  function setSort(k) {
    var s = sortState();
    var dir = s.key === k ? (s.dir === "asc" ? "desc" : "asc") : "desc";
    F.set({ "groups.sort": (dir === "desc" ? "-" : "") + k });
    var st = $("#sortst");
    if (st) st.textContent = sortStateText();
  }

  function sortHeadHTML() {
    var s = sortState();
    var cell = function (k, cls) {
      var on = s.key === k;
      // the name carries the state: this is a list, not a table, so no aria-sort
      var name = on
        ? Tf("{key}，{dir}", "{key}, {dir}", {
          key: sortName(k), dir: s.dir === "asc" ? T("升序排列", "sorted ascending") : T("降序排列", "sorted descending") })
        : Tf("按{key}排序", "Sort by {key}", { key: sortName(k) });
      return '<button type="button" class="sortb' + (cls ? " " + cls : "") + '" data-sort="' + k + '"' + (on ? ' data-dir="' + s.dir + '"' : "") +
        ' aria-label="' + esc(name) + '" title="' + esc(name) + '"><span class="t">' + esc(sortName(k)) + "</span>" + ico("chevronDown") + "</button>";
    };
    var anyOpen = state.groups.some(function (g) { return !state.collapsed[g.key]; });
    return '<div class="colhead"><div class="cells" role="group" aria-label="' + esc(T("排序", "Sort audits")) + '">' +
      '<span class="slabel" aria-hidden="true">' + esc(T("排序", "Sort")) + "</span>" +
      cell("time") + cell("risk") + cell("score", "n") + cell("grade", "n") + "<span></span></div>" +
      '<button type="button" class="linkbtn gall" id="gall" data-all="' + (anyOpen ? "collapse" : "expand") + '">' +
      esc(anyOpen ? T("全部折叠", "Collapse all") : T("全部展开", "Expand all")) + "</button>" + "</div>";
  }

  /* ---------------- data ---------------- */
  var ctl = null; // the current load: a newer one (or a filter change) aborts it
  function fresh() {
    if (ctl) ctl.abort();
    ctl = new AbortController();
    return ctl.signal;
  }
  function signal() { return (ctl || (ctl = new AbortController())).signal; }
  function isAbort(e) { return e && (e.name === "AbortError" || e.code === 20); }
  function get(url, sig) { return window.EkteFilters.fetchWidget(url, { signal: sig }); }
  function qs() {
    return Array.prototype.filter.call(arguments, Boolean).join("&");
  }
  function kv(k, v) { return encodeURIComponent(k) + "=" + encodeURIComponent(v); }

  // a page of groups: the shared filters, sort and trends of the URL
  function groupsUrl(o) {
    o = o || {};
    return "/api/history/groups?" + qs(F.widgetParams(["groups", "trend"]),
      o.after ? kv("groups.after", o.after) : "", o.focus ? kv("groups.focus", o.focus) : "",
      o.limit ? kv("groups.limit", o.limit) : "");
  }
  // the next page of one group's runs (runs.focus: grown until it holds that run)
  function runsUrl(g, focus) {
    return "/api/history/runs?" + qs(F.widgetParams(), kv("group.key", g.key), kv("runs.sort", sortValue()),
      g.after ? kv("runs.after", g.after) : "", focus ? kv("runs.focus", focus) : "");
  }
  function fromServer(sg) {
    return { key: sg.key, relay: sg.relay, claimed_model: sg.claimed_model, urls: sg.base_urls || [],
      runs: sg.runs, trends: sg.trends || {}, rows: null, after: null, total: sg.runs, idx: state.nextIdx++ };
  }
  function fetchRows(g, sig, focus) {
    return get(runsUrl(g, focus), sig).then(function (data) {
      if (sig.aborted) return;
      (data.rows || []).forEach(function (r) { state.rows[String(r.id)] = r; });
      g.rows = (g.rows || []).concat(data.rows || []);
      g.after = data.after || null;
      g.total = data.total;
    });
  }
  function groupOf(key) { return (state.groups || []).filter(function (g) { return g.key === key; })[0]; }

  // the first page of groups and the first page of rows of each open group,
  // drawn at once
  function load() {
    var sig = fresh(), focus = focusRun();
    host.setAttribute("aria-busy", "true");
    loadNote();
    return get(groupsUrl({ focus: focus }), sig)
      .then(function (data) {
        var keep = state.nextIdx;
        state.nextIdx = 0;
        var groups = (data.groups || []).map(fromServer);
        var fkey = data.focus && data.focus.key;
        if (fkey && state.collapsed[fkey]) { delete state.collapsed[fkey]; saveCollapsed(); } // the linked run's group opens
        return Promise.all(groups.map(function (g) {
          return state.collapsed[g.key] ? null : fetchRows(g, sig, g.key === fkey ? focus : null);
        })).then(function () {
          if (sig.aborted) { state.nextIdx = keep; return; }
          state.groups = groups;
          state.totalGroups = data.total_groups || 0;
          state.totalRuns = data.total_runs || 0;
          state.after = data.after || null;
          state.rows = {};
          groups.forEach(function (g) { (g.rows || []).forEach(function (r) { state.rows[String(r.id)] = r; }); });
          state.error = null;
          render();
          if (focus && data.focus) {
            var row = document.getElementById("r-" + focus);
            if (row && row.scrollIntoView) row.scrollIntoView({ block: "center" });
          }
        });
      })
      .catch(function (e) {
        if (sig.aborted || isAbort(e)) return;
        state.error = String((e && e.message) || e);
        render();
      })
      .then(function () {
        if (sig.aborted) return;
        host.setAttribute("aria-busy", "false");
        fbar.hidden = state.error != null || (!state.totalRuns && !isFiltered());
      });
  }

  // a new trend selection: the trends of the groups already shown, in place
  function reloadTrends() {
    syncPicker();
    if (!state.groups || !state.groups.length) return;
    if (state.groups.length > 200) { load(); return; }
    var sig = signal();
    get(groupsUrl({ limit: state.groups.length }), sig).then(function (data) {
      if (sig.aborted) return;
      (data.groups || []).forEach(function (sg) {
        var g = groupOf(sg.key);
        if (g) g.trends = sg.trends || {};
      });
      state.groups.forEach(function (g) {
        var sec = host.querySelector('.group[data-g="' + g.idx + '"] .trend');
        if (sec) sec.outerHTML = trendHTML(g);
      });
    }, function (e) { if (!isAbort(e)) load(); });
  }

  /* ---------------- page notice (notice.js) ---------------- */
  // critical: the history cannot be read; warning: monitor runs are paused
  // (master key locked) and / or older runs are still being processed;
  // info: how many runs, where and since when
  var note = { status: null, err: false, locked: false };
  function paintNote() {
    var n = null, s = note.status;
    if (note.err || state.error != null) {
      n = { level: "critical", title: T("无法加载检测历史", "History could not be loaded"),
        detail: T("数据库被其他进程锁定、已损坏，或本地 ekte 服务未运行。", "The database is locked by another process or damaged, or the local ekte service is not running."),
        actions: [{ act: "retry", label: T("重试", "Retry"), primary: true }] };
    } else if (s) {
      var warn = [];
      if (note.locked) {
        warn.push([T("监控运行已暂停", "Monitor runs are paused"),
          T("主密钥已锁定：计划的监控运行已暂停，因此这里不会保存新的运行。", "Master key locked: scheduled monitor runs are paused, so no new runs are saved here.")]);
      }
      if (s.pending) {
        warn.push([s.pending === 1 ? T("1 次较早的检测仍在处理中", "1 older run is still being processed")
          : Tf("{n} 次较早的检测仍在处理中", "{n} older runs are still being processed", { n: s.pending }),
          T("处理完成前，部分细节可能缺失。", "Some details may be missing until it is done.")]);
      }
      if (warn.length) {
        n = { level: "warning", title: warn[0][0], detail: warn[0][1],
          items: warn.slice(1).map(function (w) { return w[0] + ": " + w[1]; }),
          actions: note.locked ? [{ act: "unlock", label: T("解锁", "Unlock"), primary: true }] : [] };
      } else if (s.runs) {
        var since = "";
        try { since = EKTE_LANG.dateFmt({ dateStyle: "medium" }).format(new Date(s.oldest)); } catch (e) { since = s.oldest || ""; }
        n = { level: "info",
          title: s.runs === 1 ? T("本机有 1 次检测", "1 run on this machine") : Tf("本机有 {n} 次检测", "{n} runs on this machine", { n: s.runs }),
          detail: Tf("最早一次为 {date} · API 密钥从不保存", "Saved since {date} · API keys are never stored", { date: since }) };
      } else {
        n = { level: "info", title: T("还没有检测", "No runs yet"),
          detail: T("你运行的每次检测都会保存在这里，仅在本机。", "Every audit you run is saved here, on this machine only.") };
      }
    }
    window.EkteNotice.show($("#note"), n);
  }
  function loadNote() {
    var st = fetch("/api/history/status").then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
    var mk = fetch("/api/secret").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    return Promise.all([st, mk])
      .then(function (res) { note.status = res[0]; note.locked = !!(res[1] && res[1].state === "locked"); note.err = false; },
        function () { note.err = true; })
      .then(function () { paintNote(); syncCounts(); });
  }
  $("#note").addEventListener("click", function (e) {
    var b = e.target.closest("[data-note-act]");
    if (!b) return;
    var act = b.getAttribute("data-note-act");
    if (act === "retry") load();
    else if (act === "unlock") location.href = "/watches";
  });
  window.addEventListener("ekte:lang", paintNote);

  /* ---------------- rendering ---------------- */
  function render() {
    // keep mounted report elements (with their open evidence) across re-renders
    var keep = {};
    Array.prototype.forEach.call(host.querySelectorAll(".panel[data-id]"), function (p) {
      if (p.firstElementChild && p.firstElementChild.classList.contains("rep")) keep[p.getAttribute("data-id")] = p.firstElementChild;
    });
    var focusSel = focusKey(document.activeElement);
    syncCounts();

    if (state.error != null) {
      host.innerHTML = '<div class="errbox">' + esc(T("无法读取历史：", "Could not read history: ")) + esc(state.error) +
        "<br>" + esc(T("请确认本地 ekte 服务在运行。", "Make sure the local ekte service is running.")) + "</div>";
      return;
    }
    if (!state.groups) return;
    if (state.open != null && !state.rows[String(state.open)]) state.open = null;
    if (state.confirm != null && state.confirm !== "all" && !state.rows[String(state.confirm)]) state.confirm = null;
    if (!state.totalRuns) {
      host.innerHTML = isFiltered()
        ? '<div class="nomatch"><p>' + esc(T("没有符合筛选条件的检测记录。", "No audits match these filters.")) +
          '</p><button type="button" class="btn sm" id="nmreset">' + esc(T("重置筛选", "Reset filters")) + "</button></div>"
        : '<div class="empty-box"><div class="ic">' + ico("folder") + "</div><p>" +
          esc(T("还没有检测记录。", "No audits recorded yet.")) + '</p><a class="btn pri" href="/">' +
          esc(T("去跑第一次检测", "Run your first audit")) + " " + ico("arrowRight") + "</a></div>";
      return;
    }

    var more = state.after != null || state.groups.some(function (g) { return g.rows && g.after != null; });
    host.innerHTML =
      sortHeadHTML() +
      state.groups.map(groupHTML).join("") +
      groupsMoreHTML() +
      '<div class="lfoot">' +
      '<span class="aside" id="hcount">' + esc(footText()) + "</span>" +
      (more ? '<p class="sr-only" id="hmore" role="status"></p>' : "") +
      '<button type="button" class="linkbtn clr" id="clr" aria-expanded="' + (state.confirm === "all") + '" aria-controls="clrConfirm">' +
      ico("trash") + esc(T("清空历史", "Clear history")) + "</button>" +
      confirmHTML("clrConfirm", "all", T("确定清空全部检测历史？此操作不可撤销。", "Clear the entire audit history? This cannot be undone."), T("清空历史", "Clear history")) +
      "</div>";

    // re-mount the open report
    if (state.open != null) {
      var panel = host.querySelector('.panel[data-id="' + state.open + '"]');
      if (panel) {
        panel.hidden = false;
        if (keep[state.open]) panel.appendChild(keep[state.open]);
        else if (state.reports[state.open]) mount(panel, state.reports[state.open]);
        else fetchReport(panel, state.open);
      }
    }
    if (focusSel) {
      var f = host.querySelector(focusSel);
      if (f) f.focus();
    }
  }

  function focusKey(el) {
    if (!el || !host.contains(el)) return null;
    if (el.id) return "#" + CSS.escape(el.id);
    var row = el.closest(".row");
    if (row && el.classList.contains("rdel")) return '.row[data-id="' + row.getAttribute("data-id") + '"] .rdel';
    if (row && el.classList.contains("rrerun")) return '.row[data-id="' + row.getAttribute("data-id") + '"] .rrerun';
    if (row && el.classList.contains("rsched")) return '.row[data-id="' + row.getAttribute("data-id") + '"] .rsched';
    if (el.hasAttribute("data-more")) return '[data-more="' + CSS.escape(el.getAttribute("data-more")) + '"]';
    if (el.hasAttribute("data-gmore")) return "[data-gmore]";
    if (el.hasAttribute("data-sort")) return '[data-sort="' + el.getAttribute("data-sort") + '"]';
    if (el.hasAttribute("data-gkey")) return '[data-gkey="' + CSS.escape(el.getAttribute("data-gkey")) + '"]';
    return null;
  }

  function confirmHTML(id, what, msg, okLabel) {
    return '<div class="confirm" id="' + id + '" role="group" aria-label="' + esc(msg) + '"' + (state.confirm === what ? "" : " hidden") + ">" +
      '<span class="msg" data-msg="' + esc(msg) + '">' + esc(msg) + "</span>" +
      '<span class="btns"><button type="button" class="btn sm danger-solid" data-yes="' + what + '">' + esc(okLabel) + "</button>" +
      '<button type="button" class="btn sm" data-no="' + what + '">' + esc(T("取消", "Cancel")) + "</button></span></div>";
  }

  function groupName(g) { return g.claimed_model || T("(未声明模型)", "(no model declared)"); }
  function relayName(g) { return g.relay ? g.relay.label : T("（未知）", "(unknown)"); }

  function groupHTML(g) {
    var gi = g.idx, hid = "g" + gi, shut = !!state.collapsed[g.key];
    var shown = g.rows ? g.rows.length : 0;
    // rough height for content-visibility until the group is first laid out
    var gh = shut ? 100 : 100 + 58 * shown + (g.after ? 50 : 0);
    // the heading's text is the collapse toggle: heading navigation still
    // lands on it, and the button says whether the group's rows are shown
    // named by model AND relay: one model on two relays gives two groups; the
    // tooltip lists the base URLs the group's runs used
    return '<section class="group' + (shut ? " shut" : "") + '" data-g="' + gi + '" aria-labelledby="' + hid + " " + hid + 'u" style="--gh:' + gh + 'px"><div class="grp-h"><div class="gtitle">' +
      '<h2 id="' + hid + '"><button type="button" class="gtog" data-gkey="' + esc(g.key) + '" aria-expanded="' + !shut + '" aria-controls="gb' + gi + '" title="' +
      esc(T("声称模型", "Claimed model")) + '">' + ico("chevronDown") + '<span class="t">' + esc(groupName(g)) + "</span></button></h2>" +
      '<div class="gu"><span class="gk">' + esc(g.relay && g.relay.kind === "provider" ? T("厂商", "Provider") : T("中转站", "Relay")) + "</span>" +
      '<span class="gn" id="' + hid + 'u" title="' + esc(g.urls.join("\n")) + '">' + esc(relayName(g)) + "</span></div></div>" +
      trendHTML(g) + "</div>" +
      '<div class="gbody" id="gb' + gi + '"' + (shut ? " hidden" : "") + ">" + gbodyHTML(g) + "</div></section>";
  }
  function gbodyHTML(g) {
    return '<ul class="rows">' + (g.rows || []).map(rowHTML).join("") + "</ul>" + moreHTML(g);
  }

  // "Show more" under a group whose rows are not all loaded yet; its
  // description is the group heading (several groups have such a button)
  function moreLabel(left) { return Tf("显示更多（还剩 {k} 条）", "Show more ({k} remaining)", { k: left }); }
  function moreHTML(g) {
    var left = g.total - (g.rows ? g.rows.length : 0);
    if (!g.rows || !g.after || left <= 0) return "";
    return '<div class="gmore"><button type="button" class="btn sm" data-more="' + esc(g.key) + '" aria-describedby="g' + g.idx + '">' +
      esc(moreLabel(left)) + "</button></div>";
  }
  function groupsMoreLabel(left) { return Tf("显示更多分组（还剩 {k} 个）", "Show more groups ({k} remaining)", { k: left }); }
  function groupsMoreHTML() {
    var left = state.totalGroups - state.groups.length;
    if (!state.after || left <= 0) return "";
    return '<div class="gmore gsmore"><button type="button" class="btn sm" data-gmore="1">' + esc(groupsMoreLabel(left)) + "</button></div>";
  }
  function announce(msg) {
    var live = document.getElementById("hmore");
    if (live) live.textContent = msg;
  }

  // append the group's next page of rows without rebuilding the list; focus
  // stays on the button while rows remain, else moves to the first new row
  function showMore(btn) {
    var g = groupOf(btn.getAttribute("data-more")), sec = btn.closest(".group"), ul = sec && sec.querySelector(".rows");
    if (!g || !ul || g.loading) return;
    var from = g.rows.length, sig = signal();
    g.loading = true;
    ul.setAttribute("aria-busy", "true");
    fetchRows(g, sig).then(function () {
      g.loading = false;
      ul.removeAttribute("aria-busy");
      if (sig.aborted) return;
      ul.insertAdjacentHTML("beforeend", g.rows.slice(from).map(rowHTML).join(""));
      var left = g.total - g.rows.length;
      if (g.after && left > 0) {
        btn.textContent = moreLabel(left);
      } else {
        var first = g.rows[from] && document.getElementById("r-" + g.rows[from].id);
        if (first) first.focus();
        btn.parentNode.remove();
      }
      // the link to this view reaches the same row
      if (g.rows.length > from) F.set({ "runs.focus": String(g.rows[g.rows.length - 1].id) });
      announce(Tf("{group}：显示 {shown} / {total} 条记录", "{group}: showing {shown} of {total} audits",
        { group: groupName(g) + " · " + relayName(g), shown: g.rows.length, total: g.total }));
    }, function (e) {
      g.loading = false;
      ul.removeAttribute("aria-busy");
      if (!isAbort(e)) announce(T("无法加载更多：", "Could not load more: ") + String((e && e.message) || e));
    });
  }

  // append the next page of groups; focus stays on the button while groups
  // remain, else moves to the first new group's toggle
  function showMoreGroups(btn) {
    if (state.loadingGroups || !state.after) return;
    var sig = signal(), wrap = btn.parentNode;
    state.loadingGroups = true;
    host.setAttribute("aria-busy", "true");
    get(groupsUrl({ after: state.after }), sig).then(function (data) {
      var groups = (data.groups || []).map(fromServer);
      return Promise.all(groups.map(function (g) { return state.collapsed[g.key] ? null : fetchRows(g, sig); })).then(function () {
        if (sig.aborted) return;
        state.groups = state.groups.concat(groups);
        state.after = data.after || null;
        state.totalGroups = data.total_groups || state.totalGroups;
        wrap.insertAdjacentHTML("beforebegin", groups.map(groupHTML).join(""));
        if (!$("#hmore")) $("#hcount").insertAdjacentHTML("afterend", '<p class="sr-only" id="hmore" role="status"></p>');
        var left = state.totalGroups - state.groups.length;
        if (state.after && left > 0) {
          btn.textContent = groupsMoreLabel(left);
        } else {
          var tog = groups[0] && host.querySelector('.group[data-g="' + groups[0].idx + '"] .gtog');
          if (tog) tog.focus();
          wrap.remove();
        }
        syncGroupAll();
        announce(Tf("显示 {shown} / {total} 个分组", "Showing {shown} of {total} groups", { shown: state.groups.length, total: state.totalGroups }));
      });
    }).catch(function (e) {
      if (!isAbort(e)) announce(T("无法加载更多：", "Could not load more: ") + String((e && e.message) || e));
    }).then(function () {
      state.loadingGroups = false;
      host.setAttribute("aria-busy", "false");
    });
  }

  /* ---------------- collapsible groups ---------------- */
  // open/close one group in place; the open report inside it closes first.
  // A group first opened here loads its rows.
  function setGroupOpen(sec, open) {
    var b = sec.querySelector(".gtog"), body = sec.querySelector(".gbody"), key = b.getAttribute("data-gkey");
    var g = groupOf(key);
    if (!open && state.open != null && body.querySelector('.row[data-id="' + CSS.escape(String(state.open)) + '"]')) toggle(String(state.open));
    if (!open && state.confirm != null && state.confirm !== "all" && body.querySelector('.row[data-id="' + CSS.escape(String(state.confirm)) + '"]')) setConfirm(null);
    // a collapsed group is not where the view stands
    var focus = focusRun();
    if (!open && focus && body.querySelector('.row[data-id="' + CSS.escape(focus) + '"]')) F.set({ "runs.focus": null });
    if (open) delete state.collapsed[key];
    else state.collapsed[key] = true;
    b.setAttribute("aria-expanded", String(open));
    body.hidden = !open;
    sec.classList.toggle("shut", !open);
    if (open && g && !g.rows && !g.loading) {
      var sig = signal();
      g.loading = true;
      body.setAttribute("aria-busy", "true");
      fetchRows(g, sig).then(function () {
        g.loading = false;
        body.removeAttribute("aria-busy");
        if (sig.aborted || !body.isConnected) return;
        body.innerHTML = gbodyHTML(g);
        if (g.after && !$("#hmore")) $("#hcount").insertAdjacentHTML("afterend", '<p class="sr-only" id="hmore" role="status"></p>');
      }, function (e) {
        g.loading = false;
        body.removeAttribute("aria-busy");
        if (!isAbort(e)) body.innerHTML = '<div class="errbox">' + esc(T("无法读取历史：", "Could not read history: ")) + esc(String((e && e.message) || e)) + "</div>";
      });
    }
  }
  function syncGroupAll() {
    var ga = $("#gall");
    if (!ga) return;
    var anyOpen = state.groups.some(function (g) { return !state.collapsed[g.key]; });
    ga.setAttribute("data-all", anyOpen ? "collapse" : "expand");
    ga.textContent = anyOpen ? T("全部折叠", "Collapse all") : T("全部展开", "Expand all");
  }
  function toggleGroup(b) {
    setGroupOpen(b.closest(".group"), b.getAttribute("aria-expanded") !== "true");
    saveCollapsed();
    syncGroupAll();
  }
  function setAllGroups(open) {
    Array.prototype.forEach.call(host.querySelectorAll(".group"), function (sec) { setGroupOpen(sec, open); });
    saveCollapsed();
    syncGroupAll();
  }

  // small sparkline of vals (oldest -> newest) scaled to [lo, hi]; area fill
  // optional. Stroke/fill use currentColor, so the tile's colour family (on
  // .tr) colours the line and the KPI number alike.
  function sparkSVG(vals, lo, hi, label, area, W, H) {
    var P = 3, rg = hi - lo || 1;
    var xs = vals.map(function (_, i) { return P + (i * (W - 2 * P)) / (vals.length - 1); });
    var ys = vals.map(function (v) { return H - P - ((Math.max(lo, Math.min(hi, v)) - lo) / rg) * (H - 2 * P); });
    var d = xs.map(function (x, i) { return (i ? "L" : "M") + x.toFixed(1) + "," + ys[i].toFixed(1); }).join(" ");
    var fill = area ? '<path class="area" d="' + d + " L" + xs[xs.length - 1].toFixed(1) + "," + (H - P) + " L" + xs[0].toFixed(1) + "," + (H - P) + ' Z"/>' : "";
    return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(label) + '">' +
      "<title>" + esc(label) + "</title>" +
      '<line class="base" x1="0" x2="' + W + '" y1="' + (H - P) + '" y2="' + (H - P) + '"/>' + fill +
      '<path class="line" d="' + d + '"/>' +
      '<circle class="dot" cx="' + xs[xs.length - 1].toFixed(1) + '" cy="' + ys[ys.length - 1].toFixed(1) + '" r="2.5"/></svg>';
  }

  /* ---------------- trends (options and values from the server) ---------------- */
  function keyed(key) { return window.EkteFilters.keyed(key, cat && cat.labels); }
  function trends() { return window.EkteTrendPick.clean(F.state()["trend.metrics"], cat.order, cat.max, DEF_TRENDS); }

  // a value as text in the metric's display format, and its unit
  var UNIT = { ms: "ms", tok_s: "tok/s" };
  function fmtValue(m, v) {
    if (v == null) return "—";
    if (m.format === "grade") return cat.grades[Math.round(v) - 1] || "—"; // a point on the 1..6 scale: its letter
    if (m.format === "percent" || m.format === "ratio_percent") {
      try { return EKTE_LANG.numFmt({ style: "percent", maximumFractionDigits: 1 }).format(v); } catch (e) { return (v * 100).toFixed(1) + "%"; }
    }
    return String(Math.round(v));
  }

  function trendCount(n) {
    return '<span aria-hidden="true">' + esc(n + " / " + cat.max) + '</span><span class="sr-only">' +
      esc(Tf("已选 {n} 个，最多 {max} 个", "{n} of at most {max} selected", { n: n, max: cat.max })) + "</span>";
  }
  function trendPickerHTML() {
    if (!cat) return "";
    var sel = trends();
    return '<div class="tsel" role="group" aria-labelledby="tselL" aria-describedby="tselN"><span id="tselL">' + esc(T("趋势图", "Trends")) + "</span>" +
      '<span class="tcount" id="tselN">' + trendCount(sel.length) + "</span>" +
      window.EkteTrendPick.buttons(sel, cat.order, cat.max).map(function (b) {
        return '<button type="button" data-trend="' + esc(b.id) + '" aria-pressed="' + b.pressed + '"' + (b.disabled ? ' disabled aria-disabled="true"' : "") + ">" +
          esc(keyed(cat.byId[b.id].label_key)) + "</button>";
      }).join("") + "</div>";
  }
  // the picker after a change, in place (focus stays on the pressed button)
  function syncPicker() {
    if (!cat) return;
    var sel = trends(), n = $("#tselN", fbar);
    if (n) n.innerHTML = trendCount(sel.length);
    window.EkteTrendPick.buttons(sel, cat.order, cat.max).forEach(function (b) {
      var el = fbar.querySelector('[data-trend="' + CSS.escape(b.id) + '"]');
      if (!el) return;
      el.setAttribute("aria-pressed", String(b.pressed));
      el.disabled = b.disabled;
      if (b.disabled) el.setAttribute("aria-disabled", "true");
      else el.removeAttribute("aria-disabled");
    });
  }
  fbar.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-trend]");
    if (!b || b.disabled || !cat) return;
    var next = window.EkteTrendPick.toggle(trends(), b.getAttribute("data-trend"), cat.order, cat.max);
    F.set({ "trend.metrics": next.join(",") });
  });

  // Every selected trend gets its tile, in the server's order and of a fixed
  // size (CSS .tr), so the trends line up across groups: with one value the
  // sparkline's space stays empty, without any the tile shows a dash. Values,
  // colour family and "rising / falling" are the server's.
  var SPARK_W = 96, SPARK_H = 36; // drawing size; CSS --sw / --sh scale it
  function trendHTML(g) {
    var gap = '<span class="nospark" aria-hidden="true"></span>';
    var tiles = (cat ? trends() : []).map(function (id) {
      var m = cat.byId[id], t = g.trends[id], name = keyed(m.short_label_key);
      var last = t && t.last, pts = (t && t.points) || [];
      if (!last || last.value == null || !pts.length) {
        return '<div class="tr f-grey" data-m="' + esc(id) + '"><span class="tl">' + esc(name) + '</span><div class="tv">' + gap +
          '<b class="none"><span aria-hidden="true">—</span><span class="sr-only">' + esc(T("无数据", "no data")) + "</span></b></div></div>";
      }
      var unit = UNIT[m.format] || "", u = unit ? " " + unit : "";
      var shown = m.format === "grade" && last.grade ? last.grade : fmtValue(m, last.value);
      var label = Tf("{metric}趋势（{n} 次检测）：从 {first} 到 {last}，{dir}。", "{metric} trend across {n} audits: from {first} to {last}, {dir}.", {
        metric: keyed(m.label_key), n: t.n, first: fmtValue(m, t.first) + u, last: shown + u,
        dir: last.trend_key ? keyed(last.trend_key) : keyed("trend.unchanged") });
      // drawing scale: the score's and the grade's fixed ranges, else the points'
      var lo = m.format === "score" ? 0 : m.format === "grade" ? 1 : Math.min.apply(null, pts);
      var hi = m.format === "score" ? 100 : m.format === "grade" ? cat.grades.length : Math.max.apply(null, pts);
      return '<div class="tr f-' + esc(last.family || "grey") + '" data-m="' + esc(id) + '"><span class="tl">' + esc(name) + '</span><div class="tv">' +
        (pts.length >= 2 ? sparkSVG(pts, lo, hi, label, true, SPARK_W, SPARK_H) : gap) +
        "<b>" + esc(shown) + (unit ? "<small>" + esc(unit) + "</small>" : "") + "</b></div></div>";
    }).join("");
    return '<div class="trend">' + tiles + "</div>";
  }

  /* ---------------- rows ---------------- */
  var SURFACE = { chat: ["对话", "Chat"], embedding: ["嵌入", "Embeddings"], rerank: ["重排", "Reranking"] };
  var surfaceLabel = function (v) { return SURFACE[v] ? T(SURFACE[v][0], SURFACE[v][1]) : v; };
  var STREAM = {
    stream: ["流式", "Streaming"],
    non_stream: ["非流式", "Non-streaming"],
    both: ["流式 + 非流式", "Streaming + non-streaming"],
  };
  var streamLabel = function (v) { return STREAM[v] ? T(STREAM[v][0], STREAM[v][1]) : v; };
  var detectLabel = function (v) { return v === "auto" ? T("自动识别", "auto-detected") : T("手动指定", "set manually"); };
  function surfaceOf(r) { return (r && r.surface) || "chat"; }
  // a badge for every surface but chat (the default, most rows)
  function surfaceHTML(r) {
    var s = surfaceOf(r);
    return s === "chat" ? "" : ' <span class="badge machine-soft">' + esc(surfaceLabel(s)) + "</span>";
  }
  function fam(r, k) { return (r.family && r.family[k]) || "grey"; }

  function rowHTML(r) {
    var id = String(r.id);
    var lvl = r.risk_level || "inconclusive";
    var open = String(state.open) === id;
    return '<li class="row" data-id="' + esc(id) + '"><div class="rline">' +
      '<button type="button" class="rmain" id="r-' + esc(id) + '" aria-expanded="' + open + '" aria-controls="p-' + esc(id) + '">' +
      '<span class="c-date">' + esc(fmtTime(r.ts)) + "</span>" +
      '<span class="c-risk"><span class="badge ' + esc(fam(r, "risk")) + '">' + ico(RISKI[lvl] || "info") + " " +
      esc(EKTE_I18N.label("RISK_LEVEL", lvl)) + "</span></span>" +
      '<span class="c-score f-' + esc(fam(r, "score")) + '"><span class="sr-only">' + esc(T("健康分", "Score")) + " </span>" + num(r.score) + "</span>" +
      '<span class="c-grade f-' + esc(fam(r, "grade")) + '"><span class="sr-only">' + esc(T("评级", "Grade")) + " </span>" + esc(r.grade || "–") + "</span>" +
      '<span class="c-mode"><b>' + esc(r.mode || "check") + "</b>" + surfaceHTML(r) + (byMonitor(r) ? ' <span class="badge sky">' + ico("bell") + " " + esc(T("监控", "Monitor")) + "</span>" : "") + (r.suite ? " · " + esc(r.suite) : "") + protoHTML(r) +
      (typeof r.latency_p50_ms === "number" ? '<span class="perf" title="' + esc(T("延迟 p50", "Latency p50")) + '">p50 ' + Math.round(r.latency_p50_ms) + " ms</span>" : "") + "</span>" +
      '<span class="c-cv" aria-hidden="true">' + ico("chevronDown") + "</span></button>" +
      rerunBtnHTML(r) + schedBtnHTML(r) +
      '<button type="button" class="rdel" aria-label="' + esc(T("删除此记录", "Delete entry")) + '" title="' + esc(T("删除此记录", "Delete entry")) +
      '" aria-expanded="' + (state.confirm === id) + '" aria-controls="c-' + esc(id) + '">' + ico("trash") + "</button></div>" +
      confirmHTML("c-" + esc(id), id, T("删除这条历史记录？", "Delete this history entry?"), T("删除", "Delete")) +
      '<p class="rmsg" id="m-' + esc(id) + '" role="status"></p>' +
      '<div class="panel" id="p-' + esc(id) + '" data-id="' + esc(id) + '" role="region" aria-labelledby="r-' + esc(id) + '" hidden></div></li>';
  }

  // protocol (auto-detected or set by hand) and the probe's request mode
  function protoHTML(r) {
    var bits = [];
    if (r.api) bits.push(esc(r.api) + (r.detect ? " (" + esc(detectLabel(r.detect)) + ")" : ""));
    if (r.stream_mode && surfaceOf(r) === "chat") bits.push(esc(streamLabel(r.stream_mode)));
    return bits.length ? '<span class="proto">' + bits.join(" · ") + "</span>" : "";
  }

  // A run a monitor produced already has its monitor: offer no second one.
  function byMonitor(r) { return !!r && r.watch_id != null; }

  // Re-run: open the audit form prefilled with this run's configuration. A
  // non-chat run preselects its surface in the audit page's endpoint-type
  // selector (?surface=embedding|rerank).
  var RERUN_SURFACES = { embedding: 1, rerank: 1 };
  function rerun(id) {
    var s = surfaceOf(state.rows[String(id)]), q = "rerun=" + encodeURIComponent(id);
    location.href = RERUN_SURFACES.hasOwnProperty(s) ? "/?surface=" + s + "&" + q : "/?" + q;
  }

  // Re-score a saved run from its evidence file: a background job, followed
  // on the audit page like any audit.
  function rescore(id) {
    fetch("/api/history/" + encodeURIComponent(id) + "/rescore", { method: "POST" })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
          return j;
        });
      })
      .then(function (job) {
        location.href = "/?job=" + encodeURIComponent(job.id);
      })
      .catch(function (e) {
        var msg = document.getElementById("m-" + id);
        if (msg) msg.textContent = T("无法重新评分：", "Could not re-score: ") + EKTE_LANG.server(String((e && e.message) || e));
      });
  }

  function rerunBtnHTML(r) {
    var label = T("重新检测", "Re-run audit");
    return '<button type="button" class="rrerun" data-rerun="' + esc(String(r.id)) + '" aria-label="' + esc(label) + '" title="' + esc(label) + '">' + ico("refresh") + "</button>";
  }

  function schedBtnHTML(r) {
    var id = String(r.id);
    if (byMonitor(r)) {
      var why = T("此记录由监控运行产生", "This run was produced by a monitor");
      return '<button type="button" class="rsched bymon" disabled aria-label="' + esc(why) + '" title="' + esc(why) + '">' + ico("bell") + "</button>";
    }
    return '<button type="button" class="rsched" data-sched="' + esc(id) + '" aria-label="' + esc(T("设为监控", "Schedule as monitor")) + '" title="' + esc(T("设为监控", "Schedule as monitor")) + '">' + ico("bell") + "</button>";
  }

  /* ---------------- report drawer ---------------- */
  function mount(panel, report) {
    var el = document.createElement("div");
    var id = panel.getAttribute("data-id");
    var row = state.rows[id];
    el.className = "rep";
    panel.innerHTML = "";
    panel.appendChild(el);
    EkteReport.render(el, report, {
      actions: (byMonitor(row) ? [] : [
        { zh: "设为监控", en: "Schedule as monitor", primary: true, onClick: function () { schedule(id); } },
      ]).concat([
        { zh: "重新检测", en: "Re-run audit", onClick: function () { rerun(id); } },
      ]).concat(report && report.evidence ? [
        // replays the run's recorded requests and responses: no relay contacted
        { zh: "用当前版本重新评分", en: "Re-score with this version", onClick: function () { rescore(id); } },
      ] : []),
      download: { name: "ekte-report-" + panel.getAttribute("data-id") },
      // the saved run: its raw request/response pairs open under each finding
      historyId: id,
    });
  }

  function fetchReport(panel, id) {
    panel.innerHTML = '<div class="state loading">' + esc(T("加载报告…", "Loading report…")) + "</div>";
    fetch("/api/history/" + encodeURIComponent(id) + "?trend=1")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (rep) {
        state.reports[id] = rep;
        if (panel.isConnected) mount(panel, rep);
      })
      .catch(function (e) {
        if (panel.isConnected)
          panel.innerHTML = '<div class="errbox">' + esc(T("无法加载这份报告：", "Could not load this report: ")) + esc(String((e && e.message) || e)) + "</div>";
      });
  }

  // Schedule a run: the server copies its configuration into a paused monitor
  // with no interval yet; the monitors page then asks for the interval (and the
  // API key, which history never stores) before it can be switched on.
  function schedule(id) {
    var btn = host.querySelector('[data-sched="' + id + '"]'), msg = document.getElementById("m-" + id);
    if (btn) btn.disabled = true;
    if (msg) msg.textContent = "";
    fetch("/api/watches/from-history/" + encodeURIComponent(id), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ language: EKTE_LANG.get() }),
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok || !j.id) throw new Error((j && j.error) || "HTTP " + r.status);
          location.href = "/watches#w-" + j.id;
        });
      })
      .catch(function (e) {
        if (btn) btn.disabled = false;
        if (msg) msg.textContent = T("无法设为监控：", "Could not schedule this run: ") + EKTE_LANG.server(String((e && e.message) || e));
      });
  }

  function toggle(id) {
    var prev = state.open;
    if (prev != null) {
      var pb = document.getElementById("r-" + prev), pp = document.getElementById("p-" + prev);
      if (pb) pb.setAttribute("aria-expanded", "false");
      if (pp) { pp.hidden = true; pp.innerHTML = ""; }
    }
    state.open = String(prev) === id ? null : id;
    if (state.open == null) return;
    var b = document.getElementById("r-" + id), p = document.getElementById("p-" + id);
    b.setAttribute("aria-expanded", "true");
    p.hidden = false;
    // the link to this view reaches this run
    F.set({ "runs.focus": id });
    if (state.reports[id]) mount(p, state.reports[id]);
    else fetchReport(p, id);
  }

  /* ---------------- delete / clear ---------------- */
  function setConfirm(what) {
    state.confirm = what;
    Array.prototype.forEach.call(host.querySelectorAll(".confirm"), function (c) {
      var mine = c.querySelector("[data-yes]").getAttribute("data-yes") === what;
      c.hidden = !mine;
      var m = c.querySelector(".msg"), y = c.querySelector("[data-yes]");
      m.textContent = m.getAttribute("data-msg"); // drop a previous error
      y.disabled = false;
    });
    Array.prototype.forEach.call(host.querySelectorAll("[aria-controls]"), function (b) {
      if (b.classList.contains("rdel") || b.id === "clr")
        b.setAttribute("aria-expanded", String(b.getAttribute("aria-controls") === (what === "all" ? "clrConfirm" : "c-" + what)));
    });
    if (what != null) {
      var c = document.getElementById(what === "all" ? "clrConfirm" : "c-" + what);
      var no = c && c.querySelector("[data-no]");
      if (no) no.focus();
    }
  }

  function doDelete(what) {
    var url = what === "all" ? "/api/history" : "/api/history/" + encodeURIComponent(what);
    var btn = host.querySelector('[data-yes="' + what + '"]');
    if (btn) btn.disabled = true;
    fetch(url, { method: "DELETE" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        state.confirm = null;
        if (what === "all") { state.reports = {}; state.open = null; }
        else delete state.reports[what];
        if (what === "all" || focusRun() === what) F.set({ "runs.focus": null });
        return load();
      })
      .then(function () {
        var first = host.querySelector(".rmain") || host.querySelector(".empty-box a");
        (first || host).focus();
      })
      .catch(function (e) {
        if (btn) btn.disabled = false;
        var c = btn && btn.closest(".confirm");
        if (c) c.querySelector(".msg").textContent = T("删除失败：", "Could not delete: ") + String((e && e.message) || e);
      });
  }

  host.addEventListener("click", function (ev) {
    var t = ev.target.closest("button");
    if (!t || !host.contains(t)) return;
    if (t.id === "nmreset") {
      F.reset();
      F.panel.focusStart();
      return;
    }
    if (t.classList.contains("rmain")) return toggle(t.id.slice(2));
    if (t.hasAttribute("data-sort")) return setSort(t.getAttribute("data-sort"));
    if (t.hasAttribute("data-gkey")) return toggleGroup(t);
    if (t.id === "gall") return setAllGroups(t.getAttribute("data-all") === "expand");
    if (t.hasAttribute("data-more")) return showMore(t);
    if (t.hasAttribute("data-gmore")) return showMoreGroups(t);
    if (t.hasAttribute("data-rerun")) return rerun(t.getAttribute("data-rerun"));
    if (t.hasAttribute("data-sched")) return schedule(t.getAttribute("data-sched"));
    if (t.classList.contains("rdel")) {
      var id = t.closest(".row").getAttribute("data-id");
      return setConfirm(state.confirm === id ? null : id);
    }
    if (t.id === "clr") return setConfirm(state.confirm === "all" ? null : "all");
    if (t.hasAttribute("data-no")) {
      var w = t.getAttribute("data-no");
      setConfirm(null);
      var back = w === "all" ? $("#clr") : host.querySelector('.row[data-id="' + w + '"] .rdel');
      if (back) back.focus();
      return;
    }
    if (t.hasAttribute("data-yes")) return doDelete(t.getAttribute("data-yes"));
  });
  host.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape" || state.confirm == null) return;
    var w = state.confirm;
    setConfirm(null);
    var back = w === "all" ? $("#clr") : host.querySelector('.row[data-id="' + w + '"] .rdel');
    if (back) back.focus();
  });

  // live language switch: re-render from the loaded data (no refetch); the
  // open report is re-rendered by report.js and carried over by render().
  window.addEventListener("ekte:lang", function () { render(); });

  // the metric catalogue first (trend options, labels, grade scale), then the list
  function start() {
    host.setAttribute("aria-busy", "true");
    get("/api/metrics", signal()).then(function (c) {
      var byId = {};
      (c.metrics || []).forEach(function (m) { byId[m.id] = m; });
      cat = { byId: byId, order: (c.history_trends || []).filter(function (id) { return byId[id]; }),
        max: c.max_trends || 2, grades: c.grades || [], labels: c.labels || {} };
      var patch = {}, want = trends().join(",");
      if (String(F.state()["trend.metrics"]) !== want) patch["trend.metrics"] = want;
      if (String(F.state()["groups.sort"] || DEF_SORT) !== sortValue()) patch["groups.sort"] = null;
      if (F.state()[FOCUS] != null && !focusRun()) patch[FOCUS] = null;
      // the URL holds only valid view keys; no reload yet (state.groups is null)
      if (Object.keys(patch).length) F.set(patch);
      F.render();
      return load();
    }, function (e) {
      if (isAbort(e)) return;
      state.error = String((e && e.message) || e);
      render();
      host.setAttribute("aria-busy", "false");
      loadNote();
    });
  }
  start();
})();
