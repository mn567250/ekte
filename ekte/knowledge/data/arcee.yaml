  notes: 'Flagship of the Trinity family, released 2026-04-01 (OpenRouter listing; Hugging Face card arcee-ai/Trinity-Large-Thinking). Sparse MoE, 398B total parameters with about 13B active per token, Apache-2.0 weights (per a secondary listing). Context is UNVERIFIED (-1): the OpenRouter listing says 262,144 tokens with 80,000 max output, but Arcee''s docs say the model was trained at 256K and hosted at 128k, and a second docs page gives a conflicting pretraining length; one aggregator says 512K. Max output unknown (-1). Reasoning model (thinking before answering) with tool calling. Arcee describes it as post-trained for multi-turn tool use and long agent runs. Its first-party API name is trinity-large-thinking (Arcee docs, via search snippet). A free promotional OpenRouter tier ran through 2026-05-23; current price on OpenRouter about $0.25 in / $0.80 out per MTok per a snippet. Knowledge cutoff not published (null).'
