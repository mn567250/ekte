relay_red_flags:
- Asked who made it, the model names a rival lab (OpenAI/GPT, Anthropic/Claude, Google/Gemini, Qwen, DeepSeek, Llama) instead of Arcee AI or Trinity.
- A model billed as trinity-large-thinking shows a context-length error well below the 128K Arcee's docs say it is hosted at, or a max-output cap far below what the hosting listings advertise.
- trinity-large-thinking answers without reasoning when reasoning is requested, or no reasoning channel appears for the thinking model.
- Trinity-Mini or Trinity-Large-Preview answers with a 512K-class window or a context of more than 131K; the preview API is served at 128K, so a value above that suggests a different model.
- Requests for Virtuoso, Maestro, Blitz or Coder-branded ids (retired fine-tunes) still answering as Trinity models, pointing to a relay that swaps names.
