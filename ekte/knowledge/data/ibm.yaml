fingerprints:
- id: self-id
  signal: self-identification (vendor/model family)
  prompt: What model are you and which company built you? Answer in one short sentence.
  native_expected: Identifies as IBM Granite (e.g. 'I am Granite, developed by IBM'). Should mention IBM or Granite, not OpenAI, Anthropic, Google, Alibaba/Qwen, Meta/Llama, DeepSeek or Mistral.
  downgrade_signal: Names a different vendor (ChatGPT/OpenAI, Claude/Anthropic, Gemini/Google, Qwen/Alibaba, Llama/Meta, DeepSeek, Mistral). Generic 'I am an AI assistant' with no Granite or IBM mention is also suspect.
