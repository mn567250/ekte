relay_red_flags:
- Model self-identifies as ChatGPT/GPT, Claude, Gemini, Qwen, Llama or DeepSeek instead of Granite/IBM when asked which model it is.
- A reply to the native watsonx chat call that is OpenAI-shaped (chatcmpl ids, 'model' field) rather than watsonx's own schema. The native API is not OpenAI-compatible, so an OpenAI-shaped native reply is a tell (unverified against IBM's API reference).
- A claimed granite-4.2-8b (reasoning) returns no reasoning channel when thinking is enabled, or returns chain-of-thought inline in content with no separate thinking output.
- Context-length errors well below 128K on a claimed granite-4.0-h-small, granite-4.1-8b or granite-4.2-8b, or output truncation far below the window (e.g. capped near 4K-8K).
- A claimed granite-embedding-small-english-r2 returns vectors whose length is not 384, or a 768-dim vector labelled as this 384-dim model.
