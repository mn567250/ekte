relay_red_flags:
- A claimed Hermes model answers as ChatGPT, GPT, Claude, Gemini, Qwen or DeepSeek, or names another lab as its developer instead of Nous Research (Hermes 4 70B/405B and Hermes 3 405B are Llama-based and may say Llama; Hermes 4.3 36B is Seed-based).
- A claimed Hermes 4 / 4.3 model never produces a reasoning trace where the hybrid reasoning toggle is enabled, or emits its reasoning as literal text inside the answer.
- A claimed Hermes-4-405B or Hermes-3-Llama-3.1-405B answer comes back far too quickly and too cheaply for a 405B dense model, or with a context-length rejection far below the advertised window.
- The relay serves the Hermes name under a host-style id that is not one of the Nous / OpenRouter slugs (nousresearch/hermes-4-70b, nousresearch/hermes-4-405b, nousresearch/hermes-3-llama-3.1-405b), or claims Hermes 4 14B, which no source found was served.
- Tool calls on a claimed Hermes model fail with a schema error that the Nous Portal API would not return, or the relay claims a Nous Portal base URL but routes the request to another vendor's endpoint.
