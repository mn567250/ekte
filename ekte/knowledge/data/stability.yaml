relay_red_flags:
- Claims a stable-image-* id but returns output in a different size class than Ultra/Core defaults (1024x1024 native) with no aspect_ratio honored, or serves a DALL-E-style fixed size set.
- Claims an sd3.5-* id but the body or headers lack the v2beta response shape (base64 image in JSON with finish_reason and seed), or the endpoint answers only under an OpenAI /images/generations path.
- Image output for a stable-image or sd3.5 request carries a Flux- or DALL-E-style fingerprint (a different default size or dimensions off the aspect ratio grid).
- Identifies as OpenAI, Black Forest Labs/FLUX, Midjourney or Qwen when asked to describe its model family (Stability image models do not self-identify in text).
