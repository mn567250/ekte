relay_red_flags:
- Model claims to be Nemotron/NVIDIA but self-identifies as GPT, Claude, Gemini, Qwen or DeepSeek.
- Model claimed as the Llama-Nemotron 49B checkpoint answers as a plain Llama without the NVIDIA fine-tune, or as Qwen.
- Nemotron 3 Super claimed at a 1M-token context fails at 128K+ long-context retrieval; Nano claimed at 256K fails well before that.
- Model claimed as nemotron-3-* is served by a different architecture with a visibly different speed profile (a MoE with about 3B to 12B active parameters should be fast per token).
- Relay returns an NVIDIA id under an OpenAI path only, with no NIM-style /v1/chat/completions response shape from integrate.api.nvidia.com.
