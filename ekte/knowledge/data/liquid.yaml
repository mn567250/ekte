  notes: 'LFM2.5-24B-A2B, a 24B-total MoE with about 2.3-2.45B active parameters (figures differ by source), hybrid architecture: 40 layers (30 gated short convolution, 10 GQA), 64 experts per MoE block, top-4 routing. Continued from LFM2-24B-A2B with an expanded vocabulary, so it is Liquid''s own lineage (not a fine-tune of a third-party base). Context 131,072 tokens per Liquid''s docs (docs.liquid.ai) and the Hugging Face card; OpenRouter lists 128,000 with 8,192 completion tokens (max output not from an official source, so -1). Open weights on Hugging Face. Release date not confirmed (search snippets conflict: February 2026 for the LFM2 line, one snippet dates LFM2.5-24B-A2B to October 2026). Reasoning per OpenRouter''s description (it reasons before answering); the official reasoning toggle was not checked, so treat as unverified.'
