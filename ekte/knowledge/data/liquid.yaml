relay_red_flags:
- Asked who built it, the model names a rival lab (OpenAI, Anthropic, Google, Qwen, DeepSeek, Meta) instead of Liquid AI or LFM.
- A claimed LFM2.5 or LFM2 model replies with context-length errors near 32K when the model is LFM2.5-24B-A2B or LFM2.5-2.6B (131K native), or accepts 131K where a claimed LFM2 or LFM2.5-1.2B-Thinking should cap at 32K.
- A model billed as LFM2.5-1.2B-Thinking or LFM2.5-2.6B returns no reasoning trace at all, or reasoning in a plain <think> block where the family expects a thinking output.
- Relays keep answering as LiquidAI/LFM2-24B-A2B after its deprecation; the answers may come from a different model.
- Claims of tool calls or long agentic coding from LFM2.5-2.6B, which Liquid says it is not built for, may indicate a larger model behind the name.
