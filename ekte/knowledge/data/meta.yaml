fingerprints:
- id: self-id
  signal: self-identification (vendor/model family)
  prompt: What model are you, and which company built you? Answer in one short sentence.
  native_expected: Genuine Llama models identify as a Llama model built by Meta (Meta AI). They do NOT claim to be GPT/ChatGPT, Claude, Gemini, Qwen, DeepSeek or Mistral.
  downgrade_signal: A substituted backend self-identifies as OpenAI/ChatGPT, Anthropic/Claude, Google/Gemini, Alibaba/Qwen, DeepSeek, Mistral or Zhipu/GLM instead of Llama/Meta. Generic 'I am an AI assistant' with no Llama or Meta mention is also suspect.
  pure_code_checkable: true
  expect_contains_any:
  - llama
  - meta
  expect_not_contains:
  - gpt
  - openai
  - chatgpt
  - claude
  - anthropic
  - gemini
  - google
  - qwen
  - alibaba
  - deepseek
  - mistral
  - glm
  - zhipu
relay_red_flags:
- Claimed Llama 4 Scout or Maverick that answers with a 128K or smaller context limit, or rejects requests above 128K, while the claim is Llama 4 (Scout 10M, Maverick 1M native). Hosts often cap context, so treat this as a signal to check, not proof.
- Model self-identifies as GPT/ChatGPT, Claude, Gemini, Qwen, DeepSeek, Mistral or GLM when asked, instead of Llama/Meta.
- A claimed Llama 3.1 8B that runs at 70B-class quality or throughput, or a claimed Llama 3.1 405B that answers as a small model; check speed and reasoning depth against the claimed size.
- A claimed meta-llama/Llama-3.2-*-Vision model that accepts images but returns text unrelated to the image, or that refuses image input entirely.
- Requests to the Meta Llama API base URL (api.llama.com / llama.developer.meta.com) that succeed as a first-party Llama API. The Llama API preview was reported retired on 2026-07-06 (secondary source). Meta's current hosted service is the Muse model family at api.meta.ai, which is not Llama.
