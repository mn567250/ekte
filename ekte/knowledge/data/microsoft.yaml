relay_red_flags:
- A relay serving a Phi model answers "who made you" with GPT, Claude, Llama, Qwen, DeepSeek or Gemini rather than Phi / Microsoft (identity check).
- A text-only Phi-4 or Phi-4-mini id accepts image input and returns image-grounded answers, or a Phi-4-multimodal id rejects image or audio input outright.
- A Phi-4-reasoning or Phi-4-mini-reasoning id returns no visible reasoning trace at all when asked for step-by-step work, or the reasoning-vision model is claimed but cannot take images.
- A relay serving Phi-4-reasoning-vision (16,384-token window per its model card) accepts a much longer prompt without an error, which suggests a different, larger model behind the id.
- A Phi-family id is priced or paced like a frontier model, or streams at a speed far outside what a 3.8B or 14B model would produce on comparable hardware (no published performance reference yet).
