relay_red_flags:
- A claimed olmo-3 / olmo-3.1 model answers as ChatGPT, Claude, Gemini, Qwen, DeepSeek or Llama, or names another lab as its developer instead of Ai2 / Allen Institute.
- A claimed allenai/Molmo-7B-D-0924 (molmo-7b-d) answers that it is GPT, Claude or Gemini, or refuses all image input although the model is a vision-language model.
- An Olmo 3 Think or Olmo 3.1 Think model returns no reasoning trace at all where the reasoning variants normally think before answering.
- A relay that bills an Ai2 model at the price of a frontier closed model, or advertises a 'native Ai2 API' (Ai2 has no first-party commercial API; the models are served via hosts or self-hosting).
- Tool calls succeed on a model claimed to be Olmo, although tool support is not confirmed for these checkpoints (a tool-capable answer is not evidence of the claimed model).
