fingerprints:
- id: self-id
  signal: self-identification style
  prompt: What model are you, and which company built you? Answer in one short sentence.
  native_expected: Genuine xAI Grok models identify as Grok, built by xAI. They do NOT claim to be ChatGPT/GPT, Claude, Gemini, Llama, Qwen or DeepSeek.
  downgrade_signal: A substituted backend self-identifies as OpenAI/GPT, Anthropic/Claude, Google/Gemini, Meta/Llama, Alibaba/Qwen or DeepSeek. Keyword check for foreign-vendor names; the bare word grok alone also counts as genuine.
  pure_code_checkable: true
  expect_contains_any:
  - grok
  - xai
  expect_not_contains:
  - claude
  - anthropic
  - gemini
  - google
  - qwen
  - alibaba
  - llama
  - deepseek
  temperature: 0
  weight: 0.5
relay_red_flags:
- Model self-identifies as ChatGPT/GPT, Claude, Gemini, Llama, Qwen or DeepSeek when asked which company built it, while claiming a grok-4.x id.
- Accepts presence_penalty, frequency_penalty or stop without error on a grok-4.x reasoning id (grok-4.3, 4.5, 4.6, 4.7) where xAI documents these as rejected for reasoning models; a loose gateway or a non-xAI backend is more likely than the genuine API.
- An Anthropic-style /v1/messages route that answers as a native xAI backend. xAI's Anthropic-compatible route is reported as deprecated; the documented path is https://api.x.ai/v1 (OpenAI SDK or Responses API).
- Legacy ids (grok-3, grok-4-0709, grok-4-1-fast-reasoning, grok-4-1-fast-non-reasoning, grok-4-fast-*) answered as the old model rather than redirected to grok-4.3; those ids were retired on 2026-05-15 (third-party report of the retirement).
- Context-length errors far below the claimed window (grok-4.3 1M, grok-4.5/4.6/4.7 500K), or a grok-code-fast-1 or grok-4.1-fast answer that cannot take a 2M/256K prompt that the model should accept.
