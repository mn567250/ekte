relay_red_flags:
- Claimed mistral-large-4 or mistral-small-2603 answers with a 1M or 256K context boundary that is far smaller (a Large 4 claim that errors below ~256K, or a Small 4 claim capped near 32K-128K), which points to an older Large 3 or a smaller Mistral model behind the name.
- A relay bills mistral-large-2512, mistral-medium-3-5, devstral-2512 or magistral-medium-2509 after their documented retirement dates (2026-10-31 for Large 3 and Medium 3.5; 2026-05-22 and 2026-07-31 for Devstral 2 and Magistral Medium 1.2). Retired ids should return an error, so answering them is a sign of a substitute.
- Self-identification as a non-Mistral family (GPT, Claude, Gemini, Qwen, Llama, DeepSeek) when asked which company built the model.
- Embedding claim mistral-embed returning a vector length other than 1024, or codestral-embed returning a length outside the documented 1536 default to 3072 range.
- Reasoning claimed on mistral-small-2603 but reasoning_effort is not accepted (the documented values are none and high), or Magistral claimed to be reasoning with no thinking chunk.
- Vision request accepted on a text-only claim (mistral-large-2512, mistral-medium-3-5, codestral-2508, devstral-2512) or refused on a claim that is vision-capable (mistral-large-4, mistral-small-2603, ministral 3 family).
