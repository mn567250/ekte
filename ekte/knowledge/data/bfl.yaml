relay_red_flags:
- Claims a flux-* id but returns OpenAI-style data with a b64_json body from a single synchronous call; BFL's API is asynchronous (POST then poll polling_url until Ready).
- Claims flux-pro-1.1 or flux-kontext-* but returns width/height-shaped output for an aspect_ratio model (flux-pro-1.1-ultra) or refuses aspect_ratio; the native API's sizing differs per endpoint.
- Image dimensions returned for a flux-2 or flux-pro request that exceed the 4 MP ceiling reported for FLUX.2, or square-only output for a request asking for landscape.
- Identifies as OpenAI, Stability, Midjourney or Qwen when asked to describe its model family (BFL image models do not self-identify in text).
- Result URLs that never expire or are cached indefinitely, or that vary between identical polls of the same id, are inconsistent with BFL's temporary result links.
