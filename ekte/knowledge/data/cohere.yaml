relay_red_flags:
- Asked for its model or vendor under a command-a or command-r id, it names OpenAI, Anthropic, Google, Meta or DeepSeek instead of Cohere
- An embed-v4.0 response whose vector length is not 1536 (or not one of 256/512/1024/1536 when an output dimension was requested) indicates a different embedding model behind the id
- A relay serving a retired Cohere id (command-r, command-r-plus, command-r-03-2024, command-r-plus-04-2024, Embed v2.0, Aya Expanse 8B, Aya Vision 8B) as if current; the Cohere deprecation changelog is the reference
- Command A Translate or embed ids reliably performing tool calls, which the native models do not support, suggests a different backend
- Context-length errors well below 256K on command-a / command-a-reasoning or below 128K on command-a-vision / command-a-plus, or output caps far below the official max output, indicate a smaller model or a relay-imposed cap
- Command A Translate accepting more than 16K total tokens per request (8K in and 8K out per the official page) points to a different model or a relay that ignores the limit
