- banner:
  - link "Zum Hauptinhalt springen":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - link "Klassische Oberfläche":
    - /url: "?ui=v1"
  - combobox "Design":
    - option "Automatisch"
    - option "Hell" [selected]
    - option "Dunkel"
  - combobox "Sprache":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch" [selected]
  - link "Barrierefreiheit":
    - /url: /v2/accessibility
  - navigation "Hauptnavigation":
    - link "Prüfung":
      - /url: /v2/
    - link "Werkzeuge":
      - /url: /v2/tools
    - link "Verlauf":
      - /url: /v2/history
    - link "Analyse":
      - /url: /v2/analytics
    - link "Überwachung":
      - /url: /v2/watches
    - link "Wissen":
      - /url: /v2/kb
- main:
  - heading "Audit-Analyse" [level=1]
  - paragraph: "Vergleichen Sie Relays und Modelle im Zeitverlauf mit dem, was zing auf diesem Rechner gemessen hat: Scores, Geschwindigkeit, Erfolgsquoten und Abrechnung."
  - paragraph:
    - text: Berechnet aus dem lokalen Verlauf unter
    - code: ~/.zing
    - text: — nichts wird hochgeladen.
  - status: "Aktualisiert: 14 Läufe in diesem Zeitraum."
  - region "Filter":
    - button "Filter" [expanded]
    - text: Zeitraum
    - group "Zeitraum":
      - button "Letzte 7 Tage"
      - button "Letzte 30 Tage" [pressed]
      - button "Letzte 90 Tage"
      - button "Gesamter Zeitraum"
      - button "Eigener Zeitraum"
    - text: Suite
    - combobox "Suite":
      - option "Alle"
      - option "standard" [selected]
    - text: Messanfragen
    - combobox "Messanfragen":
      - option "Alle"
      - option "Streaming" [selected]
    - text: Protokoll
    - combobox "Protokoll":
      - option "Alle" [selected]
      - option "openai"
    - text: Quelle
    - combobox "Quelle":
      - option "Alle" [selected]
      - option "Manuell"
      - option "Überwachung"
    - text: Relay / Anbieter
    - combobox "Relay / Anbieter":
      - option "Alle" [selected]
      - option "Example Relay"
      - option "https://gateway.a-very-long-relay-hostname.example.org/openai/compatible/v1"
      - option "http://127.0.0.1:9099/v1"
    - text: Angegebenes Modell
    - combobox "Angegebenes Modell":
      - option "Alle" [selected]
      - option "model-a"
      - option "model-b"
      - option "gpt-4o"
    - text: 15 Läufe im Verlauf (4 von Überwachungen).
  - button "Link zu dieser Ansicht kopieren"
  - tablist "Analyseansichten":
    - tab "Überblick" [selected]
    - tab "Trends"
    - tab "Zuverlässigkeit"
    - tab "Modellechtheit"
    - tab "Abrechnung"
  - tabpanel "Überblick":
    - region "Überblick":
      - heading "Überblick" [level=2]
      - paragraph: 02.09. – 01.10.2026, verglichen mit dem gleich langen Zeitraum davor (03.08. – 01.09.2026).
      - list:
        - listitem: Läufe 14 +14
        - listitem: Relays 2 +2
        - listitem: Modelle 2 +2
        - listitem: Median-Score 79 Keine Daten im vorigen Zeitraum
        - listitem: Anteil hohes Risiko 21,4 % Keine Daten im vorigen Zeitraum
        - listitem: Erfolgsquote 100 % Keine Daten im vorigen Zeitraum
        - listitem: Zeit bis zum ersten Token p50 <duration> Keine Daten im vorigen Zeitraum
        - listitem: Dekodiertempo 62,9 tok/s Keine Daten im vorigen Zeitraum
        - listitem: Abrechnungsverhältnis (Eingabe) 103 % Keine Daten im vorigen Zeitraum Daten aus 9 von 14 Läufen
        - listitem: Abrechnungsverhältnis (Ausgabe) 102 % Keine Daten im vorigen Zeitraum Daten aus 9 von 14 Läufen
    - region "Rangliste":
      - heading "Rangliste" [level=2]
      - paragraph: Mediane über den gewählten Zeitraum; n ist die Zahl der Läufe, die einen Wert gemessen haben.
      - group "Rangfolge":
        - button "Relays für ein Modell" [pressed]
        - button "Modelle eines Relays"
      - text: Modell
      - combobox "Modell":
        - option "model-a" [selected]
        - option "model-b"
        - option "gpt-4o"
      - region "Relays für „model-a“":
        - table "Relays für „model-a“":
          - caption: Relays für „model-a“
          - rowgroup:
            - row "Relay Läufe Score Zeit bis zum ersten Token p50 Dekodiertempo Erfolgsquote Abrechnungsverhältnis (Eingabe) Abrechnungsverhältnis (Ausgabe) Anteil Modellabweichung Anteil hohes Risiko Letzter Lauf":
              - columnheader "Relay":
                - button "Relay"
              - columnheader "Läufe":
                - button "Läufe"
              - columnheader "Score":
                - button "Score"
              - columnheader "Zeit bis zum ersten Token p50":
                - button "Zeit bis zum ersten Token p50"
              - columnheader "Dekodiertempo":
                - button "Dekodiertempo"
              - columnheader "Erfolgsquote":
                - button "Erfolgsquote"
              - columnheader "Abrechnungsverhältnis (Eingabe)":
                - button "Abrechnungsverhältnis (Eingabe)"
              - columnheader "Abrechnungsverhältnis (Ausgabe)":
                - button "Abrechnungsverhältnis (Ausgabe)"
              - columnheader "Anteil Modellabweichung":
                - button "Anteil Modellabweichung"
              - columnheader "Anteil hohes Risiko":
                - button "Anteil hohes Risiko"
              - columnheader "Letzter Lauf":
                - button "Letzter Lauf"
          - rowgroup:
            - row "Example Relay 7 82 n=7 <duration> n=7 63,2 tok/s n=7100 % n=7104 % n=7102 % n=7 0 % n=7 0 % n=7 30.09.2026, 11:00":
              - rowheader "Example Relay"
              - cell "7"
              - cell "82 n=7"
              - cell "<duration> n=7"
              - cell "63,2 tok/s n=7"
              - cell "100 % n=7"
              - cell "104 % n=7"
              - cell "102 % n=7"
              - cell "0 % n=7"
              - cell "0 % n=7"
              - cell "30.09.2026, 11:00"
            # … more rows of the same shape
      - status
