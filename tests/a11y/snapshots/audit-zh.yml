- banner:
  - link "跳到主要内容":
    - /url: "#main"
  - link "ekte":
    - /url: /
    - text: ekte.
  - combobox "主题":
    - option "跟随系统"
    - option "浅色" [selected]
    - option "深色"
  - combobox "动画":
    - option "动画开" [selected]
    - option "动画关"
  - combobox "语言":
    - option "English"
    - option "中文" [selected]
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
    - option "Norsk"
  - link "无障碍":
    - /url: /accessibility
  - navigation "主导航":
    - link "检测":
      - /url: /
    - link "监控":
      - /url: /watches
    - link "检测历史":
      - /url: /history
    - link "分析":
      - /url: /analytics
    - link "知识库":
      - /url: /kb
- main:
  - heading "这家中转站，给的是真货吗？" [level=1]
  - paragraph: 选择中转站，挑选要检测的模型；若它以另一个名字售卖，再选它声称的模型。ekte 在你本地跑一整套黑盒检测，出一份能看懂、有依据的验真报告。
  - status:
    - text: 上次检测已完成 gateway.a-very-long-relay-hostname.example.org · model-b · 评分 72/100 · 2026年9月27日 10:02
    - button "打开报告"
  - tablist "检测":
    - tab "新检测" [selected]
    - tab "运行中"
  - tabpanel "新检测":
    - list "检测进度":
      - listitem: 配置
      - listitem: 检测
      - listitem: 报告
    - region "配置":
      - heading "配置" [level=2]
      - group "接口类型 surface":
        - text: 接口类型 surface
        - radio "对话" [checked]
        - text: 对话
        - radio "嵌入"
        - text: 嵌入
        - radio "重排"
        - text: 重排
      - text: 中转站 / 厂商 可选
      - combobox "中转站 / 厂商 可选":
        - option "选择中转站或厂商…" [selected]
        - option "其他（手动填写地址）"
      - text: 选择后会自动填写地址；不在列表中的中转站请选“其他”并填写地址。 中转站地址 base_url
      - combobox "中转站地址 base_url"
      - text: API 密钥 支持 env:VAR / file:/path
      - textbox "API 密钥":
        - /placeholder: sk-... 或 env:EKTE_API_KEY
      - button "显示密钥"
      - text: 请求的模型 model
      - textbox "请求的模型 model":
        - /placeholder: deepseek-chat
      - button "刷新模型列表" [disabled]
      - status: 选择中转站或填写地址后，ekte 会列出它的模型。
      - text: 声称的模型 claimed_model 可选
      - combobox "声称的模型 claimed_model 可选":
        - option "同请求的模型" [selected]
      - button "手动输入"
      - text: 仅当中转站以另一个名字售卖时填写 —— ekte 会按这个模型核对回答。 协议
      - group "协议":
        - button "自动" [pressed]
        - button "OpenAI"
        - button "Anthropic"
        - button "Responses"
      - text: 检测套件
      - group "检测套件":
        - button "smoke"
        - button "standard" [pressed]
        - button "deep"
        - button "full"
        - button "自定义"
      - text: 性能探测请求
      - group "性能探测请求":
        - button "流式" [pressed]
        - button "非流式"
      - text: standard 套件只在对照基线时发送探测请求；否则使用检测自身的请求。
      - button "对照可信基线 compare" [expanded]
      - paragraph: 填一个你信任的同款模型端点（如官方 API）。ekte 会用它佐证目标的表现，让替换/降级判定更可靠——质量评审与篡改检测在有基线时才会升到最高级别。
      - text: 基线中转站 / 厂商 可选
      - combobox "基线中转站 / 厂商 可选":
        - option "选择中转站或厂商…" [selected]
        - option "其他（手动填写地址）"
      - text: 选择后会自动填写地址；不在列表中的中转站请选“其他”并填写地址。 基线地址 base_url
      - combobox "基线地址 base_url"
      - text: 基线 API 密钥
      - textbox "基线 API 密钥":
        - /placeholder: sk-... 或 env:OPENAI_API_KEY
      - button "显示密钥"
      - text: 基线模型 model
      - textbox "基线模型 model":
        - /placeholder: 同款官方模型 id
      - button "刷新模型列表" [disabled]
      - status: 选择中转站或填写地址后，ekte 会列出它的模型。
      - text: 基线协议
      - group "基线协议":
        - button "自动" [pressed]
        - button "OpenAI"
        - button "Anthropic"
        - button "Responses"
      - button "开始检测"
      - text: 检测在 你本地的 ekte 服务 发起，密钥只用于连接目标中转站，不上传任何第三方。
      - alert
      - status
- contentinfo:
  - paragraph: 全部在本地：检测从你自己的机器发起，API 密钥不会离开本机。
  - paragraph: 黑盒：ekte 给出的是可复现的偏离证据，不是欺诈证明。请勿仅凭单次结果指责厂商。
