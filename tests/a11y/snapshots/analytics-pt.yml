- main:
  - heading "Análises das auditorias" [level=1]
  - paragraph: "Compare relays e modelos ao longo do tempo com o que o ekte mediu nesta máquina: pontuações, velocidade, taxas de sucesso e faturação."
  - status: 1 execução mais antiga tem uma hora de início estimada Os gráficos por hora do dia posicionam-nas de forma aproximada.
  - status: "Atualizado: 15 execuções neste período."
  - region "Filtros":
    - button "Filtros" [expanded]
    - text: Período
    - combobox "Período":
      - option "Todo o período"
      - option "Últimas 24 horas"
      - option "Últimos 7 dias"
      - option "Últimos 30 dias" [selected]
      - option "Últimos 90 dias"
      - option "Últimos 365 dias"
      - option "Período personalizado"
    - text: Tipo de endpoint
    - combobox "Tipo de endpoint":
      - option "Todos" [selected]
      - option "Chat (15)"
      - option "Embeddings"
      - option "Reordenação"
    - group "Relay / fornecedor":
      - text: Relay / fornecedor
      - checkbox "Example Relay (9)"
      - text: Example Relay (9)
      - checkbox "gateway.a-very-long-relay-hostname.example.org (5)"
      - text: gateway.a-very-long-relay-hostname.example.org (5)
      - checkbox "127.0.0.1:9099 (1)"
      - text: 127.0.0.1:9099 (1)
    - group "Modelo declarado":
      - text: Modelo declarado
      - checkbox "model-a (11)"
      - text: model-a (11)
      - checkbox "model-b (3)"
      - text: model-b (3)
      - checkbox "gpt-4o (1)"
      - text: gpt-4o (1)
    - text: Suite
    - combobox "Suite":
      - option "Todos" [selected]
      - option "standard (15)"
    - text: Protocolo
    - combobox "Protocolo":
      - option "Todos" [selected]
      - option "openai (14)"
      - option "(desconhecido) (1)"
    - text: Pedidos de sondagem
    - combobox "Pedidos de sondagem":
      - option "Todos" [selected]
      - option "Streaming (14)"
      - option "Sem streaming"
      - option "Streaming + sem streaming"
      - option "(desconhecido) (1)"
    - text: Execução
    - combobox "Execução":
      - option "Todos" [selected]
      - option "Manual (11)"
      - option "Monitor (4)"
    - text: Agrupar por
    - combobox "Agrupar por":
      - option "Relay" [selected]
      - option "Modelo"
      - option "Relay × modelo"
      - option "Todos"
    - text: 15 execuções correspondem a estes filtros.
    - status
    - button "Copiar a ligação para esta vista"
  - tablist "Vistas da análise":
    - tab "Visão geral" [selected]
    - tab "Tendências"
    - tab "Fiabilidade"
    - tab "Integridade do modelo"
    - tab "Faturação"
  - tabpanel "Visão geral":
    - tablist "Visão geral":
      - tab "Números-chave" [selected]
      - tab "Classificação"
    - tabpanel "Números-chave":
      - heading "Números-chave" [level=2]
      - paragraph: 02/09/2026 – 01/10/2026, comparado com o período de igual duração anterior (03/08/2026 – 01/09/2026).
      - list "Números-chave":
        - listitem: Execuções 15 em subida +15
        - listitem: Relays 3 em subida +3
        - listitem: Modelos 3 em subida +3
        - listitem: Pontuação mediana 78 Sem dados no período anterior
        - listitem: Proporção de risco alto 26,7% Sem dados no período anterior
        - listitem:
          - text: Taxa de sucesso
          - 'button "Sobre: Taxa de sucesso"'
          - text: 87% Sem dados no período anterior Dados de 14 de 15 execuções
        - listitem:
          - text: Taxa de erros
          - 'button "Sobre: Taxa de erros"'
          - text: 7,2% Sem dados no período anterior Dados de 14 de 15 execuções
        - listitem: Latência p50 <duration> Sem dados no período anterior Dados de 14 de 15 execuções
        - listitem: Tempo até ao primeiro token p50 <duration> Sem dados no período anterior Dados de 14 de 15 execuções
        - listitem: Velocidade de descodificação p50 62,9 tok/s Sem dados no período anterior Dados de 14 de 15 execuções
        - listitem: Rácio de faturação (entrada) 103,5% Sem dados no período anterior Dados de 10 de 15 execuções
        - listitem: Rácio de faturação (saída) 102% Sem dados no período anterior Dados de 10 de 15 execuções
- contentinfo:
  - paragraph: "Tudo local: as auditorias partem da sua própria máquina e as suas chaves de API nunca saem dela."
  - paragraph: "Uma caixa-preta: o ekte fornece evidências reprodutíveis de desvios, não prova de fraude. Não culpe um fornecedor por uma única execução."
