- main:
  - heading "La base de conocimiento con la que audita ekte" [level=1]
  - paragraph:
    - text: "Cada auditoría compara un relay con el perfil del modelo que declara: ventana de contexto, límite de salida, capacidades, identidad y huellas de comportamiento. Aquí encuentras cada modelo, proveedor y relay que ekte conoce —los incluidos y los tuyos— y puedes activar o desactivar cada uno o añadir los tuyos. Tus cambios se guardan en kb.db en este equipo y los usan tanto la interfaz web como"
    - code: ekte check
    - text: .
  - status: Base de conocimiento completa 244 modelos · 23 proveedores · 1 relay, todos activados
  - region "Filtros":
    - button "Filtros" [expanded]
    - text: ID del modelo
    - combobox "ID del modelo":
      - option "Todos" [selected]
    - text: Proveedor
    - combobox "Proveedor":
      - option "Todos" [selected]
      - option "Ai2 (Allen Institute for AI)"
      - option "Anthropic (Claude)"
      - option "Arcee AI"
      - option "Black Forest Labs"
      - option "Cohere (Toronto, Canada)"
      - option "Deep Cogito"
      - option "DeepSeek (DeepSeek-AI / Hangzhou DeepSeek)"
      - option "Google (Gemini API / Google AI for Developers; also Vertex AI / Gemini Enterprise Agent Platform)"
      - option "Zhipu AI (智谱 / Z.ai) — BigModel open platform"
      - option "IBM — Granite"
      - option "Jina AI (Berlin, Germany; part of Elastic)"
      - option "Liquid AI"
      - option "Meta (Llama open-weight models)"
      - option "Microsoft — Phi"
      - option "Mistral AI (Paris)"
      - option "Moonshot AI (月之暗面 / Kimi)"
      - option "Nous Research"
      - option "NVIDIA (Nemotron open models, NIM)"
      - option "OpenAI"
      - option "Alibaba Cloud — Qwen / 通义千问 (Tongyi Qianwen), served via DashScope / Model Studio (Bailian 百炼)"
      - option "Stability AI"
      - option "Voyage AI (US, San Francisco; part of MongoDB)"
      - option "xAI — Grok"
    - text: Relay
    - combobox "Relay":
      - option "Todos" [selected]
      - option "Example Relay"
    - text: Origen
    - combobox "Origen":
      - option "Todos" [selected]
      - option "Incluido"
      - option "Tuyo"
    - status: Se muestran 244 de 244 modelos · 23 de 23 proveedores · 1 de 1 relays
  - link "Exportar tus entradas como YAML":
    - /url: /api/kb/export
  - tablist "Secciones de la base de conocimiento":
    - tab "Modelos" [selected]
    - tab "Proveedores"
    - tab "Relays"
  - tabpanel "Modelos":
    - heading "Todos los modelos 244 modelos" [level=2]
    - paragraph: "Los perfiles de modelo con los que comparan las auditorías. Un modelo desactivado ya no se resuelve: sus auditorías se ejecutan sin perfil."
    - group:
      - text: Añadir un modelo
      - paragraph: Deja que un asistente de IA investigue el modelo y comprueba aquí su respuesta antes de guardarla.
      - heading "1 Copiar el prompt de investigación" [level=3]
      - text: ID del modelo id
      - textbox "ID del modelo id":
        - /placeholder: p. ej. example-large-2
      - text: Proveedor Opcional
      - textbox "Proveedor Opcional":
        - /placeholder: p. ej. openai / deepseek
      - button "Copiar prompt"
      - status
      - group:
        - text: Mostrar el prompt
        - textbox "Prompt"
      - paragraph: Pégalo en el asistente de IA que prefieras. Responde con un documento YAML.
      - heading "2 Subir o pegar el YAML" [level=3]
      - text: YAML del perfil
      - textbox "YAML del perfil":
        - /placeholder: "provider: …\nmodels:\n- id: …"
      - text: Elegir un archivo .yaml
      - heading "3 Comprobar y guardar" [level=3]
      - paragraph: La comprobación valida el esquema y los límites, marca expresiones regulares inseguras, lista cada prompt que ekte enviaría a los relays y muestra qué ID de modelo se resolverían de otra forma. No se guarda nada hasta que guardes.
      - button "Comprobación"
      - button "Guardar en la base" [disabled]
    - group:
      - text: Ai2 (Allen Institute for AI)
      - code: ai2
      - text: 6 modelos
      - list:
        - listitem:
          - code: allenai/Olmo-3-7B-Instruct
          - text: Incluido Contexto 65536 Salida máx. — Alias
          - code: allenai/olmo-3-7b-instruct
          - text: ","
          - code: Olmo-3-7B-Instruct
          - switch "allenai/Olmo-3-7B-Instruct Activo" [checked]
          - emphasis: Activo
        # … more items of the same shape
    # … more items of the same shape
- contentinfo:
  - paragraph: "Todo local: las auditorías se ejecutan desde tu propio equipo y tus claves de API nunca salen de él."
  - paragraph: "Una caja negra: ekte aporta evidencia reproducible de desviaciones, no una prueba de fraude. No culpes a un proveedor por una sola ejecución."
