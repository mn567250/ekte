      - code: tests/a11y
      - text: hver side i nettgrensesnitt v2 i en ekte nettleser (Chromium, med axe-core og egne kontroller) på hvert grensesnittspråk og i lyst og mørkt tema. Hver test oppgir hvilke testtrinn den avgjør.
    - paragraph: "Siste testkjøring: <report date>. En gjennomgang av tekstene utført av claude-opus-5-5 er registrert som manuell gjennomgang av trinnene den dekker."
    - heading "Tilbakemelding" [level=3]
    - paragraph:
      - text: "Har du funnet en barriere, eller er noe vanskelig å bruke med hjelpemiddelteknologi? Si fra til oss:"
      - link "meld et tilgjengelighetsproblem på GitHub":
