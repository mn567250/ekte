- main:
  - heading "Put a scheduled sentinel on your relay" [level=1]
  - paragraph:
    - text: Every monitor re-runs an audit you already ran, on your machine, at the interval you set. To add one, open a run in
    - link "History":
      - /url: /history
    - text: and choose Schedule as monitor — then set its interval here and switch it on. When the risk crosses your threshold or gets worse than last time, ekte alerts your webhooks (Slack / Feishu / DingTalk / generic JSON).
  - status:
    - text: API keys are not stored Keys you enter stay in the memory of ekte serve only and are never written to disk; enter them again after a restart. env:VAR references keep working.
    - button "Change"
  - group "API key storage":
    - text: API key storage
    - radio "Don't store keys" [checked]
    - text: Don't store keys
    - radio "Store encrypted on this machine"
    - text: Store encrypted on this machine
    - paragraph: API keys stay in the memory of ekte serve and are never written to disk; enter them again after each restart. Use env:VAR for monitors that must run unattended.
  - region "Filters":
    - button "Filters" [expanded]
    - text: Search
    - searchbox "Search"
    - text: Status
    - combobox "Status":
      - option "All" [selected]
      - option "Needs setup"
    - text: Last risk
    - combobox "Last risk":
      - option "All" [selected]
      - option "No result yet"
    - text: Endpoint type
    - combobox "Endpoint type":
      - option "All" [selected]
      - option "Chat"
    - text: Relay / provider
    - combobox "Relay / provider":
      - option "All" [selected]
      - option "127.0.0.1:9099"
    - text: Suite
    - combobox "Suite":
      - option "All" [selected]
      - option "standard"
    - text: Showing 1 of 1 monitors
  - tablist "Monitor views":
    - tab "Configure" [selected]
    - tab "Running"
  - tabpanel "Configure":
    - heading "Configured monitors 1 monitor" [level=2]
    - article "gpt-4o":
      - heading "gpt-4o" [level=3]:
        - button "gpt-4o" [expanded]
      - text: Needs setup
      - switch "Monitor active" [disabled]
      - text: Monitor active
      - emphasis: (Needs setup)
      - text: http://127.0.0.1:9099/v1
      - term: Model to request
      - definition:
        - code: gpt-4o
      - term: Endpoint type
      - definition: Chat
      - term: Test suite
      - definition:
        - code: standard
      - term: Protocol
      - definition:
        - code: openai
        - text: · auto-detected
      - term: Performance probe requests
      - definition: Streaming
      - term: Check interval
      - definition: Not set
      - term: API key
      - definition:
        - text: None
        - button "Replace"
      - term: Alert threshold
      - definition:
        - combobox "Alert threshold — gpt-4o":
          - option "Low and above"
          - option "Medium and above" [selected]
          - option "High only"
      - term: Webhooks
      - definition:
        - text: No webhooks
        - button "Edit"
      - term: Alert language
      - definition:
        - combobox "Alert language — gpt-4o":
          - option "English" [selected]
          - option "中文"
          - option "Français"
          - option "Español"
          - option "Português"
          - option "Italiano"
          - option "Deutsch"
          - option "Norsk"
      - term: Knowledge profile
      - definition:
        - code: openai/gpt-4o
        - text: pinned Oct 1, 2026, 12:00 PM
      - 'link "From run #1 →"':
        - /url: /history?host=127.0.0.1%3A9099&model=gpt-4o&suite=standard#r-1
      - form "Finish setup to switch it on":
        - heading "Finish setup to switch it on" [level=4]
        - paragraph: The configuration comes from the run in History. Set how often it runs, then activate it.
        - text: Check interval
        - combobox "Check interval":
          - option "Choose…" [selected]
          - option "every 5 min"
          - option "every 10 min"
          - option "every 15 min"
          - option "every 20 min"
          - option "every 30 min"
          - option "every 1 h"
          - option "every 2 h"
          - option "every 3 h"
          - option "every 4 h"
          - option "every 6 h"
          - option "every 8 h"
          - option "every 12 h"
          - option "every 24 h"
        - paragraph: One full run took <duration>, so it runs at most every 5 min.
        - text: API key (optional)
        - textbox "API key (optional)":
          - /placeholder: sk-... or env:EKTE_API_KEY
        - button "Show key"
        - paragraph: History never stores the key. Leave it empty for a local or self-hosted model.
        - button "Activate monitor"
      - button "Run now"
      - button "Delete"
    - paragraph: "Everything runs locally. The API key is not stored: it stays in the memory of ekte serve only and is never written to disk, shown in the monitor list or sent to the browser. Enter it again after ekte serve restarts."
- contentinfo:
  - paragraph: "All local: audits run from your own machine, and your API keys never leave it."
  - paragraph: "A black box: ekte reports reproducible evidence of deviation, not proof of fraud. Do not blame a vendor for a single run."
