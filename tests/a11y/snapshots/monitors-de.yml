- banner:
  - link "Zum Hauptinhalt springen":
    - /url: "#main"
  - link "ekte":
    - /url: /
    - text: ekte.
  - link "v<version> Änderungsprotokoll":
    - /url: /changelog
  - group "Anzeigeeinstellungen":
    - combobox "Design":
      - option "Automatisch"
      - option "Hell" [selected]
      - option "Dunkel"
    - combobox "Animation":
      - option "Animation an" [selected]
      - option "Animation aus"
    - combobox "Sprache":
      - option "English"
      - option "中文"
      - option "Français"
      - option "Español"
      - option "Português"
      - option "Italiano"
      - option "Deutsch" [selected]
      - option "Norsk"
  - link "Barrierefreiheit":
    - /url: /accessibility
  - navigation "Hauptnavigation":
    - link "Prüfung":
      - /url: /
    - link "Überwachung":
      - /url: /watches
    - link "Verlauf":
      - /url: /history
    - link "Analyse":
      - /url: /analytics
    - link "Wissen":
      - /url: /kb
- main:
  - heading "Stellen Sie Ihrem Relay einen zeitgesteuerten Wächter zur Seite" [level=1]
  - paragraph:
    - text: Jede Überwachung wiederholt ein bereits ausgeführtes Audit auf Ihrem Rechner im festgelegten Intervall. Zum Hinzufügen öffnen Sie einen Lauf im
    - link "Verlauf":
      - /url: /history
    - text: und wählen Als Überwachung einplanen — legen Sie dann hier das Intervall fest und schalten Sie sie ein. Überschreitet das Risiko Ihre Schwelle oder wird es schlechter als beim letzten Mal, alarmiert ekte Ihre Webhooks (Slack / Feishu / DingTalk / generisches JSON).
  - region "Filter":
    - button "Filter" [expanded]
    - text: Suche
    - searchbox "Suche"
    - text: Endpunkttyp
    - combobox "Endpunkttyp":
      - option "Alle" [selected]
      - option "Chat (1)"
      - option "Embeddings"
      - option "Reranking"
    - text: Relay / Anbieter
    - button "Relay / Anbieter Alle": Alle
    - text: Angegebenes Modell
    - button "Angegebenes Modell Alle": Alle
    - text: Suite
    - combobox "Suite":
      - option "Alle" [selected]
      - option "standard (1)"
    - text: Protokoll
    - combobox "Protokoll":
      - option "Alle" [selected]
      - option "openai (1)"
    - text: Messanfragen
    - combobox "Messanfragen":
      - option "Alle" [selected]
      - option "Streaming (1)"
      - option "Ohne Streaming"
      - option "Streaming + ohne Streaming"
    - text: Status
    - combobox "Status":
      - option "Alle" [selected]
      - option "Aktiv"
      - option "Pausiert"
      - option "Einrichtung nötig (1)"
    - text: Alarmierend
    - combobox "Alarmierend":
      - option "Alle" [selected]
      - option "Auf oder über der Alarmschwelle"
      - option "Unter der Alarmschwelle (1)"
    - text: 1 Überwachung
    - checkbox "Filter über Seiten hinweg behalten" [checked]
    - text: Filter über Seiten hinweg behalten
    - status
    - button "Link zu dieser Ansicht kopieren"
  - status
  - group "Speicherung der API-Schlüssel":
    - text: Speicherung der API-Schlüssel
    - radio "Schlüssel nicht speichern" [checked]
    - text: Schlüssel nicht speichern
    - radio "Verschlüsselt auf diesem Rechner speichern"
    - text: Verschlüsselt auf diesem Rechner speichern
    - paragraph: API-Schlüssel bleiben im Arbeitsspeicher von ekte serve und werden nie auf die Festplatte geschrieben; geben Sie sie nach jedem Neustart erneut ein. Nutzen Sie env:VAR für Überwachungen, die unbeaufsichtigt laufen müssen.
  - tablist "Überwachungsansichten":
    - tab "Konfigurieren" [selected]
    - tab "Läuft"
  - tabpanel "Konfigurieren":
    - heading "Eingerichtete Überwachungen 1 Überwachung" [level=2]
    - article "gpt-4o":
      - heading "gpt-4o" [level=3]:
        - button "gpt-4o" [expanded]
      - text: Einrichtung nötig
      - switch "Überwachung aktiv" [disabled]
      - text: Überwachung aktiv
      - emphasis: (Einrichtung nötig)
      - text: http://127.0.0.1:9099/v1
      - term: Angefragtes Modell
      - definition:
        - code: gpt-4o
      - term: Endpunkttyp
      - definition: Chat
      - term: Testsuite
      - definition:
        - code: standard
      - term: Protokoll
      - definition:
        - code: openai
        - text: · automatisch erkannt
      - term: Anfragen der Leistungsmessung
      - definition: Streaming
      - term: Warnschwelle
      - definition:
        - combobox "Warnschwelle — gpt-4o":
          - option "Niedrig und höher"
          - option "Mittel und höher" [selected]
          - option "Nur hoch"
      - term: Webhooks
      - definition:
        - text: Keine Webhooks
        - button "Webhooks bearbeiten"
      - term: Sprache der Warnungen
      - definition:
        - combobox "Sprache der Warnungen — gpt-4o":
          - option "English" [selected]
          - option "中文"
          - option "Français"
          - option "Español"
          - option "Português"
          - option "Italiano"
          - option "Deutsch"
          - option "Norsk"
      - term: Wissensprofil
      - definition:
        - code: openai/gpt-4o
        - text: festgelegt 01.10.2026, 12:00
      - term: Rohe Anfragen/Antworten
      - definition:
        - combobox "Rohe Anfragen/Antworten — gpt-4o":
          - option "Behalten" [selected]
          - option "Nicht behalten"
      - 'link "Aus Lauf #1: gpt-4o"':
        - /url: /history?surface=chat&relay=http%3A%2F%2F127.0.0.1%3A9099%2Fv1&model=gpt-4o&suite=standard&runs.focus=1
        - text: "Aus Lauf #1"
      - 'link "In Analyse öffnen: gpt-4o"':
        - /url: /analytics?surface=chat&relay=http%3A%2F%2F127.0.0.1%3A9099%2Fv1&model=gpt-4o&suite=standard&api=openai&stream=stream&exec=monitor&watch=1&tab=overview
        - text: In Analyse öffnen
      - form "Einrichtung abschließen, um sie einzuschalten":
        - heading "Einrichtung abschließen, um sie einzuschalten" [level=4]
        - text: Die Konfiguration stammt aus dem Lauf im Verlauf. Legen Sie fest, wie oft und wann sie läuft, und aktivieren Sie sie. Prüfintervall
        - combobox "Prüfintervall":
          - option "Auswählen…" [selected]
          - option "alle 5 Min."
          - option "alle 10 Min."
          - option "alle 15 Min."
          - option "alle 20 Min."
          - option "alle 30 Min."
          - option "alle 1 Std."
          - option "alle 2 Std."
          - option "alle 3 Std."
          - option "alle 4 Std."
          - option "alle 6 Std."
          - option "alle 8 Std."
          - option "alle 12 Std."
          - option "alle 24 Std."
        - paragraph: Ein vollständiger Lauf dauerte <duration>, daher läuft sie alle 5 Min. höchstens einmal.
        - text: API-Schlüssel (optional)
        - textbox "API-Schlüssel (optional)":
          - /placeholder: sk-... oder env:EKTE_API_KEY
        - button "Schlüssel anzeigen"
        - paragraph: Der Verlauf speichert den Schlüssel nie. Für lokale oder selbst gehostete Modelle leer lassen.
        - group "Laufzeitfenster":
          - text: Laufzeitfenster
          - group "Voreinstellungen":
            - button "Immer" [pressed]
            - button "Werktage"
            - button "Werktage 07–19"
            - button "Benutzerdefiniert"
          - paragraph: Der Monitor läuft zu jeder Tageszeit in seinem Prüfintervall.
        - button "Überwachung aktivieren"
      - button "Löschen"
      - button "Jetzt ausführen"
- contentinfo:
  - paragraph: "Alles lokal: Audits laufen von Ihrem eigenen Rechner aus, und Ihre API-Schlüssel verlassen ihn nie."
  - paragraph: "Eine Blackbox: ekte liefert reproduzierbare Belege für Abweichungen, keinen Betrugsnachweis. Machen Sie einem Anbieter nicht wegen eines einzelnen Laufs Vorwürfe."
