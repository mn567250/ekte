- banner:
  - link "Zum Hauptinhalt springen":
    - /url: "#main"
  - link "ekte":
    - /url: /v2/
    - text: ekte.
  - combobox "Design":
    - option "Automatisch"
    - option "Hell" [selected]
    - option "Dunkel"
  - combobox "Animation":
    - option "Animation an" [selected]
    - option "Animation aus"
  - combobox "Sprache":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch" [selected]
  - link "Barrierefreiheit":
    - /url: /v2/accessibility
  - navigation "Hauptnavigation":
    - link "Prüfung":
      - /url: /v2/
    - link "Überwachung":
      - /url: /v2/watches
    - link "Verlauf":
      - /url: /v2/history
    - link "Analyse":
      - /url: /v2/analytics
    - link "Wissen":
      - /url: /v2/kb
- main:
  - heading "Stellen Sie Ihrem Relay einen zeitgesteuerten Wächter zur Seite" [level=1]
  - paragraph:
    - text: Jede Überwachung wiederholt ein bereits ausgeführtes Audit auf Ihrem Rechner im festgelegten Intervall. Zum Hinzufügen öffnen Sie einen Lauf im
    - link "Verlauf":
      - /url: /v2/history
    - text: und wählen Als Überwachung einplanen — legen Sie dann hier das Intervall fest und schalten Sie sie ein. Überschreitet das Risiko Ihre Schwelle oder wird es schlechter als beim letzten Mal, alarmiert ekte Ihre Webhooks (Slack / Feishu / DingTalk / generisches JSON).
  - status:
    - text: API-Schlüssel werden nicht gespeichert Eingegebene Schlüssel bleiben nur im Arbeitsspeicher von ekte serve und werden nie auf die Festplatte geschrieben; geben Sie sie nach einem Neustart erneut ein. env:VAR-Verweise funktionieren weiterhin.
    - button "Ändern"
  - group "Speicherung der API-Schlüssel":
    - text: Speicherung der API-Schlüssel
    - radio "Schlüssel nicht speichern" [checked]
    - text: Schlüssel nicht speichern
    - radio "Verschlüsselt auf diesem Rechner speichern"
    - text: Verschlüsselt auf diesem Rechner speichern
    - paragraph: API-Schlüssel bleiben im Arbeitsspeicher von ekte serve und werden nie auf die Festplatte geschrieben; geben Sie sie nach jedem Neustart erneut ein. Nutzen Sie env:VAR für Überwachungen, die unbeaufsichtigt laufen müssen.
  - region "Filter":
    - button "Filter" [expanded]
    - text: Suche
    - searchbox "Suche"
    - text: Status
    - combobox "Status":
      - option "Alle" [selected]
      - option "Einrichtung nötig"
    - text: Letztes Risiko
    - combobox "Letztes Risiko":
      - option "Alle" [selected]
      - option "Noch kein Ergebnis"
    - text: Endpunkttyp
    - combobox "Endpunkttyp":
      - option "Alle" [selected]
      - option "Chat"
    - text: Relay / Anbieter
    - combobox "Relay / Anbieter":
      - option "Alle" [selected]
      - option "127.0.0.1:9099"
    - text: Suite
    - combobox "Suite":
      - option "Alle" [selected]
      - option "standard"
    - text: 1 von 1 Überwachungen angezeigt
  - tablist "Überwachungsansichten":
    - tab "Konfigurieren" [selected]
    - tab "Läuft"
  - tabpanel "Konfigurieren":
    - heading "Eingerichtete Überwachungen 1 Überwachung" [level=2]
    - article "gpt-4o":
      - heading "gpt-4o" [level=3]:
        - button "gpt-4o" [expanded]
      - text: Einrichtung nötig
      - switch "Überwachung aktiv" [disabled]
      - text: Überwachung aktiv
      - emphasis: (Einrichtung nötig)
      - text: http://127.0.0.1:9099/v1
      - term: Angefragtes Modell
      - definition:
        - code: gpt-4o
      - term: Endpunkttyp
      - definition: Chat
      - term: Testsuite
      - definition:
        - code: standard
      - term: Protokoll
      - definition:
        - code: openai
        - text: · automatisch erkannt
      - term: Anfragen der Leistungsmessung
      - definition: Streaming
      - term: Prüfintervall
      - definition: Nicht festgelegt
      - term: API-Schlüssel
      - definition:
        - text: Keiner
        - button "Ersetzen"
      - term: Warnschwelle
      - definition:
        - combobox "Warnschwelle — gpt-4o":
          - option "Niedrig und höher"
          - option "Mittel und höher" [selected]
          - option "Nur hoch"
      - term: Webhooks
      - definition:
        - text: Keine Webhooks
        - button "Bearbeiten"
      - term: Sprache der Warnungen
      - definition:
        - combobox "Sprache der Warnungen — gpt-4o":
          - option "English" [selected]
          - option "中文"
          - option "Français"
          - option "Español"
          - option "Português"
          - option "Italiano"
          - option "Deutsch"
      - term: Wissensprofil
      - definition:
        - code: openai/gpt-4o
        - text: festgelegt 01.10.2026, 12:00
      - 'link "Aus Lauf #1 →"':
        - /url: /v2/history?host=127.0.0.1%3A9099&model=gpt-4o&suite=standard#r-1
      - form "Einrichtung abschließen, um sie einzuschalten":
        - heading "Einrichtung abschließen, um sie einzuschalten" [level=4]
        - paragraph: Die Konfiguration stammt aus dem Lauf im Verlauf. Legen Sie fest, wie oft sie läuft, und aktivieren Sie sie.
        - text: Prüfintervall
        - combobox "Prüfintervall":
          - option "Auswählen…" [selected]
          - option "alle 5 Min."
          - option "alle 10 Min."
          - option "alle 15 Min."
          - option "alle 20 Min."
          - option "alle 30 Min."
          - option "alle 1 Std."
          - option "alle 2 Std."
          - option "alle 3 Std."
          - option "alle 4 Std."
          - option "alle 6 Std."
          - option "alle 8 Std."
          - option "alle 12 Std."
          - option "alle 24 Std."
        - paragraph: Ein vollständiger Lauf dauerte <duration>, daher läuft sie höchstens alle 5 Min..
        - text: API-Schlüssel (optional)
        - textbox "API-Schlüssel (optional)":
          - /placeholder: sk-... oder env:EKTE_API_KEY
        - button "Schlüssel anzeigen"
        - paragraph: Der Verlauf speichert den Schlüssel nie. Für lokale oder selbst gehostete Modelle leer lassen.
        - button "Überwachung aktivieren"
      - button "Jetzt ausführen"
      - button "Löschen"
    - paragraph: "Alles läuft lokal. Der API-Schlüssel wird nicht gespeichert: Er bleibt nur im Arbeitsspeicher von ekte serve und wird nie auf die Festplatte geschrieben, in der Überwachungsliste angezeigt oder an den Browser gesendet. Geben Sie ihn nach einem Neustart von ekte serve erneut ein."
- contentinfo:
  - paragraph: "Alles lokal: Audits laufen von Ihrem eigenen Rechner aus, und Ihre API-Schlüssel verlassen ihn nie."
  - paragraph: "Eine Blackbox: ekte liefert reproduzierbare Belege für Abweichungen, keinen Betrugsnachweis. Machen Sie einem Anbieter nicht wegen eines einzelnen Laufs Vorwürfe."
