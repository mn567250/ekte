- main:
  - heading "Questo intermediario serve il modello vero?" [level=1]
  - paragraph: Scegli il relay, il modello da verificare e, se viene venduto con un altro nome, il modello che dichiara di essere. ekte esegue sul tuo computer una suite completa di test black-box e produce un report di verifica leggibile e basato su prove.
  - status:
    - text: Ultimo audit completato gateway.a-very-long-relay-hostname.example.org · model-b · punteggio 72/100 · 27 set 2026, 10:02
    - button "Apri report"
  - tablist "Audit":
    - tab "Nuovo audit" [selected]
    - tab "In corso"
  - tabpanel "Nuovo audit":
    - list "Avanzamento dell'audit":
      - listitem: Configura
      - listitem: Scansione
      - listitem: Report
    - region "Configura":
      - heading "Configura" [level=2]
      - group "Tipo di endpoint surface":
        - text: Tipo di endpoint surface
        - radio "Chat" [checked]
        - text: Chat
        - radio "Embedding"
        - text: Embedding
        - radio "Riordinamento"
        - text: Riordinamento
      - text: Relay / provider Facoltativo
      - combobox "Relay / provider Facoltativo":
        - option "Seleziona un relay o un provider…" [selected]
        - option "Altro (inserisci l'URL)"
      - text: Selezionandone uno ne viene compilato l'URL; per qualsiasi altro relay scegli «Altro» e inserisci l'URL. URL dell'intermediario base_url
      - combobox "URL dell'intermediario base_url"
      - text: Chiave API Supporta env:VAR / file:/percorso
      - textbox "Chiave API":
        - /placeholder: sk-... o env:EKTE_API_KEY
      - button "Mostra chiave"
      - text: Modello richiesto model
      - textbox "Modello richiesto model":
        - /placeholder: deepseek-chat
      - button "Aggiorna modelli" [disabled]
      - status: Seleziona un relay o inseriscine l'URL e ekte ne elenca i modelli.
      - text: Modello dichiarato claimed_model Facoltativo
      - combobox "Modello dichiarato claimed_model Facoltativo":
        - option "Uguale al modello richiesto" [selected]
      - button "Inserisci a mano"
      - text: Solo se l'intermediario lo vende con un altro nome — ekte confronta le risposte con questo modello. Protocollo
      - group "Protocollo":
        - button "Auto" [pressed]
        - button "OpenAI"
        - button "Anthropic"
        - button "Responses"
      - text: Suite di test
      - group "Suite di test":
        - button "smoke"
        - button "standard" [pressed]
        - button "deep"
        - button "full"
        - button "personalizzato"
      - text: Richieste della sonda delle prestazioni
      - group "Richieste della sonda delle prestazioni":
        - button "Streaming" [pressed]
        - button "Senza streaming"
      - text: Con standard la sonda viene eseguita solo con un riferimento; altrimenti si usano le richieste dell'audit stesso.
      - button "Confronta con un riferimento affidabile compare" [expanded]
      - paragraph: Inserisci un endpoint dello stesso modello di cui ti fidi (ad es. l'API ufficiale). ekte lo usa per confermare il comportamento dell'obiettivo, rendendo più affidabili i verdetti di sostituzione/declassamento — la valutazione della qualità e il rilevamento di manomissioni raggiungono il livello massimo solo con un riferimento.
      - text: Relay / provider di riferimento Facoltativo
      - combobox "Relay / provider di riferimento Facoltativo":
        - option "Seleziona un relay o un provider…" [selected]
        - option "Altro (inserisci l'URL)"
      - text: Selezionandone uno ne viene compilato l'URL; per qualsiasi altro relay scegli «Altro» e inserisci l'URL. URL di riferimento base_url
      - combobox "URL di riferimento base_url"
      - text: Chiave API di riferimento
      - textbox "Chiave API di riferimento":
        - /placeholder: sk-... o env:OPENAI_API_KEY
      - button "Mostra chiave"
      - text: Modello di riferimento model
      - textbox "Modello di riferimento model":
        - /placeholder: id ufficiale dello stesso modello
      - button "Aggiorna modelli" [disabled]
      - status: Seleziona un relay o inseriscine l'URL e ekte ne elenca i modelli.
      - text: Protocollo di riferimento
      - group "Protocollo di riferimento":
        - button "Auto" [pressed]
        - button "OpenAI"
        - button "Anthropic"
        - button "Responses"
      - button "Avvia verifica"
      - text: I test partono dal tuo server ekte locale; la chiave serve solo a collegarsi all'intermediario di destinazione e non viene mai inviata a terzi.
      - alert
      - status
- contentinfo:
  - paragraph: "Tutto in locale: gli audit partono dalla tua macchina e le tue chiavi API non la lasciano mai."
  - paragraph: "Una scatola nera: ekte fornisce prove riproducibili di scostamenti, non una prova di frode. Non incolpare un fornitore per una singola esecuzione."
