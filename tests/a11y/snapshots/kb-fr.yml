- main:
  - heading "La base de connaissances utilisée par ekte" [level=1]
  - paragraph:
    - text: "Chaque audit compare un relais au profil du modèle qu'il annonce : fenêtre de contexte, limite de sortie, capacités, identité et empreintes comportementales. Vous trouvez ici chaque modèle, fournisseur et relais que ekte connaît — ceux fournis et les vôtres — et pouvez activer ou désactiver chacun d'eux ou ajouter les vôtres. Vos modifications sont enregistrées dans kb.db sur cette machine et utilisées par l'interface web comme par"
    - code: ekte check
    - text: .
  - status: Base de connaissances complète 130 modèles · 7 fournisseurs · 1 relais, tous activés
  - region "Filtres":
    - button "Filtres" [expanded]
    - text: Identifiant du modèle
    - combobox "Identifiant du modèle":
      - option "Tous" [selected]
    - text: Fournisseur
    - combobox "Fournisseur":
      - option "Tous" [selected]
      - option "Anthropic (Claude)"
      - option "DeepSeek (DeepSeek-AI / Hangzhou DeepSeek)"
      - option "Google (Gemini API / Google AI for Developers; also Vertex AI / Gemini Enterprise Agent Platform)"
      - option "Zhipu AI (智谱 / Z.ai) — BigModel open platform"
      - option "Moonshot AI (月之暗面 / Kimi)"
      - option "OpenAI"
      - option "Alibaba Cloud — Qwen / 通义千问 (Tongyi Qianwen), served via DashScope / Model Studio (Bailian 百炼)"
    - text: Relais
    - combobox "Relais":
      - option "Tous" [selected]
      - option "Example Relay"
    - text: Source
    - combobox "Source":
      - option "Tous" [selected]
      - option "Fourni"
      - option "Les vôtres"
    - status: Affichage de 130 modèles sur 130 · 7 fournisseurs sur 7 · 1 relais sur 1
  - link "Exporter vos entrées en YAML":
    - /url: /api/kb/export
  - tablist "Sections de la base de connaissances":
    - tab "Modèles" [selected]
    - tab "Fournisseurs"
    - tab "Relais"
  - tabpanel "Modèles":
    - heading "Tous les modèles 130 modèles" [level=2]
    - paragraph: "Les profils de modèle auxquels les audits se comparent. Un modèle désactivé n'est plus résolu : ses audits s'exécutent sans profil."
    - group:
      - text: Ajouter un modèle
      - paragraph: Laissez un assistant IA se renseigner sur le modèle, puis vérifiez sa réponse ici avant qu’elle soit enregistrée.
      - heading "1 Copier le prompt de recherche" [level=3]
      - text: Identifiant du modèle id
      - textbox "Identifiant du modèle id":
        - /placeholder: p. ex. example-large-2
      - text: Fournisseur Facultatif
      - textbox "Fournisseur Facultatif":
        - /placeholder: p. ex. openai / deepseek
      - button "Copier le prompt"
      - status
      - group:
        - text: Afficher le prompt
        - textbox "Prompt"
      - paragraph: Collez-le dans l’assistant IA de votre choix. Il répond avec un document YAML.
      - heading "2 Importer ou coller le YAML" [level=3]
      - text: YAML du profil
      - textbox "YAML du profil":
        - /placeholder: "provider: …\nmodels:\n- id: …"
      - text: Choisir un fichier .yaml
      - heading "3 Vérifier et enregistrer" [level=3]
      - paragraph: La vérification valide le schéma et les limites, signale les expressions régulières dangereuses, liste chaque prompt que ekte enverrait aux relais et montre quels identifiants de modèle seraient résolus différemment. Rien n’est enregistré avant que vous n’enregistriez.
      - button "Contrôle"
      - button "Enregistrer dans la base" [disabled]
    - group:
      - text: Anthropic (Claude)
      - code: anthropic
      - text: 23 modèles
      - list:
        - listitem:
          - code: claude-fable-5-1
          - text: Fourni Contexte 1000000 Sortie max. 128000 Alias
          - code: claude-fable-5-1
          - text: ","
          - code: fable
          - text: ","
          - code: fable 5.1
          - text: ","
          - code: claude fable 5.1
          - text: ","
          - code: most powerful
          - switch "claude-fable-5-1 Activée" [checked]
          - emphasis: Activée
        # … more items of the same shape
    # … more items of the same shape
- contentinfo:
  - paragraph: "Tout en local : les audits partent de votre propre machine et vos clés d'API ne la quittent jamais."
  - paragraph: "Une boîte noire : ekte fournit des preuves reproductibles d'écarts, pas une preuve de fraude. N'accusez pas un fournisseur sur la base d'une seule exécution."
