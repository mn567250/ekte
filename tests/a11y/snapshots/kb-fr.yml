    - text: ekte.
  - combobox "Thème":
    - option "Automatique"
    - option "Clair" [selected]
    - option "Sombre"
  - combobox "Animation":
    - option "Animation activée" [selected]
    - option "Animation désactivée"
  - combobox "Langue":
