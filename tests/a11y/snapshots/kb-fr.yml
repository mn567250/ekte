- banner:
  - link "Aller au contenu principal":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - link "Interface classique":
    - /url: "?ui=v1"
  - combobox "Thème":
    - option "Automatique"
    - option "Clair" [selected]
    - option "Sombre"
  - combobox "Animation des graphiques":
    - option "Animation activée" [selected]
    - option "Animation désactivée"
  - combobox "Langue":
    - option "English"
    - option "中文"
    - option "Français" [selected]
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - link "Accessibilité":
    - /url: /v2/accessibility
  - navigation "Navigation principale":
    - link "Audit":
      - /url: /v2/
    - link "Outils":
      - /url: /v2/tools
    - link "Historique":
      - /url: /v2/history
    - link "Analyses":
      - /url: /v2/analytics
    - link "Surveillances":
      - /url: /v2/watches
    - link "Connaissances":
      - /url: /v2/kb
  - paragraph: Exécution locale · les clés ne sortent jamais
- main:
  - heading "La base de connaissances utilisée par zing" [level=1]
  - paragraph:
    - text: "Chaque audit compare un relais au profil du modèle qu'il annonce : fenêtre de contexte, limite de sortie, capacités, identité et empreintes comportementales. Vous trouvez ici chaque modèle, fournisseur et relais que zing connaît — ceux fournis et les vôtres — et pouvez activer ou désactiver chacun d'eux ou ajouter les vôtres. Vos modifications sont enregistrées dans kb.db sur cette machine et utilisées par l'interface web comme par"
    - code: zing check
    - text: .
  - region "Quel profil un identifiant de modèle utilise-t-il ?":
    - heading "Quel profil un identifiant de modèle utilise-t-il ?" [level=2]
    - text: Identifiant du modèle
    - textbox "Identifiant du modèle":
      - /placeholder: p. ex. gpt-4o
    - button "Rechercher"
    - link "Exporter vos entrées en YAML":
      - /url: /api/kb/export
    - status
  - tablist "Sections de la base de connaissances":
    - tab "Modèles" [selected]
    - tab "Fournisseurs"
    - tab "Relais"
  - tabpanel "Modèles":
    - heading "Tous les modèles 98 modèles" [level=2]
    - paragraph: "Les profils de modèle auxquels les audits se comparent. Un modèle désactivé n'est plus résolu : ses audits s'exécutent sans profil."
    - group:
      - text: Ajouter un modèle
      - paragraph: Laissez un assistant IA se renseigner sur le modèle, puis vérifiez sa réponse ici avant qu’elle soit enregistrée.
      - heading "1 Copier le prompt de recherche" [level=3]
      - text: Identifiant du modèle id
      - textbox "Identifiant du modèle id":
        - /placeholder: p. ex. example-large-2
      - text: Fournisseur Facultatif
      - textbox "Fournisseur Facultatif":
        - /placeholder: p. ex. openai / deepseek
      - button "Copier le prompt"
      - status
      - group:
        - text: Afficher le prompt
        - textbox "Prompt"
      - paragraph: Collez-le dans l’assistant IA de votre choix. Il répond avec un document YAML.
      - heading "2 Importer ou coller le YAML" [level=3]
      - text: YAML du profil
      - textbox "YAML du profil":
        - /placeholder: "provider: …\nmodels:\n- id: …"
      - text: Choisir un fichier .yaml
      - heading "3 Vérifier et enregistrer" [level=3]
      - paragraph: La vérification valide le schéma et les limites, signale les expressions régulières dangereuses, liste chaque prompt que zing enverrait aux relais et montre quels identifiants de modèle seraient résolus différemment. Rien n’est enregistré avant que vous n’enregistriez.
      - button "Contrôle"
      - button "Enregistrer dans la base" [disabled]
    - text: Filtrer les modèles
    - searchbox "Filtrer les modèles"
    - status
    - group:
      - text: Anthropic (Claude)
      - code: anthropic
      - text: 14 modèles
      - list:
        - listitem:
          - code: claude-opus-4-8
          - text: Fourni Contexte 1000000 Sortie max. 128000 Alias
          - code: claude-opus-4-8
          - text: ","
          - code: opus
          - text: ","
          - code: opus 4.8
          - text: ","
          - code: most powerful
          - switch "claude-opus-4-8 Activée" [checked]
          - emphasis: Activée
        # … more items of the same shape
    # … more items of the same shape
- contentinfo:
  - paragraph:
    - text: zing · vérification des relais · les profils fournis se trouvent dans
    - code: zing/knowledge/data
    - text: ;
    - code: ZING_KB_DIR
    - text: et vos entrées s’y superposent
