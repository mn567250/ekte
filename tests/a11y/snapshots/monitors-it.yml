- banner:
  - link "Vai al contenuto principale":
    - /url: "#main"
  - link "ekte":
    - /url: /v2/
    - text: ekte.
  - combobox "Tema":
    - option "Automatico"
    - option "Chiaro" [selected]
    - option "Scuro"
  - combobox "Animazione":
    - option "Animazione attiva" [selected]
    - option "Animazione disattivata"
  - combobox "Lingua":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano" [selected]
    - option "Deutsch"
  - link "Accessibilità":
    - /url: /v2/accessibility
  - navigation "Navigazione principale":
    - link "Verifica":
      - /url: /v2/
    - link "Monitor":
      - /url: /v2/watches
    - link "Cronologia":
      - /url: /v2/history
    - link "Analisi":
      - /url: /v2/analytics
    - link "Conoscenza":
      - /url: /v2/kb
- main:
  - heading "Metti una sentinella programmata sul tuo intermediario" [level=1]
  - paragraph:
    - text: Ogni monitor riesegue sulla tua macchina un audit che hai già eseguito, all’intervallo che imposti. Per aggiungerne uno, apri un’esecuzione nella
    - link "Cronologia":
      - /url: /v2/history
    - text: e scegli Pianifica come monitor, poi imposta qui l’intervallo e attivalo. Quando il rischio supera la soglia o peggiora rispetto all’ultima volta, ekte avvisa i tuoi webhook (Slack / Feishu / DingTalk / JSON generico).
  - status:
    - text: Le chiavi API non vengono salvate Le chiavi inserite restano solo nella memoria di ekte serve e non vengono mai scritte su disco; reinseriscile dopo un riavvio. I riferimenti env:VAR continuano a funzionare.
    - button "Modifica"
  - group "Archiviazione delle chiavi API":
    - text: Archiviazione delle chiavi API
    - radio "Non salvare le chiavi" [checked]
    - text: Non salvare le chiavi
    - radio "Salva cifrate su questo computer"
    - text: Salva cifrate su questo computer
    - paragraph: Le chiavi API restano nella memoria di ekte serve e non vengono mai scritte su disco; reinseriscile dopo ogni riavvio. Usa env:VAR per i monitor che devono funzionare senza supervisione.
  - region "Filtri":
    - button "Filtri" [expanded]
    - text: Cerca
    - searchbox "Cerca"
    - text: Stato
    - combobox "Stato":
      - option "Tutti" [selected]
      - option "Da configurare"
    - text: Ultimo rischio
    - combobox "Ultimo rischio":
      - option "Tutti" [selected]
      - option "Ancora nessun risultato"
    - text: Tipo di endpoint
    - combobox "Tipo di endpoint":
      - option "Tutti" [selected]
      - option "Chat"
    - text: Relay / provider
    - combobox "Relay / provider":
      - option "Tutti" [selected]
      - option "127.0.0.1:9099"
    - text: Suite
    - combobox "Suite":
      - option "Tutti" [selected]
      - option "standard"
    - text: 1 di 1 monitor mostrati
  - tablist "Viste dei monitor":
    - tab "Configura" [selected]
    - tab "In corso"
  - tabpanel "Configura":
    - heading "Monitor configurati 1 monitor" [level=2]
    - article "gpt-4o":
      - heading "gpt-4o" [level=3]:
        - button "gpt-4o" [expanded]
      - text: Da configurare
      - switch "Monitor attivo" [disabled]
      - text: Monitor attivo
      - emphasis: (Da configurare)
      - text: http://127.0.0.1:9099/v1
      - term: Modello richiesto
      - definition:
        - code: gpt-4o
      - term: Tipo di endpoint
      - definition: Chat
      - term: Suite di test
      - definition:
        - code: standard
      - term: Protocollo
      - definition:
        - code: openai
        - text: · rilevato automaticamente
      - term: Richieste della sonda delle prestazioni
      - definition: Streaming
      - term: Intervallo di controllo
      - definition: Non impostato
      - term: Chiave API
      - definition:
        - text: Nessuna
        - button "Sostituisci"
      - term: Soglia di avviso
      - definition:
        - combobox "Soglia di avviso — gpt-4o":
          - option "Basso e superiore"
          - option "Medio e superiore" [selected]
          - option "Solo alto"
      - term: Webhook
      - definition:
        - text: Nessun webhook
        - button "Modifica"
      - term: Lingua degli avvisi
      - definition:
        - combobox "Lingua degli avvisi — gpt-4o":
          - option "English" [selected]
          - option "中文"
          - option "Français"
          - option "Español"
          - option "Português"
          - option "Italiano"
          - option "Deutsch"
      - term: Profilo di conoscenza
      - definition:
        - code: openai/gpt-4o
        - text: fissato 1 ott 2026, 12:00
      - 'link "Dall’esecuzione #1 →"':
        - /url: /v2/history?host=127.0.0.1%3A9099&model=gpt-4o&suite=standard#r-1
      - form "Completa la configurazione per attivarlo":
        - heading "Completa la configurazione per attivarlo" [level=4]
        - paragraph: La configurazione proviene dall’esecuzione nella Cronologia. Imposta ogni quanto viene eseguito, poi attivalo.
        - text: Intervallo di controllo
        - combobox "Intervallo di controllo":
          - option "Scegli…" [selected]
          - option "ogni 5 min"
          - option "ogni 10 min"
          - option "ogni 15 min"
          - option "ogni 20 min"
          - option "ogni 30 min"
          - option "ogni 1 h"
          - option "ogni 2 h"
          - option "ogni 3 h"
          - option "ogni 4 h"
          - option "ogni 6 h"
          - option "ogni 8 h"
          - option "ogni 12 h"
          - option "ogni 24 h"
        - paragraph: Un’esecuzione completa ha richiesto <duration>, quindi viene eseguito al massimo ogni 5 min.
        - text: Chiave API (facoltativo)
        - textbox "Chiave API (facoltativo)":
          - /placeholder: sk-... o env:EKTE_API_KEY
        - button "Mostra chiave"
        - paragraph: La cronologia non salva mai la chiave. Lasciala vuota per un modello locale o self-hosted.
        - button "Attiva monitor"
      - button "Esegui ora"
      - button "Elimina"
    - paragraph: "Tutto viene eseguito in locale. La chiave API non viene salvata: resta solo nella memoria di ekte serve e non viene mai scritta su disco, mostrata nell'elenco dei monitor o inviata al browser. Reinseriscila dopo il riavvio di ekte serve."
- contentinfo:
  - paragraph: "Tutto in locale: gli audit partono dalla tua macchina e le tue chiavi API non la lasciano mai."
  - paragraph: "Una scatola nera: ekte fornisce prove riproducibili di scostamenti, non una prova di frode. Non incolpare un fornitore per una singola esecuzione."
