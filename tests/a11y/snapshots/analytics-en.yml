  - region "Peak hours":
    - heading "Peak hours" [level=2]
    - paragraph: Does this relay get slower or fail more at peak hours? Each cell is one hour of one weekday in your time zone, coloured by the median of the runs that started then (scale below the grid).
    - text: Metric
    - combobox "Metric":
