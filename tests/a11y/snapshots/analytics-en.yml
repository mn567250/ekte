  - region "Billing and tokens":
    - heading "Billing and tokens" [level=2]
    - paragraph: "Billing ratio = tokens the relay reports ÷ tokens zing counted. Above 100%: the relay reports more tokens than zing counted (you may be billed for more). zing's counts are estimates, so small deviations are normal."
