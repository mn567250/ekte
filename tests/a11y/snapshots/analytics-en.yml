- main:
  - heading "Audit analytics" [level=1]
  - paragraph: "Compare relays and models over time with what ekte measured on this machine: scores, speed, success rates and billing."
  - status: 1 older run has an estimated start time Time-of-day charts place them approximately.
  - status: "Updated: 15 runs in this range."
  - region "Filters":
    - button "Filters" [expanded]
    - text: Period
    - combobox "Period":
      - option "All time"
      - option "Last 24 hours"
      - option "Last 7 days"
      - option "Last 30 days" [selected]
      - option "Last 90 days"
      - option "Last 365 days"
      - option "Custom range"
    - text: Endpoint type
    - combobox "Endpoint type":
      - option "All" [selected]
      - option "Chat (15)"
      - option "Embeddings"
      - option "Reranking"
    - group "Relay / provider":
      - text: Relay / provider
      - checkbox "Example Relay (9)"
      - text: Example Relay (9)
      - checkbox "gateway.a-very-long-relay-hostname.example.org (5)"
      - text: gateway.a-very-long-relay-hostname.example.org (5)
      - checkbox "127.0.0.1:9099 (1)"
      - text: 127.0.0.1:9099 (1)
    - group "Claimed model":
      - text: Claimed model
      - checkbox "model-a (11)"
      - text: model-a (11)
      - checkbox "model-b (3)"
      - text: model-b (3)
      - checkbox "gpt-4o (1)"
      - text: gpt-4o (1)
    - text: Suite
    - combobox "Suite":
      - option "All" [selected]
      - option "standard (15)"
    - text: Protocol
    - combobox "Protocol":
      - option "All" [selected]
      - option "openai (14)"
      - option "(unknown) (1)"
    - text: Probe requests
    - combobox "Probe requests":
      - option "All" [selected]
      - option "Streaming (14)"
      - option "Non-streaming"
      - option "Streaming + non-streaming"
      - option "(unknown) (1)"
    - text: Execution
    - combobox "Execution":
      - option "All" [selected]
      - option "Manual (11)"
      - option "Monitor (4)"
    - text: Group by
    - combobox "Group by":
      - option "Relay" [selected]
      - option "Model"
      - option "Relay × model"
      - option "All"
    - text: 15 runs match these filters.
    - checkbox "Keep filters across pages" [checked]
    - text: Keep filters across pages
    - status
    - button "Copy link to this view"
  - tablist "Analytics views":
    - tab "Overview" [selected]
    - tab "Trends"
    - tab "Reliability"
    - tab "Model integrity"
    - tab "Billing"
  - tabpanel "Overview":
    - tablist "Overview":
      - tab "Key figures" [selected]
      - tab "Leaderboard"
    - tabpanel "Key figures":
      - heading "Key figures" [level=2]
      - paragraph: Sep 1 – Oct 1, 2026, compared with the period of the same length before (Aug 2 – Sep 1, 2026).
      - list "Key figures":
        - listitem: Runs 15 rising +15
        - listitem: Relays 3 rising +3
        - listitem: Models 3 rising +3
        - listitem: Median score 78 No data in the previous period
        - listitem: High-risk share 26.7% No data in the previous period
        - listitem:
          - text: Success rate
          - 'button "About: Success rate"'
          - text: 87% No data in the previous period Data from 14 of 15 runs
        - listitem:
          - text: Error rate
          - 'button "About: Error rate"'
          - text: 7.2% No data in the previous period Data from 14 of 15 runs
        - listitem: Latency p50 <duration> No data in the previous period Data from 14 of 15 runs
        - listitem: Time to first token p50 <duration> No data in the previous period Data from 14 of 15 runs
        - listitem: Decode speed p50 62.9 tok/s No data in the previous period Data from 14 of 15 runs
        - listitem: Billing ratio (prompt) 103.5% No data in the previous period Data from 10 of 15 runs
        - listitem: Billing ratio (completion) 102% No data in the previous period Data from 10 of 15 runs
- contentinfo:
  - paragraph: "All local: audits run from your own machine, and your API keys never leave it."
  - paragraph: "A black box: ekte reports reproducible evidence of deviation, not proof of fraud. Do not blame a vendor for a single run."
