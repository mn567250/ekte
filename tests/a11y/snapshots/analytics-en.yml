    - text: zing.
  - link "Classic UI":
    - /url: "?ui=v1"
  - combobox "Theme":
    - option "Auto theme"
    - option "Light" [selected]
    - option "Dark"
  - combobox "Language":
    - option "English" [selected]
    - option "中文"
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
