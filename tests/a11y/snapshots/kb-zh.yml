- main:
  - heading "ekte 用来比对的知识库" [level=1]
  - paragraph:
    - text: 每次检测都会把中转站与其声称模型的资料比对：上下文窗口、输出上限、能力、身份与行为指纹。这里列出 ekte 已知的全部模型、厂商与中转站——内置的和你的——你可以逐项启用或停用，也可以添加自己的条目。你的更改保存在本机的 kb.db 中，网页界面和
    - code: ekte check
    - text: 都会使用。
  - status: 知识库完整 244 个模型 · 23 个厂商 · 1 个中转站，全部已启用
  - region "筛选":
    - button "筛选" [expanded]
    - text: 模型 ID
    - combobox "模型 ID":
      - option "全部" [selected]
    - text: 厂商
    - combobox "厂商":
      - option "全部" [selected]
      - option "Ai2 (Allen Institute for AI)"
      - option "Anthropic (Claude)"
      - option "Arcee AI"
      - option "Black Forest Labs"
      - option "Cohere (Toronto, Canada)"
      - option "Deep Cogito"
      - option "DeepSeek (DeepSeek-AI / Hangzhou DeepSeek)"
      - option "Google (Gemini API / Google AI for Developers; also Vertex AI / Gemini Enterprise Agent Platform)"
      - option "Zhipu AI (智谱 / Z.ai) — BigModel open platform"
      - option "IBM — Granite"
      - option "Jina AI (Berlin, Germany; part of Elastic)"
      - option "Liquid AI"
      - option "Meta (Llama open-weight models)"
      - option "Microsoft — Phi"
      - option "Mistral AI (Paris)"
      - option "Moonshot AI (月之暗面 / Kimi)"
      - option "Nous Research"
      - option "NVIDIA (Nemotron open models, NIM)"
      - option "OpenAI"
      - option "Alibaba Cloud — Qwen / 通义千问 (Tongyi Qianwen), served via DashScope / Model Studio (Bailian 百炼)"
      - option "Stability AI"
      - option "Voyage AI (US, San Francisco; part of MongoDB)"
      - option "xAI — Grok"
    - text: 中转站
    - combobox "中转站":
      - option "全部" [selected]
      - option "Example Relay"
    - text: 来源
    - combobox "来源":
      - option "全部" [selected]
      - option "内置"
      - option "你的"
    - status: 显示 244/244 个模型 · 23/23 个厂商 · 1/1 个中转站
  - link "将你的条目导出为 YAML":
    - /url: /api/kb/export
  - tablist "知识库分类":
    - tab "模型" [selected]
    - tab "厂商"
    - tab "中转站"
  - tabpanel "模型":
    - heading "全部模型 244 个模型" [level=2]
    - paragraph: 检测时用来比对的模型资料。停用的模型不再参与匹配：检测它时将没有资料可比对。
    - group:
      - text: 添加模型
      - paragraph: 让 AI 助手调研该模型，然后在这里检查它的回答，再保存。
      - heading "1 复制调研提示词" [level=3]
      - text: 模型 ID id
      - textbox "模型 ID id":
        - /placeholder: 例如 example-large-2
      - text: 厂商 可选
      - textbox "厂商 可选":
        - /placeholder: 例如 openai / deepseek
      - button "复制提示词"
      - status
      - group:
        - text: 查看提示词
        - textbox "提示词"
      - paragraph: 把它粘贴到你选择的 AI 助手中，它会返回一份 YAML 文档。
      - heading "2 上传或粘贴 YAML" [level=3]
      - text: 资料 YAML
      - textbox "资料 YAML":
        - /placeholder: "provider: …\nmodels:\n- id: …"
      - text: 选择 .yaml 文件
      - heading "3 检查并保存" [level=3]
      - paragraph: 检查会校验结构与上限、标记不安全的正则表达式、列出 ekte 将发送给中转站的所有提示词，并显示哪些模型 ID 的匹配结果会改变。保存之前不会写入任何内容。
      - button "检查"
      - button "保存到知识库" [disabled]
    - group:
      - text: Ai2 (Allen Institute for AI)
      - code: ai2
      - text: 6 个模型
      - list:
        - listitem:
          - code: allenai/Olmo-3-7B-Instruct
          - text: 内置 上下文 65536 最大输出 — 别名
          - code: allenai/olmo-3-7b-instruct
          - text: ","
          - code: Olmo-3-7B-Instruct
          - switch "allenai/Olmo-3-7B-Instruct 启用中" [checked]
          - emphasis: 启用中
        # … more items of the same shape
    # … more items of the same shape
- contentinfo:
  - paragraph: 全部在本地：检测从你自己的机器发起，API 密钥不会离开本机。
  - paragraph: 黑盒：ekte 给出的是可复现的偏离证据，不是欺诈证明。请勿仅凭单次结果指责厂商。
