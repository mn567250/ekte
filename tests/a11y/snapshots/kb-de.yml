- main:
  - heading "Die Wissensbasis, gegen die ekte prüft" [level=1]
  - paragraph:
    - text: "Jede Prüfung vergleicht ein Relay mit dem Profil des Modells, das es angibt: Kontextfenster, Ausgabelimit, Fähigkeiten, Identität und Verhaltens-Fingerabdrücke. Hier findest du jedes Modell, jeden Anbieter und jedes Relay, das ekte kennt — mitgelieferte und eigene — und kannst jedes davon ein- oder ausschalten oder eigene hinzufügen. Deine Änderungen werden in kb.db auf diesem Rechner gespeichert und von der Web-Oberfläche wie von"
    - code: ekte check
    - text: verwendet.
  - status: Wissensbasis vollständig 130 Modelle · 7 Anbieter · 1 Relay, alle eingeschaltet
  - region "Filter":
    - button "Filter" [expanded]
    - text: Modell-ID
    - combobox "Modell-ID":
      - option "Alle" [selected]
    - text: Anbieter
    - combobox "Anbieter":
      - option "Alle" [selected]
      - option "Anthropic (Claude)"
      - option "DeepSeek (DeepSeek-AI / Hangzhou DeepSeek)"
      - option "Google (Gemini API / Google AI for Developers; also Vertex AI / Gemini Enterprise Agent Platform)"
      - option "Zhipu AI (智谱 / Z.ai) — BigModel open platform"
      - option "Moonshot AI (月之暗面 / Kimi)"
      - option "OpenAI"
      - option "Alibaba Cloud — Qwen / 通义千问 (Tongyi Qianwen), served via DashScope / Model Studio (Bailian 百炼)"
    - text: Relay
    - combobox "Relay":
      - option "Alle" [selected]
      - option "Example Relay"
    - text: Quelle
    - combobox "Quelle":
      - option "Alle" [selected]
      - option "Mitgeliefert"
      - option "Eigener"
    - status: "Angezeigt: 130 von 130 Modellen · 7 von 7 Anbietern · 1 von 1 Relays"
  - link "Deine Einträge als YAML exportieren":
    - /url: /api/kb/export
  - tablist "Bereiche der Wissensbasis":
    - tab "Modelle" [selected]
    - tab "Anbieter"
    - tab "Relays"
  - tabpanel "Modelle":
    - heading "Alle Modelle 130 Modelle" [level=2]
    - paragraph: "Die Modellprofile, mit denen Prüfungen vergleichen. Ein ausgeschaltetes Modell wird nicht mehr zugeordnet: Prüfungen dafür laufen ohne Profil."
    - group:
      - text: Modell hinzufügen
      - paragraph: Lass einen KI-Assistenten das Modell recherchieren und prüfe seine Antwort hier, bevor sie gespeichert wird.
      - heading "1 Recherche-Prompt kopieren" [level=3]
      - text: Modell-ID id
      - textbox "Modell-ID id":
        - /placeholder: z. B. example-large-2
      - text: Anbieter Optional
      - textbox "Anbieter Optional":
        - /placeholder: z. B. openai / deepseek
      - button "Prompt kopieren"
      - status
      - group:
        - text: Prompt anzeigen
        - textbox "Prompt"
      - paragraph: Füge ihn in einen KI-Assistenten deiner Wahl ein. Er antwortet mit einem YAML-Dokument.
      - heading "2 YAML hochladen oder einfügen" [level=3]
      - text: Profil-YAML
      - textbox "Profil-YAML":
        - /placeholder: "provider: …\nmodels:\n- id: …"
      - text: .yaml-Datei wählen
      - heading "3 Prüfen und speichern" [level=3]
      - paragraph: Die Prüfung validiert Schema und Grenzwerte, markiert unsichere reguläre Ausdrücke, listet jeden Prompt auf, den ekte an Relays senden würde, und zeigt, welche Modell-IDs anders aufgelöst würden. Gespeichert wird erst, wenn du speicherst.
      - button "Prüfung"
      - button "In der Wissensbasis speichern" [disabled]
    - group:
      - text: Anthropic (Claude)
      - code: anthropic
      - text: 23 Modelle
      - list:
        - listitem:
          - code: claude-fable-5-1
          - text: Mitgeliefert Kontext 1000000 Max. Ausgabe 128000 Aliasse
          - code: claude-fable-5-1
          - text: ","
          - code: fable
          - text: ","
          - code: fable 5.1
          - text: ","
          - code: claude fable 5.1
          - text: ","
          - code: most powerful
          - switch "claude-fable-5-1 Aktiv" [checked]
          - emphasis: Aktiv
        # … more items of the same shape
    # … more items of the same shape
- contentinfo:
  - paragraph: "Alles lokal: Audits laufen von Ihrem eigenen Rechner aus, und Ihre API-Schlüssel verlassen ihn nie."
  - paragraph: "Eine Blackbox: ekte liefert reproduzierbare Belege für Abweichungen, keinen Betrugsnachweis. Machen Sie einem Anbieter nicht wegen eines einzelnen Laufs Vorwürfe."
