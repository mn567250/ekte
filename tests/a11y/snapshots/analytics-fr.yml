- banner:
  - link "Aller au contenu principal":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - link "Interface classique":
    - /url: "?ui=v1"
  - combobox "Thème":
    - option "Automatique"
    - option "Clair" [selected]
    - option "Sombre"
  - combobox "Langue":
    - option "English"
    - option "中文"
    - option "Français" [selected]
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - link "Accessibilité":
    - /url: /v2/accessibility
  - navigation "Navigation principale":
    - link "Audit":
      - /url: /v2/
    - link "Outils":
      - /url: /v2/tools
    - link "Historique":
      - /url: /v2/history
    - link "Analyses":
      - /url: /v2/analytics
    - link "Surveillances":
      - /url: /v2/watches
    - link "Connaissances":
      - /url: /v2/kb
- main:
  - heading "Analyses des audits" [level=1]
  - paragraph: "Comparez relais et modèles dans le temps avec ce que zing a mesuré sur cette machine : scores, vitesse, taux de réussite et facturation."
  - paragraph:
    - text: Calculé à partir de l'historique local dans
    - code: ~/.zing
    - text: — rien n'est envoyé.
  - status: "Mis à jour : 14 exécutions sur cette période."
  - region "Filtres":
    - heading "Filtres" [level=2]
    - text: Période
    - group "Période":
      - button "7 derniers jours"
      - button "30 derniers jours" [pressed]
      - button "90 derniers jours"
      - button "Toute la période"
      - button "Période personnalisée"
    - text: Suite
    - combobox "Suite":
      - option "Tous"
      - option "standard" [selected]
    - text: Requêtes de sonde
    - combobox "Requêtes de sonde":
      - option "Tous"
      - option "Streaming" [selected]
    - text: Protocole
    - combobox "Protocole":
      - option "Tous" [selected]
      - option "openai"
    - text: Source
    - combobox "Source":
      - option "Tous" [selected]
      - option "Manuel"
      - option "Surveillance"
    - text: Relais / fournisseur
    - combobox "Relais / fournisseur":
      - option "Tous" [selected]
      - option "Example Relay"
      - option "https://gateway.a-very-long-relay-hostname.example.org/openai/compatible/v1"
      - option "http://127.0.0.1:9099/v1"
    - text: Modèle annoncé
    - combobox "Modèle annoncé":
      - option "Tous" [selected]
      - option "model-a"
      - option "model-b"
      - option "gpt-4o"
    - text: 15 exécutions dans l'historique (4 par des surveillances).
  - region "Vue d'ensemble":
    - heading "Vue d'ensemble" [level=2]
    - paragraph: 2 sept. – 1 oct. 2026, comparé à la période de même durée qui précède (3 août – 1 sept. 2026).
    - list:
      - listitem: Exécutions 14 +14
      - listitem: Relais 2 +2
      - listitem: Modèles 2 +2
      - listitem: Score médian 79 Pas de données sur la période précédente
      - listitem: Part à risque élevé 21,4 % Pas de données sur la période précédente
      - listitem: Taux de réussite 100 % Pas de données sur la période précédente
      - listitem: Délai du premier jeton p50 <duration> Pas de données sur la période précédente
      - listitem: Vitesse de décodage 62,9 tok/s Pas de données sur la période précédente
      - listitem: Ratio de facturation (entrée) 103 % Pas de données sur la période précédente Données de 9 exécutions sur 14
      - listitem: Ratio de facturation (sortie) 102 % Pas de données sur la période précédente Données de 9 exécutions sur 14
  - region "Comparaison dans le temps":
    - heading "Comparaison dans le temps" [level=2]
    - paragraph: La ligne est la médiane de chaque intervalle, la bande la moitié centrale des exécutions (25e au 75e centile). Les intervalles vides laissent un trou.
    - text: Mesure
    - combobox "Mesure":
      - option "Score" [selected]
      - option "Part à risque élevé"
      - option "Taux de réussite"
      - option "Taux d'erreur"
      - option "Taux d'expiration"
      - option "Part limitée en débit"
      - option "Latence p50"
      - option "Latence p95"
      - option "Délai du premier jeton p50"
      - option "Délai du premier jeton p95"
      - option "Vitesse de décodage"
      - option "Gigue entre jetons"
      - option "Temps de traitement du relais"
      - option "Aller-retour réseau"
      - option "Démarrage à froid"
      - option "Débit sous charge"
      - option "Ratio de facturation (entrée)"
      - option "Ratio de facturation (sortie)"
      - option "Part de jetons de raisonnement"
      - option "Part d'entrée en cache"
      - option "Part de modèle non conforme"
      - option "Contexte déclaré"
      - option "Contexte effectif"
      - option "Constats de gravité élevée"
      - option "Constats de gravité moyenne"
      - option "Constats de faible gravité"
      - option "Durée de l'audit"
      - 'option "Dimension : Facturation et consommation"'
      - 'option "Dimension : Capacités annoncées"'
      - 'option "Dimension : Connectivité"'
      - 'option "Dimension : Fenêtre de contexte"'
      - 'option "Dimension : Identité du modèle"'
      - 'option "Dimension : Conformité du protocole"'
      - 'option "Dimension : Fiabilité en concurrence"'
      - 'option "Dimension : Sécurité du transport"'
      - 'option "Dimension : Authenticité du streaming"'
    - text: Grouper par
    - combobox "Grouper par":
      - option "Relais" [selected]
      - option "Modèle"
      - option "Relais × modèle"
    - text: Intervalles
    - combobox "Intervalles":
      - option "Par heure"
      - option "Par jour" [selected]
      - option "Par semaine"
    - text: Séries à comparer (jusqu'à 4)
    - group "Séries à comparer (jusqu'à 4)":
      - button "✓ Example Relay" [pressed]
      - button "✓ https://gateway.a-very-long-relay-hostname.example.org/openai/compatible/v1" [pressed]
      - button "http://127.0.0.1:9099/v1"
    - list "Légende":
      - listitem: Example Relay 9 exécutions
      - listitem: https://gateway.a-very-long-relay-hostname.example.org/openai/compatible/v1 5 exécutions
    - img "Score dans le temps": 0 20 40 60 80100 25 sept. 27 sept. 29 sept. 1 oct. v·KB
    - paragraph:
      - text: Moins de 3 exécutions dans cet intervalle — affiché atténué, car un audit isolé peut être une valeur aberrante.
      - link "Programmez une surveillance pour des mesures régulières.":
        - /url: /v2/watches
    - text: "Les lignes pointillées du graphique marquent les changements dans la notation des exécutions (v = version de zing, KB = profil de la base de connaissances) :"
    - list:
      - listitem: "mar. 29 sept. 2026 · Example Relay, https://gateway.a-very-long-relay-hostname.example.org/openai/compatible/v1: Profil de la base de connaissances modifié (la référence a changé, pas le relais)"
      - listitem: "mar. 29 sept. 2026 · Example Relay, https://gateway.a-very-long-relay-hostname.example.org/openai/compatible/v1: version de zing <version> → 0.20.0"
    - button "Afficher en tableau" [expanded]
    - region "Score (Relais, Par jour)":
      - table "Score (Relais, Par jour)":
        - caption: Score (Relais, Par jour)
        - rowgroup:
          - row "Intervalle Série Médiane p25–p75 Exécutions Remarque":
            - columnheader "Intervalle"
            - columnheader "Série"
            - columnheader "Médiane"
            - columnheader "p25–p75"
            - columnheader "Exécutions"
            - columnheader "Remarque"
        - rowgroup:
          - row "sam. 26 sept. 2026 Example Relay 70 70 – 70 1 Moins de 3 exécutions dans cet intervalle — affiché atténué, car un audit isolé peut être une valeur aberrante.":
            - cell "sam. 26 sept. 2026"
            - cell "Example Relay"
            - cell "70"
            - cell "70 – 70"
            - cell "1"
            - cell "Moins de 3 exécutions dans cet intervalle — affiché atténué, car un audit isolé peut être une valeur aberrante."
          # … more rows of the same shape
  - region "Classement":
    - heading "Classement" [level=2]
    - paragraph: Médianes sur la période choisie ; n est le nombre d'exécutions qui ont mesuré une valeur.
    - group "Classer":
      - button "Relais pour un modèle" [pressed]
      - button "Modèles d'un relais"
    - text: Modèle
    - combobox "Modèle":
      - option "model-a" [selected]
      - option "model-b"
      - option "gpt-4o"
    - region "Relais pour « model-a »":
      - table "Relais pour « model-a »":
        - caption: Relais pour « model-a »
        - rowgroup:
          - row "Relais Exécutions Score Délai du premier jeton p50 Vitesse de décodage Taux de réussite Ratio de facturation (entrée) Ratio de facturation (sortie) Part de modèle non conforme Part à risque élevé Dernière exécution":
            - columnheader "Relais":
              - button "Relais"
            - columnheader "Exécutions":
              - button "Exécutions"
            - columnheader "Score":
              - button "Score"
            - columnheader "Délai du premier jeton p50":
              - button "Délai du premier jeton p50"
            - columnheader "Vitesse de décodage":
              - button "Vitesse de décodage"
            - columnheader "Taux de réussite":
              - button "Taux de réussite"
            - columnheader "Ratio de facturation (entrée)":
              - button "Ratio de facturation (entrée)"
            - columnheader "Ratio de facturation (sortie)":
              - button "Ratio de facturation (sortie)"
            - columnheader "Part de modèle non conforme":
              - button "Part de modèle non conforme"
            - columnheader "Part à risque élevé":
              - button "Part à risque élevé"
            - columnheader "Dernière exécution":
              - button "Dernière exécution"
        - rowgroup:
          - row "Example Relay 7 82 n=7 <duration> n=7 63,2 tok/s n=7100 % n=7104 % n=7102 % n=7 — n=0 / 7 0 % n=7 30 sept. 2026, 11:00":
            - rowheader "Example Relay"
            - cell "7"
            - cell "82 n=7"
            - cell "<duration> n=7"
            - cell "63,2 tok/s n=7"
            - cell "100 % n=7"
            - cell "104 % n=7"
            - cell "102 % n=7"
            - cell "— n=0 / 7"
            - cell "0 % n=7"
            - cell "30 sept. 2026, 11:00"
          # … more rows of the same shape
    - status
