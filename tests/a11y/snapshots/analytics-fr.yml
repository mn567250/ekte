- main:
  - heading "Analyses des audits" [level=1]
  - paragraph: "Comparez relais et modèles dans le temps avec ce que ekte a mesuré sur cette machine : scores, vitesse, taux de réussite et facturation."
  - status: 1 exécution plus ancienne a une heure de début estimée Les graphiques par heure de la journée les placent approximativement.
  - status: "Mis à jour : 15 exécutions sur cette période."
  - region "Filtres":
    - button "Filtres" [expanded]
    - text: Période
    - combobox "Période":
      - option "Toute la période"
      - option "Dernières 24 heures"
      - option "7 derniers jours"
      - option "30 derniers jours" [selected]
      - option "90 derniers jours"
      - option "365 derniers jours"
      - option "Période personnalisée"
    - text: Type de point d'accès
    - combobox "Type de point d'accès":
      - option "Tous" [selected]
      - option "Chat (15)"
      - option "Embeddings"
      - option "Reclassement"
    - group "Relais / fournisseur":
      - text: Relais / fournisseur
      - checkbox "Example Relay (9)"
      - text: Example Relay (9)
      - checkbox "gateway.a-very-long-relay-hostname.example.org (5)"
      - text: gateway.a-very-long-relay-hostname.example.org (5)
      - checkbox "127.0.0.1:9099 (1)"
      - text: 127.0.0.1:9099 (1)
    - group "Modèle annoncé":
      - text: Modèle annoncé
      - checkbox "model-a (11)"
      - text: model-a (11)
      - checkbox "model-b (3)"
      - text: model-b (3)
      - checkbox "gpt-4o (1)"
      - text: gpt-4o (1)
    - text: Suite
    - combobox "Suite":
      - option "Tous" [selected]
      - option "standard (15)"
    - text: Protocole
    - combobox "Protocole":
      - option "Tous" [selected]
      - option "openai (14)"
      - option "(inconnu) (1)"
    - text: Requêtes de sonde
    - combobox "Requêtes de sonde":
      - option "Tous" [selected]
      - option "Streaming (14)"
      - option "Sans streaming"
      - option "Streaming + sans streaming"
      - option "(inconnu) (1)"
    - text: Exécution
    - combobox "Exécution":
      - option "Tous" [selected]
      - option "Manuel (11)"
      - option "Surveillance (4)"
    - text: Grouper par
    - combobox "Grouper par":
      - option "Relais" [selected]
      - option "Modèle"
      - option "Relais × modèle"
      - option "Tous"
    - text: 15 exécutions correspondent à ces filtres.
    - checkbox "Conserver les filtres d’une page à l’autre" [checked]
    - text: Conserver les filtres d’une page à l’autre
    - status
    - button "Copier le lien vers cette vue"
  - tablist "Vues de l’analyse":
    - tab "Vue d'ensemble" [selected]
    - tab "Tendances"
    - tab "Fiabilité"
    - tab "Intégrité du modèle"
    - tab "Facturation"
  - tabpanel "Vue d'ensemble":
    - tablist "Vue d'ensemble":
      - tab "Chiffres clés" [selected]
      - tab "Classement"
    - tabpanel "Chiffres clés":
      - heading "Chiffres clés" [level=2]
      - paragraph: 1 sept. – 1 oct. 2026, comparé à la période de même durée qui précède (2 août – 1 sept. 2026).
      - list "Chiffres clés":
        - listitem: Exécutions 15 en hausse +15
        - listitem: Relais 3 en hausse +3
        - listitem: Modèles 3 en hausse +3
        - listitem: Score médian 78 Pas de données sur la période précédente
        - listitem: Part à risque élevé 26,7 % Pas de données sur la période précédente
        - listitem:
          - text: Taux de réussite
          - 'button "À propos : Taux de réussite"'
          - text: 87 % Pas de données sur la période précédente Données de 14 exécutions sur 15
        - listitem:
          - text: Taux d'erreur
          - 'button "À propos : Taux d''erreur"'
          - text: 7,2 % Pas de données sur la période précédente Données de 14 exécutions sur 15
        - listitem: Latence p50 1 <duration> Pas de données sur la période précédente Données de 14 exécutions sur 15
        - listitem: Délai du premier jeton p50 <duration> Pas de données sur la période précédente Données de 14 exécutions sur 15
        - listitem: Vitesse de décodage p50 62,9 tok/s Pas de données sur la période précédente Données de 14 exécutions sur 15
        - listitem: Ratio de facturation (entrée) 103,5 % Pas de données sur la période précédente Données de 10 exécutions sur 15
        - listitem: Ratio de facturation (sortie) 102 % Pas de données sur la période précédente Données de 10 exécutions sur 15
- contentinfo:
  - paragraph: "Tout en local : les audits partent de votre propre machine et vos clés d'API ne la quittent jamais."
  - paragraph: "Une boîte noire : ekte fournit des preuves reproductibles d'écarts, pas une preuve de fraude. N'accusez pas un fournisseur sur la base d'une seule exécution."
