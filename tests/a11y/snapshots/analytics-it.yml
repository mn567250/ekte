- banner:
  - link "Vai al contenuto principale":
    - /url: "#main"
  - link "zing":
    - /url: /v2/
    - text: zing.
  - link "Interfaccia classica":
    - /url: "?ui=v1"
  - combobox "Tema":
    - option "Automatico"
    - option "Chiaro" [selected]
    - option "Scuro"
  - combobox "Lingua":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano" [selected]
    - option "Deutsch"
  - link "Accessibilità":
    - /url: /v2/accessibility
  - navigation "Navigazione principale":
    - link "Verifica":
      - /url: /v2/
    - link "Strumenti":
      - /url: /v2/tools
    - link "Cronologia":
      - /url: /v2/history
    - link "Analisi":
      - /url: /v2/analytics
    - link "Monitor":
      - /url: /v2/watches
    - link "Conoscenza":
      - /url: /v2/kb
- main:
  - heading "Analisi degli audit" [level=1]
  - paragraph: "Confronta relay e modelli nel tempo con ciò che zing ha misurato su questa macchina: punteggi, velocità, tassi di successo e fatturazione."
  - paragraph:
    - text: Calcolato dalla cronologia locale in
    - code: ~/.zing
    - text: — nulla viene caricato.
  - status: "Aggiornato: 14 esecuzioni in questo periodo."
  - region "Filtri":
    - button "Filtri" [expanded]
    - text: Periodo
    - group "Periodo":
      - button "Ultimi 7 giorni"
      - button "Ultimi 30 giorni" [pressed]
      - button "Ultimi 90 giorni"
      - button "Tutto il periodo"
      - button "Periodo personalizzato"
    - text: Suite
    - combobox "Suite":
      - option "Tutti"
      - option "standard" [selected]
    - text: Richieste di sonda
    - combobox "Richieste di sonda":
      - option "Tutti"
      - option "Streaming" [selected]
    - text: Protocollo
    - combobox "Protocollo":
      - option "Tutti" [selected]
      - option "openai"
    - text: Origine
    - combobox "Origine":
      - option "Tutti" [selected]
      - option "Manuale"
      - option "Monitor"
    - text: Relay / provider
    - combobox "Relay / provider":
      - option "Tutti" [selected]
      - option "Example Relay"
      - option "https://gateway.a-very-long-relay-hostname.example.org/openai/compatible/v1"
      - option "http://127.0.0.1:9099/v1"
    - text: Modello dichiarato
    - combobox "Modello dichiarato":
      - option "Tutti" [selected]
      - option "model-a"
      - option "model-b"
      - option "gpt-4o"
    - text: 15 esecuzioni nella cronologia (4 dai monitor).
  - button "Copia il link a questa vista"
  - tablist "Viste dell’analisi":
    - tab "Panoramica" [selected]
    - tab "Andamenti"
    - tab "Affidabilità"
    - tab "Integrità del modello"
    - tab "Fatturazione"
  - tabpanel "Panoramica":
    - region "Panoramica":
      - heading "Panoramica" [level=2]
      - paragraph: 02 set – 01 ott 2026, confrontato con il periodo di pari durata precedente (03 ago – 01 set 2026).
      - list:
        - listitem: Esecuzioni 14 +14
        - listitem: Relay 2 +2
        - listitem: Modelli 2 +2
        - listitem: Punteggio mediano 79 Nessun dato nel periodo precedente
        - listitem: Quota ad alto rischio 21,4% Nessun dato nel periodo precedente
        - listitem: Tasso di successo 100% Nessun dato nel periodo precedente
        - listitem: Tempo al primo token p50 <duration> Nessun dato nel periodo precedente
        - listitem: Velocità di decodifica 62,9 tok/s Nessun dato nel periodo precedente
        - listitem: Rapporto di fatturazione (input) 103% Nessun dato nel periodo precedente Dati da 9 esecuzioni su 14
        - listitem: Rapporto di fatturazione (output) 102% Nessun dato nel periodo precedente Dati da 9 esecuzioni su 14
    - region "Classifica":
      - heading "Classifica" [level=2]
      - paragraph: Mediane sul periodo scelto; n è il numero di esecuzioni che hanno misurato un valore.
      - group "Classifica per":
        - button "Relay per un modello" [pressed]
        - button "Modelli di un relay"
      - text: Modello
      - combobox "Modello":
        - option "model-a" [selected]
        - option "model-b"
        - option "gpt-4o"
      - region "Relay per «model-a»":
        - table "Relay per «model-a»":
          - caption: Relay per «model-a»
          - rowgroup:
            - row "Relay Esecuzioni Punteggio Tempo al primo token p50 Velocità di decodifica Tasso di successo Rapporto di fatturazione (input) Rapporto di fatturazione (output) Quota di modello non corrispondente Quota ad alto rischio Ultima esecuzione":
              - columnheader "Relay":
                - button "Relay"
              - columnheader "Esecuzioni":
                - button "Esecuzioni"
              - columnheader "Punteggio":
                - button "Punteggio"
              - columnheader "Tempo al primo token p50":
                - button "Tempo al primo token p50"
              - columnheader "Velocità di decodifica":
                - button "Velocità di decodifica"
              - columnheader "Tasso di successo":
                - button "Tasso di successo"
              - columnheader "Rapporto di fatturazione (input)":
                - button "Rapporto di fatturazione (input)"
              - columnheader "Rapporto di fatturazione (output)":
                - button "Rapporto di fatturazione (output)"
              - columnheader "Quota di modello non corrispondente":
                - button "Quota di modello non corrispondente"
              - columnheader "Quota ad alto rischio":
                - button "Quota ad alto rischio"
              - columnheader "Ultima esecuzione":
                - button "Ultima esecuzione"
          - rowgroup:
            - row "Example Relay 7 82 n=7 <duration> n=7 63,2 tok/s n=7100% n=7104% n=7102% n=7 0% n=7 0% n=7 30 set 2026, 11:00":
              - rowheader "Example Relay"
              - cell "7"
              - cell "82 n=7"
              - cell "<duration> n=7"
              - cell "63,2 tok/s n=7"
              - cell "100% n=7"
              - cell "104% n=7"
              - cell "102% n=7"
              - cell "0% n=7"
              - cell "0% n=7"
              - cell "30 set 2026, 11:00"
            # … more rows of the same shape
      - status
