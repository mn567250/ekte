    - paragraph:
      - text: Meno di 3 esecuzioni in questo intervallo — mostrato attenuato perché un singolo audit può essere un valore anomalo.
      - link "Pianifica un monitor per misurazioni regolari.":
        - /url: /v2/watches
    - text: "Le linee tratteggiate nel grafico segnano i cambiamenti nella valutazione delle esecuzioni (v = versione di zing, KB = profilo della knowledge base):"
    - list:
      - listitem: "mar 29 set 2026 · Example Relay, https://gateway.a-very-long-relay-hostname.example.org/openai/compatible/v1: Profilo della knowledge base modificato (è cambiato il riferimento, non il relay)"
