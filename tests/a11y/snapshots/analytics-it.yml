- main:
  - heading "Analisi degli audit" [level=1]
  - paragraph: "Confronta relay e modelli nel tempo con ciò che zing ha misurato su questa macchina: punteggi, velocità, tassi di successo e fatturazione."
  - paragraph:
    - text: Calcolato dalla cronologia locale in
    - code: ~/.zing
    - text: — nulla viene caricato.
  - status: "Aggiornato: 14 esecuzioni in questo periodo."
  - region "Filtri":
    - heading "Filtri" [level=2]
    - text: Periodo
    - group "Periodo":
      - button "Ultimi 7 giorni"
      - button "Ultimi 30 giorni" [pressed]
      - button "Ultimi 90 giorni"
      - button "Tutto il periodo"
      - button "Periodo personalizzato"
    - text: Suite
    - combobox "Suite":
      - option "Tutti"
      - option "standard" [selected]
    - text: Richieste di sonda
    - combobox "Richieste di sonda":
      - option "Tutti"
      - option "Streaming" [selected]
    - text: Protocollo
    - combobox "Protocollo":
      - option "Tutti" [selected]
      - option "openai"
    - text: Origine
    - combobox "Origine":
      - option "Tutti" [selected]
      - option "Manuale"
      - option "Monitor"
    - text: Relay / provider
    - combobox "Relay / provider":
      - option "Tutti" [selected]
      - option "Example Relay"
      - option "https://gateway.a-very-long-relay-hostname.example.org/openai/compatible/v1"
      - option "http://127.0.0.1:9099/v1"
    - text: Modello dichiarato
    - combobox "Modello dichiarato":
      - option "Tutti" [selected]
      - option "model-a"
      - option "model-b"
      - option "gpt-4o"
    - text: 15 esecuzioni nella cronologia (4 dai monitor).
  - region "Panoramica":
    - heading "Panoramica" [level=2]
    - paragraph: 02 set – 01 ott 2026, confrontato con il periodo di pari durata precedente (03 ago – 01 set 2026).
    - list:
      - listitem: Esecuzioni 14 +14
      - listitem: Relay 2 +2
      - listitem: Modelli 2 +2
      - listitem: Punteggio mediano 79 Nessun dato nel periodo precedente
      - listitem: Quota ad alto rischio 21,4% Nessun dato nel periodo precedente
      - listitem: Tasso di successo 100% Nessun dato nel periodo precedente
      - listitem: Tempo al primo token p50 <duration> Nessun dato nel periodo precedente
      - listitem: Velocità di decodifica 62,9 tok/s Nessun dato nel periodo precedente
      - listitem: Rapporto di fatturazione (input) 103% Nessun dato nel periodo precedente Dati da 9 esecuzioni su 14
      - listitem: Rapporto di fatturazione (output) 102% Nessun dato nel periodo precedente Dati da 9 esecuzioni su 14
  - region "Confronto nel tempo":
