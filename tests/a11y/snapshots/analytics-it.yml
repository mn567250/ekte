    - text: zing.
  - link "Interfaccia classica":
    - /url: "?ui=v1"
  - combobox "Tema":
    - option "Automatico"
    - option "Chiaro" [selected]
    - option "Scuro"
  - combobox "Lingua":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano" [selected]
    - option "Deutsch"
  - link "Accessibilità":
    - /url: /v2/accessibility
