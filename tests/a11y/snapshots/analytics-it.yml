- main:
  - heading "Analisi degli audit" [level=1]
  - paragraph: "Confronta relay e modelli nel tempo con ciò che ekte ha misurato su questa macchina: punteggi, velocità, tassi di successo e fatturazione."
  - status: 1 esecuzione precedente ha un orario di inizio stimato I grafici per ora del giorno li collocano in modo approssimativo.
  - status: "Aggiornato: 15 esecuzioni in questo periodo."
  - region "Filtri":
    - button "Filtri" [expanded]
    - text: Periodo
    - combobox "Periodo":
      - option "Tutto il periodo"
      - option "Ultime 24 ore"
      - option "Ultimi 7 giorni"
      - option "Ultimi 30 giorni" [selected]
      - option "Ultimi 90 giorni"
      - option "Ultimi 365 giorni"
      - option "Periodo personalizzato"
    - text: Tipo di endpoint
    - combobox "Tipo di endpoint":
      - option "Tutti" [selected]
      - option "Chat (15)"
      - option "Embedding"
      - option "Riordinamento"
    - group "Relay / provider":
      - text: Relay / provider
      - checkbox "Example Relay (9)"
      - text: Example Relay (9)
      - checkbox "gateway.a-very-long-relay-hostname.example.org (5)"
      - text: gateway.a-very-long-relay-hostname.example.org (5)
      - checkbox "127.0.0.1:9099 (1)"
      - text: 127.0.0.1:9099 (1)
    - group "Modello dichiarato":
      - text: Modello dichiarato
      - checkbox "model-a (11)"
      - text: model-a (11)
      - checkbox "model-b (3)"
      - text: model-b (3)
      - checkbox "gpt-4o (1)"
      - text: gpt-4o (1)
    - text: Suite
    - combobox "Suite":
      - option "Tutti" [selected]
      - option "standard (15)"
    - text: Protocollo
    - combobox "Protocollo":
      - option "Tutti" [selected]
      - option "openai (14)"
      - option "(sconosciuto) (1)"
    - text: Richieste di sonda
    - combobox "Richieste di sonda":
      - option "Tutti" [selected]
      - option "Streaming (14)"
      - option "Senza streaming"
      - option "Streaming + senza streaming"
      - option "(sconosciuto) (1)"
    - text: Esecuzione
    - combobox "Esecuzione":
      - option "Tutti" [selected]
      - option "Manuale (11)"
      - option "Monitor (4)"
    - text: Monitor
    - combobox "Monitor":
      - option "Tutti" [selected]
      - option "gpt-4o (4)"
    - text: Raggruppa per
    - combobox "Raggruppa per":
      - option "Relay" [selected]
      - option "Modello"
      - option "Relay × modello"
      - option "Tutti"
    - text: 15 esecuzioni corrispondono a questi filtri.
    - checkbox "Mantieni i filtri tra le pagine" [checked]
    - text: Mantieni i filtri tra le pagine
    - status
    - button "Copia il link a questa vista"
  - tablist "Viste dell’analisi":
    - tab "Panoramica" [selected]
    - tab "Andamenti"
    - tab "Affidabilità"
    - tab "Integrità del modello"
    - tab "Fatturazione"
  - tabpanel "Panoramica":
    - tablist "Panoramica":
      - tab "Dati chiave" [selected]
      - tab "Classifica"
    - tabpanel "Dati chiave":
