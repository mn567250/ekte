- main:
  - heading "Ce relais sert-il le vrai modèle ?" [level=1]
  - paragraph: Choisissez le relais, le modèle à auditer et, s'il est vendu sous un autre nom, le modèle qu'il prétend être. ekte exécute sur votre machine une batterie complète de tests en boîte noire et produit un rapport de vérification lisible et étayé par des preuves.
  - status:
    - text: Dernier audit terminé gateway.a-very-long-relay-hostname.example.org · model-b · score 72/100 · 27 sept. 2026, 10:02
    - button "Ouvrir le rapport"
  - tablist "Audits":
    - tab "Nouvel audit" [selected]
    - tab "En cours"
  - tabpanel "Nouvel audit":
    - list "Progression de l'audit":
      - listitem: Configurer
      - listitem: Analyse
      - listitem: Rapport
    - region "Configurer":
      - heading "Configurer" [level=2]
      - group "Type de point d'accès surface":
        - text: Type de point d'accès surface
        - radio "Chat" [checked]
        - text: Chat
        - radio "Embeddings"
        - text: Embeddings
        - radio "Reclassement"
        - text: Reclassement
      - text: Relais / fournisseur Facultatif
      - combobox "Relais / fournisseur Facultatif":
        - option "Sélectionnez un relais ou un fournisseur…" [selected]
        - option "Autre (saisir l'URL)"
      - text: En choisir un remplit son URL ; pour tout autre relais, choisissez « Autre » et saisissez l'URL. URL du relais base_url
      - combobox "URL du relais base_url"
      - text: Clé API Accepte env:VAR / file:/chemin
      - textbox "Clé API":
        - /placeholder: sk-... ou env:EKTE_API_KEY
      - button "Afficher la clé"
      - text: Modèle demandé model
      - textbox "Modèle demandé model":
        - /placeholder: deepseek-chat
      - button "Actualiser les modèles" [disabled]
      - status: Sélectionnez un relais ou saisissez son URL, et ekte liste ses modèles.
      - text: Modèle annoncé claimed_model Facultatif
      - combobox "Modèle annoncé claimed_model Facultatif":
        - option "Identique au modèle demandé" [selected]
      - button "Saisir manuellement"
      - text: Seulement si le relais le vend sous un autre nom — ekte vérifie les réponses par rapport à ce modèle. Protocole
      - group "Protocole":
        - button "Auto" [pressed]
        - button "OpenAI"
        - button "Anthropic"
        - button "Responses"
      - text: Suite de tests
      - group "Suite de tests":
        - button "smoke"
        - button "standard" [pressed]
        - button "deep"
        - button "full"
        - button "personnalisé"
      - text: Requêtes de la sonde de performance
      - group "Requêtes de la sonde de performance":
        - button "Streaming" [pressed]
        - button "Sans streaming"
      - text: En standard, la sonde ne s'exécute qu'avec une référence ; sinon, les requêtes de l'audit lui-même sont utilisées.
      - button "Comparer à une référence de confiance compare" [expanded]
      - paragraph: Indiquez un point d'accès du même modèle en qui vous avez confiance (p. ex. l'API officielle). ekte s'en sert pour corroborer le comportement de la cible et fiabiliser les verdicts de substitution/déclassement — l'évaluation de qualité et la détection de falsification n'atteignent leur niveau maximal qu'avec une référence.
      - text: Relais / fournisseur de référence Facultatif
      - combobox "Relais / fournisseur de référence Facultatif":
        - option "Sélectionnez un relais ou un fournisseur…" [selected]
        - option "Autre (saisir l'URL)"
      - text: En choisir un remplit son URL ; pour tout autre relais, choisissez « Autre » et saisissez l'URL. URL de référence base_url
      - combobox "URL de référence base_url"
      - text: Clé API de référence
      - textbox "Clé API de référence":
        - /placeholder: sk-... ou env:OPENAI_API_KEY
      - button "Afficher la clé"
      - text: Modèle de référence model
      - textbox "Modèle de référence model":
        - /placeholder: id officiel du même modèle
      - button "Actualiser les modèles" [disabled]
      - status: Sélectionnez un relais ou saisissez son URL, et ekte liste ses modèles.
      - text: Protocole de référence
      - group "Protocole de référence":
        - button "Auto" [pressed]
        - button "OpenAI"
        - button "Anthropic"
        - button "Responses"
      - button "Lancer l'audit"
      - text: Les tests partent de votre serveur ekte local ; la clé sert uniquement à se connecter au relais cible et n'est jamais transmise à un tiers.
      - alert
      - status
- contentinfo:
  - paragraph: "Tout en local : les audits partent de votre propre machine et vos clés d'API ne la quittent jamais."
  - paragraph: "Une boîte noire : ekte fournit des preuves reproductibles d'écarts, pas une preuve de fraude. N'accusez pas un fournisseur sur la base d'une seule exécution."
