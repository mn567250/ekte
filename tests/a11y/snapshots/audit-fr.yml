- banner:
  - link "Aller au contenu principal":
    - /url: "#main"
  - link "ekte":
    - /url: /v2/
    - text: ekte.
  - combobox "Thème":
    - option "Automatique"
    - option "Clair" [selected]
    - option "Sombre"
  - combobox "Animation":
    - option "Animation activée" [selected]
    - option "Animation désactivée"
  - combobox "Langue":
    - option "English"
    - option "中文"
    - option "Français" [selected]
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - link "Accessibilité":
    - /url: /v2/accessibility
  - navigation "Navigation principale":
    - link "Audit":
      - /url: /v2/
    - link "Surveillances":
      - /url: /v2/watches
    - link "Historique":
      - /url: /v2/history
    - link "Analyses":
      - /url: /v2/analytics
    - link "Connaissances":
