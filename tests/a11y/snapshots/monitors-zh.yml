- banner:
  - link "跳到主要内容":
    - /url: "#main"
  - link "ekte":
    - /url: /v2/
    - text: ekte.
  - link "经典界面":
    - /url: "?ui=v1"
  - combobox "主题":
    - option "跟随系统"
    - option "浅色" [selected]
    - option "深色"
  - combobox "动画":
    - option "动画开" [selected]
    - option "动画关"
  - combobox "语言":
    - option "English"
    - option "中文" [selected]
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - link "无障碍":
    - /url: /v2/accessibility
  - navigation "主导航":
    - link "检测":
      - /url: /v2/
    - link "监控":
      - /url: /v2/watches
    - link "检测历史":
      - /url: /v2/history
    - link "分析":
      - /url: /v2/analytics
    - link "知识库":
      - /url: /v2/kb
- main:
  - heading "给中转站设个定时哨兵" [level=1]
  - paragraph:
    - text: 每个监控都会在你本地、按设定的间隔重跑一次你已经跑过的检测。添加方式：在
    - link "检测历史":
      - /url: /v2/history
    - text: 中打开一次运行，选择设为监控，然后在这里设置间隔并启用。一旦风险越线或较上次恶化，ekte 就向你配置的 Webhook（Slack / 飞书 / 钉钉 / 通用 JSON）推送告警。
  - status:
    - text: "API 密钥不会被保存 你输入的密钥只留在 ekte serve 的内存中，从不写入磁盘；重启后需重新输入。env: 变量引用照常工作。"
    - button "更改"
  - group "API 密钥保存方式":
    - text: API 密钥保存方式
    - radio "不保存密钥" [checked]
    - text: 不保存密钥
    - radio "加密保存在本机"
    - text: 加密保存在本机
    - paragraph: API 密钥只保存在 ekte serve 的内存中，从不写入磁盘；每次重启后需重新输入。需要无人值守运行的监控可使用 env:变量名。
  - region "筛选":
    - button "筛选" [expanded]
    - text: 搜索
    - searchbox "搜索"
    - text: 状态
    - combobox "状态":
      - option "全部" [selected]
      - option "待设置"
    - text: 上次风险
    - combobox "上次风险":
      - option "全部" [selected]
      - option "尚无结果"
    - text: 接口类型
    - combobox "接口类型":
      - option "全部" [selected]
      - option "对话"
    - text: 中转站 / 厂商
    - combobox "中转站 / 厂商":
      - option "全部" [selected]
      - option "127.0.0.1:9099"
    - text: 套件
    - combobox "套件":
      - option "全部" [selected]
      - option "standard"
    - text: 显示 1/1 个监控
  - tablist "监控视图":
    - tab "配置" [selected]
    - tab "运行中"
  - tabpanel "配置":
    - heading "已配置的监控 共 1 项" [level=2]
    - article "gpt-4o":
      - heading "gpt-4o" [level=3]:
        - button "gpt-4o" [expanded]
      - text: 待设置
      - switch "监控生效" [disabled]
      - text: 监控生效
      - emphasis: (待设置)
      - text: http://127.0.0.1:9099/v1
      - term: 请求的模型
      - definition:
        - code: gpt-4o
      - term: 接口类型
      - definition: 对话
      - term: 测试套件
      - definition:
        - code: standard
      - term: 协议
      - definition:
        - code: openai
        - text: · 自动识别
      - term: 性能探测请求
      - definition: 流式
      - term: 检测间隔
      - definition: 未设置
      - term: API 密钥
      - definition:
        - text: 无
        - button "更换"
      - term: 告警阈值
      - definition:
        - combobox "告警阈值 — gpt-4o":
          - option "低及以上"
          - option "中及以上" [selected]
          - option "仅高"
      - term: Webhook
      - definition:
        - text: 无 Webhook
        - button "编辑"
      - term: 告警语言
      - definition:
        - combobox "告警语言 — gpt-4o":
          - option "English" [selected]
          - option "中文"
          - option "Français"
          - option "Español"
          - option "Português"
          - option "Italiano"
          - option "Deutsch"
      - term: 知识库资料
      - definition:
        - code: openai/gpt-4o
        - text: 固定于 2026年10月1日 12:00
      - 'link "来自运行 #1 →"':
        - /url: /v2/history?host=127.0.0.1%3A9099&model=gpt-4o&suite=standard#r-1
      - form "设置后即可启用":
        - heading "设置后即可启用" [level=4]
        - paragraph: 配置取自检测历史中的那次运行。设置运行间隔后启用即可。
        - text: 检测间隔
        - combobox "检测间隔":
          - option "请选择…" [selected]
          - option "每 5 分钟"
          - option "每 10 分钟"
          - option "每 15 分钟"
          - option "每 20 分钟"
          - option "每 30 分钟"
          - option "每 1 小时"
          - option "每 2 小时"
          - option "每 3 小时"
          - option "每 4 小时"
          - option "每 6 小时"
          - option "每 8 小时"
          - option "每 12 小时"
          - option "每 24 小时"
        - paragraph: 上次完整运行耗时 1 秒，因此最短间隔为每 5 分钟。
        - text: API 密钥 （可选）
        - textbox "API 密钥 （可选）":
          - /placeholder: sk-... 或 env:EKTE_API_KEY
        - button "显示密钥"
        - paragraph: 检测历史不保存密钥。本地或自托管模型可留空。
        - button "启用监控"
      - button "立即运行"
      - button "删除"
    - paragraph: 全程本地运行。API Key 不会被保存：它只留在 ekte serve 的内存中，绝不写入磁盘、出现在监控列表里或发给浏览器。ekte serve 重启后请重新输入。
- contentinfo:
  - paragraph: 全部在本地：检测从你自己的机器发起，API 密钥不会离开本机。
  - paragraph: 黑盒：ekte 给出的是可复现的偏离证据，不是欺诈证明。请勿仅凭单次结果指责厂商。
