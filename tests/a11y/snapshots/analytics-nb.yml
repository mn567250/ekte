- banner:
  - link "Hopp til hovedinnholdet":
    - /url: "#main"
  - link "ekte":
    - /url: /v2/
    - text: ekte.
  - combobox "Tema":
    - option "Automatisk tema"
    - option "Lyst" [selected]
    - option "Mørkt"
  - combobox "Bevegelse":
    - option "Bevegelse på" [selected]
    - option "Bevegelse av"
  - combobox "Språk":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
    - option "Norsk" [selected]
  - link "Tilgjengelighet":
    - /url: /v2/accessibility
  - navigation "Hovednavigasjon":
    - link "Revisjon":
      - /url: /v2/
    - link "Overvåking":
      - /url: /v2/watches
    - link "Historikk":
      - /url: /v2/history
    - link "Analyse":
      - /url: /v2/analytics
    - link "Kunnskap":
      - /url: /v2/kb
- main:
  - heading "Analyse av revisjoner" [level=1]
  - paragraph: "Sammenlign releer og modeller over tid med det ekte har målt på denne maskinen: scorer, hastighet, suksessrater og fakturering."
  - status: 1 eldre kjøring har et anslått starttidspunkt Diagrammer over tid på døgnet plasserer dem omtrentlig.
  - status: "Oppdatert: 14 kjøringer i denne perioden."
  - region "Filtre":
    - button "Filtre" [expanded]
    - text: Periode
    - group "Periode":
      - button "Siste 7 dager"
      - button "Siste 30 dager" [pressed]
      - button "Siste 90 dager"
      - button "Hele perioden"
      - button "Egendefinert periode"
    - text: Type endepunkt
    - combobox "Type endepunkt":
      - option "Chat" [selected]
    - text: Testsett
    - combobox "Testsett":
      - option "Alle"
      - option "standard" [selected]
    - text: Probeforespørsler
    - combobox "Probeforespørsler":
      - option "Alle"
      - option "Strømming" [selected]
    - text: Protokoll
    - combobox "Protokoll":
      - option "Alle" [selected]
      - option "openai"
    - text: Kilde
    - combobox "Kilde":
      - option "Alle" [selected]
      - option "Manuelt"
      - option "Overvåking"
    - text: Relé / leverandør
    - combobox "Relé / leverandør":
      - option "Alle" [selected]
      - option "Example Relay"
      - option "https://gateway.a-very-long-relay-hostname.example.org/openai/compatible/v1"
      - option "http://127.0.0.1:9099/v1"
    - text: Oppgitt modell
    - combobox "Oppgitt modell":
      - option "Alle" [selected]
      - option "model-a"
      - option "model-b"
      - option "gpt-4o"
    - text: 15 kjøringer i historikken (4 av overvåkinger).
  - button "Kopier lenke til denne visningen"
  - tablist "Analysevisninger":
    - tab "Oversikt" [selected]
    - tab "Trender"
    - tab "Pålitelighet"
    - tab "Modellintegritet"
    - tab "Fakturering"
  - tabpanel "Oversikt":
    - tablist "Oversikt":
      - tab "Nøkkeltall" [selected]
      - tab "Rangeringsliste"
    - tabpanel "Nøkkeltall":
      - heading "Nøkkeltall" [level=2]
      - paragraph: 2. sep.–1. okt. 2026, sammenlignet med like lang periode før (3. aug.–1. sep. 2026).
      - list:
        - listitem: Kjøringer 14 +14
        - listitem: Releer 2 +2
        - listitem: Modeller 2 +2
        - listitem: Medianscore 79 Ingen data i forrige periode
        - listitem: Andel høy risiko 21,4 % Ingen data i forrige periode
        - listitem: Suksessrate 100 % Ingen data i forrige periode
        - listitem: Tid til første token p50 <duration> Ingen data i forrige periode
        - listitem: Dekodehastighet 62,9 tok/s Ingen data i forrige periode
        - listitem: Faktureringsforhold (prompt) 103 % Ingen data i forrige periode Data fra 9 av 14 kjøringer
        - listitem: Faktureringsforhold (fullføring) 102 % Ingen data i forrige periode Data fra 9 av 14 kjøringer
- contentinfo:
  - paragraph: "Alt lokalt: revisjoner kjøres fra din egen maskin, og API-nøklene dine forlater den aldri."
  - paragraph: "En black box: ekte rapporterer reproduserbare bevis på avvik, ikke bevis på svindel. Ikke legg skylden på en leverandør etter én enkelt kjøring."
