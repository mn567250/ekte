    - text: zing.
  - link "Interfaz clásica":
    - /url: "?ui=v1"
  - combobox "Tema":
    - option "Automático"
    - option "Claro" [selected]
    - option "Oscuro"
  - combobox "Animación":
    - option "Animación activada" [selected]
    - option "Animación desactivada"
  - combobox "Idioma":
    - option "English"
    - option "中文"
    - option "Français"
    - option "Español" [selected]
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
  - link "Accesibilidad":
    - /url: /v2/accessibility
  - navigation "Navegación principal":
    - link "Auditoría":
      - /url: /v2/
    - link "Monitores":
      - /url: /v2/watches
    - link "Historial":
      - /url: /v2/history
    - link "Analítica":
      - /url: /v2/analytics
    - link "Conocimiento":
      - /url: /v2/kb
- main:
  - heading "Ponga un centinela programado en su intermediario" [level=1]
  - paragraph:
    - text: Cada monitor vuelve a ejecutar una auditoría que ya realizaste, en tu equipo, con el intervalo que definas. Para añadir uno, abre una ejecución en el
    - link "Historial":
      - /url: /v2/history
    - text: y elige Programar como monitor; luego define aquí su intervalo y actívalo. Cuando el riesgo supera tu umbral o empeora respecto a la última vez, zing avisa a tus webhooks (Slack / Feishu / DingTalk / JSON genérico).
  - status:
    - text: Las claves API no se guardan Las claves que introduces solo permanecen en la memoria de zing serve y nunca se escriben en el disco; vuelve a introducirlas tras un reinicio. Las referencias env:VAR siguen funcionando.
    - button "Cambiar"
  - group "Almacenamiento de claves API":
    - text: Almacenamiento de claves API
    - radio "No guardar claves" [checked]
    - text: No guardar claves
    - radio "Guardar cifradas en este equipo"
    - text: Guardar cifradas en este equipo
    - paragraph: Las claves API permanecen en la memoria de zing serve y nunca se escriben en el disco; vuelve a introducirlas tras cada reinicio. Usa env:VAR para monitores que deban funcionar sin supervisión.
  - region "Filtros":
    - button "Filtros" [expanded]
    - text: Buscar
    - searchbox "Buscar"
    - text: Estado
    - combobox "Estado":
      - option "Todos" [selected]
      - option "Requiere configuración"
    - text: Último riesgo
    - combobox "Último riesgo":
      - option "Todos" [selected]
      - option "Aún sin resultado"
    - text: Tipo de endpoint
    - combobox "Tipo de endpoint":
      - option "Todos" [selected]
      - option "Chat"
    - text: Relay / proveedor
    - combobox "Relay / proveedor":
      - option "Todos" [selected]
      - option "127.0.0.1:9099"
    - text: Suite
    - combobox "Suite":
      - option "Todos" [selected]
      - option "standard"
    - text: Mostrando 1 de 1 monitores
  - tablist "Vistas de monitores":
    - tab "Configurar" [selected]
    - tab "En curso"
  - tabpanel "Configurar":
    - heading "Monitores configurados 1 monitor" [level=2]
    - article "gpt-4o":
      - heading "gpt-4o" [level=3]:
        - button "gpt-4o" [expanded]
      - text: Requiere configuración
      - switch "Monitor activo" [disabled]
      - text: Monitor activo
      - emphasis: (Requiere configuración)
      - text: http://127.0.0.1:9099/v1
      - term: Modelo solicitado
      - definition:
        - code: gpt-4o
      - term: Tipo de endpoint
      - definition: Chat
      - term: Batería de pruebas
      - definition:
        - code: standard
      - term: Protocolo
      - definition:
        - code: openai
        - text: · detectado automáticamente
      - term: Peticiones de la sonda de rendimiento
      - definition: Streaming
      - term: Intervalo de comprobación
      - definition: Sin definir
      - term: Clave de API
      - definition:
        - text: Ninguna
        - button "Reemplazar"
      - term: Umbral de alerta
      - definition:
        - combobox "Umbral de alerta — gpt-4o":
          - option "Bajo o superior"
          - option "Medio o superior" [selected]
          - option "Solo alto"
      - term: Webhooks
      - definition:
        - text: Sin webhooks
        - button "Editar"
      - term: Idioma de las alertas
      - definition:
        - combobox "Idioma de las alertas — gpt-4o":
          - option "English" [selected]
          - option "中文"
          - option "Français"
          - option "Español"
          - option "Português"
          - option "Italiano"
          - option "Deutsch"
      - term: Perfil de conocimiento
      - definition:
        - code: openai/gpt-4o
        - text: fijado 1 oct 2026, 12:00
      - 'link "De la ejecución #1 →"':
        - /url: /v2/history?host=127.0.0.1%3A9099&model=gpt-4o&suite=standard#r-1
      - form "Completa la configuración para activarlo":
        - heading "Completa la configuración para activarlo" [level=4]
        - paragraph: La configuración proviene de la ejecución del Historial. Define cada cuánto se ejecuta y actívalo.
        - text: Intervalo de comprobación
        - combobox "Intervalo de comprobación":
          - option "Elegir…" [selected]
          - option "cada 5 min"
          - option "cada 10 min"
          - option "cada 15 min"
          - option "cada 20 min"
          - option "cada 30 min"
          - option "cada 1 h"
          - option "cada 2 h"
          - option "cada 3 h"
          - option "cada 4 h"
          - option "cada 6 h"
          - option "cada 8 h"
          - option "cada 12 h"
          - option "cada 24 h"
        - paragraph: Una ejecución completa tardó <duration>, así que se ejecuta como máximo cada 5 min.
        - text: Clave de API (opcional)
        - textbox "Clave de API (opcional)":
          - /placeholder: sk-... o env:ZING_API_KEY
        - button "Mostrar clave"
        - paragraph: El historial nunca guarda la clave. Déjala vacía para un modelo local o autoalojado.
        - button "Activar monitor"
      - button "Ejecutar ahora"
      - button "Eliminar"
    - paragraph: "Todo se ejecuta localmente. La clave API no se guarda: permanece solo en la memoria de zing serve y nunca se escribe en el disco, se muestra en la lista de monitores ni se envía al navegador. Vuelve a introducirla cuando zing serve se reinicie."
- contentinfo:
  - paragraph: "Todo local: las auditorías se ejecutan desde tu propio equipo y tus claves de API nunca salen de él."
  - paragraph: "Una caja negra: zing aporta evidencia reproducible de desviaciones, no una prueba de fraude. No culpes a un proveedor por una sola ejecución."
