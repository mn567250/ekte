- main:
  - heading "The knowledge base ekte audits against" [level=1]
  - paragraph:
    - text: "Every audit compares a relay with the profile of the model it claims: context window, output limit, capabilities, identity and behavioral fingerprints. Here you find every model, provider and relay ekte knows — packaged ones and yours — and can switch each of them on or off or add your own. Your changes are stored in kb.db on this machine and used by the web UI and"
    - code: ekte check
    - text: alike.
  - status: Knowledge base complete 244 models · 23 providers · 1 relay, all switched on
  - region "Filters":
    - button "Filters" [expanded]
    - text: Model id
    - combobox "Model id":
      - option "All" [selected]
    - text: Provider
    - combobox "Provider":
      - option "All" [selected]
      - option "Ai2 (Allen Institute for AI)"
      - option "Anthropic (Claude)"
      - option "Arcee AI"
      - option "Black Forest Labs"
      - option "Cohere (Toronto, Canada)"
      - option "Deep Cogito"
      - option "DeepSeek (DeepSeek-AI / Hangzhou DeepSeek)"
      - option "Google (Gemini API / Google AI for Developers; also Vertex AI / Gemini Enterprise Agent Platform)"
      - option "Zhipu AI (智谱 / Z.ai) — BigModel open platform"
      - option "IBM — Granite"
      - option "Jina AI (Berlin, Germany; part of Elastic)"
      - option "Liquid AI"
      - option "Meta (Llama open-weight models)"
      - option "Microsoft — Phi"
      - option "Mistral AI (Paris)"
      - option "Moonshot AI (月之暗面 / Kimi)"
      - option "Nous Research"
      - option "NVIDIA (Nemotron open models, NIM)"
      - option "OpenAI"
      - option "Alibaba Cloud — Qwen / 通义千问 (Tongyi Qianwen), served via DashScope / Model Studio (Bailian 百炼)"
      - option "Stability AI"
      - option "Voyage AI (US, San Francisco; part of MongoDB)"
      - option "xAI — Grok"
    - text: Relay
    - combobox "Relay":
      - option "All" [selected]
      - option "Example Relay"
    - text: Source
    - combobox "Source":
      - option "All" [selected]
      - option "Packaged"
      - option "Yours"
    - status: Showing 244 of 244 models · 23 of 23 providers · 1 of 1 relays
  - link "Export your entries as YAML":
    - /url: /api/kb/export
  - tablist "Knowledge base sections":
    - tab "Models" [selected]
    - tab "Providers"
    - tab "Relays"
  - tabpanel "Models":
    - heading "All models 244 models" [level=2]
    - paragraph: "The model profiles audits compare against. A model that is switched off no longer resolves: audits of it run without a profile."
    - group:
      - text: Add a model
      - paragraph: Let an AI assistant research the model, then check its answer here before it is stored.
      - heading "1 Copy the research prompt" [level=3]
      - text: Model id id
      - textbox "Model id id":
        - /placeholder: e.g. example-large-2
      - text: Provider Optional
      - textbox "Provider Optional":
        - /placeholder: e.g. openai / deepseek
      - button "Copy prompt"
      - status
      - group:
        - text: Show the prompt
        - textbox "Prompt"
      - paragraph: Paste it into the AI assistant of your choice. It answers with one YAML document.
      - heading "2 Upload or paste the YAML" [level=3]
      - text: Profile YAML
      - textbox "Profile YAML":
        - /placeholder: "provider: …\nmodels:\n- id: …"
      - text: Choose a .yaml file
      - heading "3 Check and save" [level=3]
      - paragraph: The check validates the schema and limits, flags unsafe regular expressions, lists every prompt ekte would send to relays, and shows which model ids would resolve differently. Nothing is stored until you save.
      - button "Check"
      - button "Save to knowledge base" [disabled]
    - group:
      - text: Ai2 (Allen Institute for AI)
      - code: ai2
      - text: 6 models
      - list:
        - listitem:
          - code: allenai/Olmo-3-7B-Instruct
          - text: Packaged Context 65536 Max output — Aliases
          - code: allenai/olmo-3-7b-instruct
          - text: ","
          - code: Olmo-3-7B-Instruct
          - switch "allenai/Olmo-3-7B-Instruct Enabled" [checked]
          - emphasis: Enabled
        # … more items of the same shape
    # … more items of the same shape
- contentinfo:
  - paragraph: "All local: audits run from your own machine, and your API keys never leave it."
  - paragraph: "A black box: ekte reports reproducible evidence of deviation, not proof of fraud. Do not blame a vendor for a single run."
