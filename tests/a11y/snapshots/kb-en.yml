      - /url: /v2/kb
  - paragraph: Runs locally · keys never leave
- main:
  - heading "The knowledge base zing audits against" [level=1]
  - paragraph:
    - text: "Every audit compares a relay with the profile of the model it claims: context window, output limit, capabilities, identity and behavioral fingerprints. Here you find every model, provider and relay zing knows — packaged ones and yours — and can switch each of them on or off or add your own. Your changes are stored in kb.db on this machine and used by the web UI and"
    - code: zing check
    - text: alike.
  - region "Which profile does a model id use?":
    - heading "Which profile does a model id use?" [level=2]
    - text: Model id
    - textbox "Model id":
      - /placeholder: e.g. gpt-4o
    - button "Look up"
    - link "Export your entries as YAML":
      - /url: /api/kb/export
    - status
  - tablist "Knowledge base sections":
    - tab "Models" [selected]
    - tab "Providers"
    - tab "Relays"
  - tabpanel "Models":
    - heading "All models 98 models" [level=2]
    - paragraph: "The model profiles audits compare against. A model that is switched off no longer resolves: audits of it run without a profile."
    - group:
      - text: Add a model
      - paragraph: Let an AI assistant research the model, then check its answer here before it is stored.
      - heading "1 Copy the research prompt" [level=3]
      - text: Model id id
      - textbox "Model id id":
        - /placeholder: e.g. example-large-2
      - text: Provider Optional
      - textbox "Provider Optional":
        - /placeholder: e.g. openai / deepseek
      - button "Copy prompt"
      - status
      - group:
        - text: Show the prompt
        - textbox "Prompt"
      - paragraph: Paste it into the AI assistant of your choice. It answers with one YAML document.
      - heading "2 Upload or paste the YAML" [level=3]
      - text: Profile YAML
      - textbox "Profile YAML":
        - /placeholder: "provider: …\nmodels:\n- id: …"
      - text: Choose a .yaml file
      - heading "3 Check and save" [level=3]
      - paragraph: The check validates the schema and limits, flags unsafe regular expressions, lists every prompt zing would send to relays, and shows which model ids would resolve differently. Nothing is stored until you save.
      - button "Check"
      - button "Save to knowledge base" [disabled]
    - text: Filter models
    - searchbox "Filter models"
    - status
    - group:
      - text: Anthropic (Claude)
      - code: anthropic
      - text: 14 models
      - list:
        - listitem:
          - code: claude-opus-4-8
          - text: Packaged Context 1000000 Max output 128000 Aliases
          - code: claude-opus-4-8
          - text: ","
          - code: opus
          - text: ","
          - code: opus 4.8
          - text: ","
          - code: most powerful
          - switch "claude-opus-4-8 Enabled" [checked]
          - emphasis: Enabled
        # … more items of the same shape
    # … more items of the same shape
