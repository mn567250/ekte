- main:
  - heading "Placez une sentinelle planifiée sur votre relais" [level=1]
  - paragraph:
    - text: Chaque surveillance relance un audit que vous avez déjà exécuté, sur votre machine, à l’intervalle choisi. Pour en ajouter une, ouvrez une exécution dans l’
    - link "Historique":
      - /url: /history
    - text: et choisissez Planifier comme surveillance, puis définissez ici son intervalle et activez-la. Dès que le risque franchit votre seuil ou s’aggrave par rapport à la dernière fois, ekte alerte vos webhooks (Slack / Feishu / DingTalk / JSON générique).
  - status:
    - text: Les clés API ne sont pas enregistrées Les clés saisies restent uniquement dans la mémoire de ekte serve et ne sont jamais écrites sur le disque ; saisissez-les à nouveau après un redémarrage. Les références env:VAR continuent de fonctionner.
    - button "Modifier"
  - group "Stockage des clés API":
    - text: Stockage des clés API
    - radio "Ne pas enregistrer les clés" [checked]
    - text: Ne pas enregistrer les clés
    - radio "Enregistrer chiffrées sur cette machine"
    - text: Enregistrer chiffrées sur cette machine
    - paragraph: Les clés API restent dans la mémoire de ekte serve et ne sont jamais écrites sur le disque ; saisissez-les à nouveau après chaque redémarrage. Utilisez env:VAR pour les surveillances qui doivent tourner sans intervention.
  - region "Filtres":
    - button "Filtres" [expanded]
    - text: Rechercher
    - searchbox "Rechercher"
    - text: Statut
    - combobox "Statut":
      - option "Tous" [selected]
      - option "À configurer"
    - text: Dernier risque
    - combobox "Dernier risque":
      - option "Tous" [selected]
      - option "Pas encore de résultat"
    - text: Type de point d'accès
    - combobox "Type de point d'accès":
      - option "Tous" [selected]
      - option "Chat"
    - text: Relais / fournisseur
    - combobox "Relais / fournisseur":
      - option "Tous" [selected]
      - option "127.0.0.1:9099"
    - text: Suite
    - combobox "Suite":
      - option "Tous" [selected]
      - option "standard"
    - text: 1 surveillance(s) affichée(s) sur 1
  - tablist "Vues des moniteurs":
    - tab "Configurer" [selected]
    - tab "En cours"
  - tabpanel "Configurer":
    - heading "Surveillances configurées 1 surveillance" [level=2]
    - article "gpt-4o":
      - heading "gpt-4o" [level=3]:
        - button "gpt-4o" [expanded]
      - text: À configurer
      - switch "Surveillance active" [disabled]
      - text: Surveillance active
      - emphasis: (À configurer)
      - text: http://127.0.0.1:9099/v1
      - term: Modèle demandé
      - definition:
        - code: gpt-4o
      - term: Type de point d'accès
      - definition: Chat
      - term: Suite de tests
      - definition:
        - code: standard
      - term: Protocole
      - definition:
        - code: openai
        - text: · détecté automatiquement
      - term: Requêtes de la sonde de performance
      - definition: Streaming
      - term: Intervalle de contrôle
      - definition: Non défini
      - term: Clé API
      - definition:
        - text: Aucune
        - button "Remplacer"
      - term: Seuil d'alerte
      - definition:
        - combobox "Seuil d'alerte — gpt-4o":
          - option "Faible et plus"
          - option "Moyen et plus" [selected]
          - option "Élevé uniquement"
      - term: Webhooks
      - definition:
        - text: Aucun webhook
        - button "Modifier"
      - term: Langue des alertes
      - definition:
        - combobox "Langue des alertes — gpt-4o":
          - option "English" [selected]
          - option "中文"
          - option "Français"
          - option "Español"
          - option "Português"
          - option "Italiano"
          - option "Deutsch"
          - option "Norsk"
      - term: Profil de connaissances
      - definition:
        - code: openai/gpt-4o
        - text: figé 1 oct. 2026, 12:00
      - 'link "Depuis l’exécution #1 →"':
        - /url: /history?host=127.0.0.1%3A9099&model=gpt-4o&suite=standard#r-1
      - form "Terminez la configuration pour l’activer":
        - heading "Terminez la configuration pour l’activer" [level=4]
        - paragraph: La configuration provient de l’exécution dans l’Historique. Définissez sa fréquence, puis activez-la.
        - text: Intervalle de contrôle
        - combobox "Intervalle de contrôle":
          - option "Choisir…" [selected]
          - option "toutes les 5 min"
          - option "toutes les 10 min"
          - option "toutes les 15 min"
          - option "toutes les 20 min"
          - option "toutes les 30 min"
          - option "toutes les 1 h"
          - option "toutes les 2 h"
          - option "toutes les 3 h"
          - option "toutes les 4 h"
          - option "toutes les 6 h"
          - option "toutes les 8 h"
          - option "toutes les 12 h"
          - option "toutes les 24 h"
        - paragraph: Une exécution complète a pris <duration>, elle s’exécute donc au plus toutes les 5 min.
        - text: Clé API (facultatif)
        - textbox "Clé API (facultatif)":
          - /placeholder: sk-... ou env:EKTE_API_KEY
        - button "Afficher la clé"
        - paragraph: L’historique ne conserve jamais la clé. Laissez vide pour un modèle local ou auto-hébergé.
        - button "Activer la surveillance"
      - button "Exécuter maintenant"
      - button "Supprimer"
    - paragraph: "Tout s'exécute localement. La clé API n'est pas enregistrée : elle reste uniquement dans la mémoire de ekte serve et n'est jamais écrite sur le disque, affichée dans la liste des surveillances ni envoyée au navigateur. Saisissez-la à nouveau après le redémarrage de ekte serve."
- contentinfo:
  - paragraph: "Tout en local : les audits partent de votre propre machine et vos clés d'API ne la quittent jamais."
  - paragraph: "Une boîte noire : ekte fournit des preuves reproductibles d'écarts, pas une preuve de fraude. N'accusez pas un fournisseur sur la base d'une seule exécution."
