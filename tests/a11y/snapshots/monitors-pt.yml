- banner:
  - link "Saltar para o conteúdo principal":
    - /url: "#main"
  - link "ekte":
    - /url: /
    - text: ekte.
  - link "v<version> Registro de alterações":
    - /url: /changelog
  - group "Configurações de exibição":
    - combobox "Tema":
      - option "Automático"
      - option "Claro" [selected]
      - option "Escuro"
    - combobox "Animação":
      - option "Animação ligada" [selected]
      - option "Animação desligada"
    - combobox "Idioma":
      - option "English"
      - option "中文"
      - option "Français"
      - option "Español"
      - option "Português" [selected]
      - option "Italiano"
      - option "Deutsch"
      - option "Norsk"
  - link "Acessibilidade":
    - /url: /accessibility
  - navigation "Navegação principal":
    - link "Auditoria":
      - /url: /
    - link "Monitores":
      - /url: /watches
    - link "Histórico":
      - /url: /history
    - link "Análises":
      - /url: /analytics
    - link "Conhecimento":
      - /url: /kb
- main:
  - heading "Coloque uma sentinela agendada no seu intermediário" [level=1]
  - paragraph:
    - text: Cada monitor executa novamente, na sua máquina, uma auditoria que já executou, no intervalo definido. Para adicionar um, abra uma execução no
    - link "Histórico":
      - /url: /history
    - text: e escolha Agendar como monitor; depois defina aqui o intervalo e ative-o. Quando o risco ultrapassa o seu limite ou piora em relação à última vez, o ekte alerta os seus webhooks (Slack / Feishu / DingTalk / JSON genérico).
  - region "Filtros":
    - button "Filtros" [expanded]
    - text: Pesquisar
    - searchbox "Pesquisar"
    - text: Tipo de endpoint
    - combobox "Tipo de endpoint":
      - option "Todos" [selected]
      - option "Chat (1)"
      - option "Embeddings"
      - option "Reordenação"
    - text: Relay / fornecedor
    - button "Relay / fornecedor Todos": Todos
    - text: Modelo declarado
    - button "Modelo declarado Todos": Todos
    - text: Suite
    - combobox "Suite":
      - option "Todos" [selected]
      - option "standard (1)"
    - text: Protocolo
    - combobox "Protocolo":
      - option "Todos" [selected]
      - option "openai (1)"
    - text: Pedidos de sondagem
    - combobox "Pedidos de sondagem":
      - option "Todos" [selected]
      - option "Streaming (1)"
      - option "Sem streaming"
      - option "Streaming + sem streaming"
    - text: Estado
    - combobox "Estado":
      - option "Todos" [selected]
      - option "Ativo"
      - option "Em pausa"
      - option "Requer configuração (1)"
    - text: Em alerta
    - combobox "Em alerta":
      - option "Todos" [selected]
      - option "No limite de alerta ou acima"
      - option "Abaixo do limite de alerta (1)"
    - text: 1 monitor
    - checkbox "Manter os filtros entre páginas" [checked]
    - text: Manter os filtros entre páginas
    - status
    - button "Copiar a ligação para esta vista"
  - status
  - group "Armazenamento das chaves de API":
    - text: Armazenamento das chaves de API
    - radio "Não guardar chaves" [checked]
    - text: Não guardar chaves
    - radio "Guardar cifradas neste computador"
    - text: Guardar cifradas neste computador
    - paragraph: As chaves de API ficam na memória do ekte serve e nunca são escritas no disco; introduza-as novamente após cada reinício. Use env:VAR para monitores que tenham de funcionar sem supervisão.
  - tablist "Vistas de monitores":
    - tab "Configurar" [selected]
    - tab "Em curso"
  - tabpanel "Configurar":
    - heading "Monitores configurados 1 monitor" [level=2]
    - article "gpt-4o":
      - heading "gpt-4o" [level=3]:
        - button "gpt-4o" [expanded]
      - text: Requer configuração
      - switch "Monitor ativo" [disabled]
      - text: Monitor ativo
      - emphasis: (Requer configuração)
      - text: http://127.0.0.1:9099/v1
      - term: Modelo pedido
      - definition:
        - code: gpt-4o
      - term: Tipo de endpoint
      - definition: Chat
      - term: Conjunto de testes
      - definition:
        - code: standard
      - term: Protocolo
      - definition:
        - code: openai
        - text: · detetado automaticamente
      - term: Pedidos da sonda de desempenho
      - definition: Streaming
      - term: Limite de alerta
      - definition:
        - combobox "Limite de alerta — gpt-4o":
          - option "Baixo ou superior"
          - option "Médio ou superior" [selected]
          - option "Apenas alto"
      - term: Webhooks
      - definition:
        - text: Sem webhooks
        - button "Editar webhooks"
      - term: Idioma dos alertas
      - definition:
        - combobox "Idioma dos alertas — gpt-4o":
          - option "English" [selected]
          - option "中文"
          - option "Français"
          - option "Español"
          - option "Português"
          - option "Italiano"
          - option "Deutsch"
          - option "Norsk"
      - term: Perfil de conhecimento
      - definition:
        - code: openai/gpt-4o
        - text: fixado 01/10/2026, 12:00
      - term: Pedidos/respostas brutos
      - definition:
        - combobox "Pedidos/respostas brutos — gpt-4o":
          - option "Manter" [selected]
          - option "Não manter"
      - 'link "Da execução #1: gpt-4o"':
        - /url: /history?surface=chat&relay=http%3A%2F%2F127.0.0.1%3A9099%2Fv1&model=gpt-4o&suite=standard&runs.focus=1
        - text: "Da execução #1"
      - 'link "Abrir em Análises: gpt-4o"':
        - /url: /analytics?surface=chat&relay=http%3A%2F%2F127.0.0.1%3A9099%2Fv1&model=gpt-4o&suite=standard&api=openai&stream=stream&exec=monitor&watch=1&tab=overview
        - text: Abrir em Análises
      - form "Conclua a configuração para ativá-lo":
        - heading "Conclua a configuração para ativá-lo" [level=4]
        - text: A configuração vem da execução no Histórico. Defina com que frequência e quando é executado e ative-o. Intervalo de verificação
        - combobox "Intervalo de verificação":
          - option "Escolher…" [selected]
          - option "a cada 5 min"
          - option "a cada 10 min"
          - option "a cada 15 min"
          - option "a cada 20 min"
          - option "a cada 30 min"
          - option "a cada 1 h"
          - option "a cada 2 h"
          - option "a cada 3 h"
          - option "a cada 4 h"
          - option "a cada 6 h"
          - option "a cada 8 h"
          - option "a cada 12 h"
          - option "a cada 24 h"
        - paragraph: Uma execução completa demorou <duration>, por isso é executada no máximo a cada 5 min.
        - text: Chave de API (opcional)
        - textbox "Chave de API (opcional)":
          - /placeholder: sk-... ou env:EKTE_API_KEY
        - button "Mostrar chave"
        - paragraph: O histórico nunca guarda a chave. Deixe vazio para um modelo local ou autoalojado.
        - group "Janela de execução":
          - text: Janela de execução
          - group "Predefinições":
            - button "Sempre" [pressed]
            - button "Dias úteis"
            - button "Dias úteis 07–19"
            - button "Personalizado"
          - paragraph: O monitor corre com o seu intervalo de verificação a qualquer hora do dia.
        - button "Ativar monitor"
      - button "Eliminar"
      - button "Executar agora"
- contentinfo:
  - paragraph: "Tudo local: as auditorias partem da sua própria máquina e as suas chaves de API nunca saem dela."
  - paragraph: "Uma caixa-preta: o ekte fornece evidências reprodutíveis de desvios, não prova de fraude. Não culpe um fornecedor por uma única execução."
