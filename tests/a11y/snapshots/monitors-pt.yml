- main:
  - heading "Coloque uma sentinela agendada no seu intermediário" [level=1]
  - paragraph:
    - text: Cada monitor executa novamente, na sua máquina, uma auditoria que você já rodou, no intervalo definido. Para adicionar um, abra uma execução no
    - link "Histórico":
      - /url: /history
    - text: e escolha Agendar como monitor; depois defina aqui o intervalo e ative-o. Quando o risco ultrapassa seu limite ou piora em relação à última vez, o ekte alerta seus webhooks (Slack / Feishu / DingTalk / JSON genérico).
  - status:
    - text: As chaves de API não são guardadas As chaves que introduz ficam apenas na memória do ekte serve e nunca são escritas no disco; introduza-as novamente após um reinício. As referências env:VAR continuam a funcionar.
    - button "Alterar"
  - group "Armazenamento das chaves de API":
    - text: Armazenamento das chaves de API
    - radio "Não guardar chaves" [checked]
    - text: Não guardar chaves
    - radio "Guardar cifradas neste computador"
    - text: Guardar cifradas neste computador
    - paragraph: As chaves de API ficam na memória do ekte serve e nunca são escritas no disco; introduza-as novamente após cada reinício. Use env:VAR para monitores que tenham de funcionar sem supervisão.
  - region "Filtros":
    - button "Filtros" [expanded]
    - text: Pesquisar
    - searchbox "Pesquisar"
    - text: Estado
    - combobox "Estado":
      - option "Todos" [selected]
      - option "Requer configuração"
    - text: Último risco
    - combobox "Último risco":
      - option "Todos" [selected]
      - option "Ainda sem resultado"
    - text: Tipo de endpoint
    - combobox "Tipo de endpoint":
      - option "Todos" [selected]
      - option "Chat"
    - text: Relay / provedor
    - combobox "Relay / provedor":
      - option "Todos" [selected]
      - option "127.0.0.1:9099"
    - text: Suite
    - combobox "Suite":
      - option "Todos" [selected]
      - option "standard"
    - text: A mostrar 1 de 1 monitores
  - tablist "Vistas de monitores":
    - tab "Configurar" [selected]
    - tab "Em andamento"
  - tabpanel "Configurar":
    - heading "Monitores configurados 1 monitor" [level=2]
    - article "gpt-4o":
      - heading "gpt-4o" [level=3]:
        - button "gpt-4o" [expanded]
      - text: Requer configuração
      - switch "Monitor ativo" [disabled]
      - text: Monitor ativo
      - emphasis: (Requer configuração)
      - text: http://127.0.0.1:9099/v1
      - term: Modelo pedido
      - definition:
        - code: gpt-4o
      - term: Tipo de endpoint
      - definition: Chat
      - term: Conjunto de testes
      - definition:
        - code: standard
      - term: Protocolo
      - definition:
        - code: openai
        - text: · detectado automaticamente
      - term: Requisições da sonda de desempenho
      - definition: Streaming
      - term: Intervalo de verificação
      - definition: Não definido
      - term: Chave de API
      - definition:
        - text: Nenhuma
        - button "Substituir"
      - term: Limite de alerta
      - definition:
        - combobox "Limite de alerta — gpt-4o":
          - option "Baixo ou superior"
          - option "Médio ou superior" [selected]
          - option "Apenas alto"
      - term: Webhooks
      - definition:
        - text: Sem webhooks
        - button "Editar"
      - term: Idioma dos alertas
      - definition:
        - combobox "Idioma dos alertas — gpt-4o":
          - option "English" [selected]
          - option "中文"
          - option "Français"
          - option "Español"
          - option "Português"
          - option "Italiano"
          - option "Deutsch"
          - option "Norsk"
      - term: Perfil de conhecimento
      - definition:
        - code: openai/gpt-4o
        - text: fixado 01/10/2026, 12:00
      - 'link "Da execução #1 →"':
        - /url: /history?host=127.0.0.1%3A9099&model=gpt-4o&suite=standard#r-1
      - form "Conclua a configuração para ativá-lo":
        - heading "Conclua a configuração para ativá-lo" [level=4]
        - paragraph: A configuração vem da execução no Histórico. Defina com que frequência ele roda e ative-o.
        - text: Intervalo de verificação
        - combobox "Intervalo de verificação":
          - option "Escolher…" [selected]
          - option "a cada 5 min"
          - option "a cada 10 min"
          - option "a cada 15 min"
          - option "a cada 20 min"
          - option "a cada 30 min"
          - option "a cada 1 h"
          - option "a cada 2 h"
          - option "a cada 3 h"
          - option "a cada 4 h"
          - option "a cada 6 h"
          - option "a cada 8 h"
          - option "a cada 12 h"
          - option "a cada 24 h"
        - paragraph: Uma execução completa demorou <duration>, por isso é executada no máximo a cada 5 min.
        - text: Chave de API (opcional)
        - textbox "Chave de API (opcional)":
          - /placeholder: sk-... ou env:EKTE_API_KEY
        - button "Mostrar chave"
        - paragraph: O histórico nunca guarda a chave. Deixe vazio para um modelo local ou auto-hospedado.
        - button "Ativar monitor"
      - button "Executar agora"
      - button "Eliminar"
    - paragraph: "Tudo corre localmente. A chave de API não é guardada: fica apenas na memória do ekte serve e nunca é escrita no disco, mostrada na lista de monitores ou enviada ao navegador. Introduza-a novamente quando o ekte serve reiniciar."
- contentinfo:
  - paragraph: "Tudo local: as auditorias partem da sua própria máquina e as suas chaves de API nunca saem dela."
  - paragraph: "Uma caixa-preta: o ekte fornece evidências reprodutíveis de desvios, não prova de fraude. Não culpe um fornecedor por uma única execução."
