- banner:
  - link "跳到主要内容":
    - /url: "#main"
  - link "ekte":
    - /url: /
    - text: ekte.
  - combobox "主题":
    - option "跟随系统"
    - option "浅色" [selected]
    - option "深色"
  - combobox "动画":
    - option "动画开" [selected]
    - option "动画关"
  - combobox "语言":
    - option "English"
    - option "中文" [selected]
    - option "Français"
    - option "Español"
    - option "Português"
    - option "Italiano"
    - option "Deutsch"
    - option "Norsk"
  - link "无障碍":
    - /url: /accessibility
  - navigation "主导航":
    - link "检测":
      - /url: /
    - link "监控":
