    - paragraph:
      - text: "Menos de 3 ejecuciones en este intervalo: se muestra atenuado porque una sola auditoría puede ser un valor atípico."
      - link "Programe un monitor para obtener mediciones regulares.":
        - /url: /v2/watches
    - text: "Las líneas discontinuas del gráfico marcan cambios en cómo se puntúan las ejecuciones (v = versión de zing, KB = perfil de la base de conocimiento):"
    - list:
      - listitem: "mar, 29 sept 2026 · Example Relay, https://gateway.a-very-long-relay-hostname.example.org/openai/compatible/v1: Perfil de la base de conocimiento modificado (cambió la referencia, no el relay)"
