  - paragraph: Esecuzione locale · le chiavi non escono mai
- main:
  - heading "La base di conoscenza usata da zing" [level=1]
  - paragraph:
    - text: "Ogni audit confronta un relay con il profilo del modello che dichiara: finestra di contesto, limite di output, capacità, identità e impronte comportamentali. Qui trovi ogni modello, provider e relay che zing conosce — inclusi e tuoi — e puoi attivarli o disattivarli uno per uno o aggiungerne di tuoi. Le tue modifiche sono salvate in kb.db su questo computer e usate sia dall'interfaccia web sia da"
    - code: zing check
    - text: .
  - region "Quale profilo usa un ID di modello?":
    - heading "Quale profilo usa un ID di modello?" [level=2]
    - textbox "ID del modello":
      - /placeholder: es. gpt-4o
    - button "Cerca"
    - status
  - tablist "Sezioni della base di conoscenza":
    - tab "Modelli" [selected]
    - tab "Provider"
    - tab "Relay"
  - tabpanel "Modelli":
    - heading "Tutti i modelli 98 modelli" [level=2]
    - paragraph: "I profili di modello con cui gli audit confrontano. Un modello disattivato non viene più risolto: i suoi audit girano senza profilo."
    - group:
      - text: Aggiungi un modello
      - paragraph: Lascia che un assistente IA si documenti sul modello, poi verifica qui la risposta prima di salvarla.
      - heading "1 Copia il prompt di ricerca" [level=3]
      - text: ID del modello id
      - textbox "ID del modello id":
        - /placeholder: es. example-large-2
      - text: Fornitore Facoltativo
      - textbox "Fornitore Facoltativo":
        - /placeholder: ad es. openai / deepseek
      - button "Copia prompt"
      - status
      - group:
        - text: Mostra il prompt
        - textbox "Prompt"
      - paragraph: Incollalo nell’assistente IA che preferisci. Risponde con un documento YAML.
      - heading "2 Carica o incolla lo YAML" [level=3]
      - text: YAML del profilo
      - textbox "YAML del profilo":
        - /placeholder: "provider: …\nmodels:\n- id: …"
      - text: Scegli un file .yaml
      - heading "3 Verifica e salva" [level=3]
      - paragraph: La verifica convalida schema e limiti, segnala le espressioni regolari non sicure, elenca ogni prompt che zing invierebbe ai relay e mostra quali ID di modello verrebbero risolti diversamente. Nulla viene salvato finché non salvi.
      - button "Controllo"
      - button "Salva nella base" [disabled]
    - searchbox "Filtra modelli"
    - status
    - group:
      - text: Anthropic (Claude)
      - code: anthropic
      - text: 14 modelli
      - list:
        - listitem:
          - code: claude-opus-4-8
          - text: Incluso Contesto 1000000 Output max. 128000 Alias
          - code: claude-opus-4-8
          - text: ","
          - code: opus
          - text: ","
          - code: opus 4.8
          - text: ","
          - code: most powerful
          - switch "claude-opus-4-8 Attivo" [checked]
          - emphasis: Attivo
        # … more items of the same shape
    # … more items of the same shape
