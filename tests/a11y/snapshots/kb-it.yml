- main:
  - heading "La base di conoscenza usata da ekte" [level=1]
  - paragraph:
    - text: "Ogni audit confronta un relay con il profilo del modello che dichiara: finestra di contesto, limite di output, capacità, identità e impronte comportamentali. Qui trovi ogni modello, provider e relay che ekte conosce — inclusi e tuoi — e puoi attivarli o disattivarli uno per uno o aggiungerne di tuoi. Le tue modifiche sono salvate in kb.db su questo computer e usate sia dall'interfaccia web sia da"
    - code: ekte check
    - text: .
  - status: Base di conoscenza completa 130 modelli · 7 provider · 1 relay, tutti attivi
  - region "Filtri":
    - button "Filtri" [expanded]
    - text: ID del modello
    - combobox "ID del modello":
      - option "Tutti" [selected]
    - text: Fornitore
    - combobox "Fornitore":
      - option "Tutti" [selected]
      - option "Anthropic (Claude)"
      - option "DeepSeek (DeepSeek-AI / Hangzhou DeepSeek)"
      - option "Google (Gemini API / Google AI for Developers; also Vertex AI / Gemini Enterprise Agent Platform)"
      - option "Zhipu AI (智谱 / Z.ai) — BigModel open platform"
      - option "Moonshot AI (月之暗面 / Kimi)"
      - option "OpenAI"
      - option "Alibaba Cloud — Qwen / 通义千问 (Tongyi Qianwen), served via DashScope / Model Studio (Bailian 百炼)"
    - text: Relay
    - combobox "Relay":
      - option "Tutti" [selected]
      - option "Example Relay"
    - text: Origine
    - combobox "Origine":
      - option "Tutti" [selected]
      - option "Incluso"
      - option "Tuo"
    - status: Mostrati 130 di 130 modelli · 7 di 7 provider · 1 di 1 relay
  - link "Esporta le tue voci come YAML":
    - /url: /api/kb/export
  - tablist "Sezioni della base di conoscenza":
    - tab "Modelli" [selected]
    - tab "Provider"
    - tab "Relay"
  - tabpanel "Modelli":
    - heading "Tutti i modelli 130 modelli" [level=2]
    - paragraph: "I profili di modello con cui gli audit confrontano. Un modello disattivato non viene più risolto: i suoi audit girano senza profilo."
    - group:
      - text: Aggiungi un modello
      - paragraph: Lascia che un assistente IA si documenti sul modello, poi verifica qui la risposta prima di salvarla.
      - heading "1 Copia il prompt di ricerca" [level=3]
      - text: ID del modello id
      - textbox "ID del modello id":
        - /placeholder: es. example-large-2
      - text: Fornitore Facoltativo
      - textbox "Fornitore Facoltativo":
        - /placeholder: ad es. openai / deepseek
      - button "Copia prompt"
      - status
      - group:
        - text: Mostra il prompt
        - textbox "Prompt"
      - paragraph: Incollalo nell’assistente IA che preferisci. Risponde con un documento YAML.
      - heading "2 Carica o incolla lo YAML" [level=3]
      - text: YAML del profilo
      - textbox "YAML del profilo":
        - /placeholder: "provider: …\nmodels:\n- id: …"
      - text: Scegli un file .yaml
      - heading "3 Verifica e salva" [level=3]
      - paragraph: La verifica convalida schema e limiti, segnala le espressioni regolari non sicure, elenca ogni prompt che ekte invierebbe ai relay e mostra quali ID di modello verrebbero risolti diversamente. Nulla viene salvato finché non salvi.
      - button "Controllo"
      - button "Salva nella base" [disabled]
    - group:
      - text: Anthropic (Claude)
      - code: anthropic
      - text: 23 modelli
      - list:
        - listitem:
          - code: claude-fable-5-1
          - text: Incluso Contesto 1000000 Output max. 128000 Alias
          - code: claude-fable-5-1
          - text: ","
          - code: fable
          - text: ","
          - code: fable 5.1
          - text: ","
          - code: claude fable 5.1
          - text: ","
          - code: most powerful
          - switch "claude-fable-5-1 Attivo" [checked]
          - emphasis: Attivo
        # … more items of the same shape
    # … more items of the same shape
- contentinfo:
  - paragraph: "Tutto in locale: gli audit partono dalla tua macchina e le tue chiavi API non la lasciano mai."
  - paragraph: "Una scatola nera: ekte fornisce prove riproducibili di scostamenti, non una prova di frode. Non incolpare un fornitore per una singola esecuzione."
