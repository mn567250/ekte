- main:
  - heading "Sett en planlagt vaktpost på reléet ditt" [level=1]
  - paragraph:
    - text: Hver overvåking kjører på nytt en revisjon du allerede har kjørt, på maskinen din, med intervallet du angir. For å legge til en, åpne en kjøring i
    - link "Historikk":
      - /url: /v2/history
    - text: og velg Planlegg som overvåking — angi deretter intervallet her og slå den på. Når risikoen krysser terskelen din eller blir verre enn forrige gang, varsler ekte webhookene dine (Slack / Feishu / DingTalk / generisk JSON).
  - status:
    - text: API-nøkler lagres ikke Nøkler du oppgir, blir bare værende i minnet til ekte serve og skrives aldri til disk; oppgi dem igjen etter en omstart. env:VAR-referanser fortsetter å virke.
    - button "Endre"
  - group "Lagring av API-nøkler":
    - text: Lagring av API-nøkler
    - radio "Ikke lagre nøkler" [checked]
    - text: Ikke lagre nøkler
    - radio "Lagre kryptert på denne maskinen"
    - text: Lagre kryptert på denne maskinen
    - paragraph: API-nøkler blir værende i minnet til ekte serve og skrives aldri til disk; oppgi dem igjen etter hver omstart. Bruk env:VAR for overvåkinger som må kjøre uten tilsyn.
  - region "Filtre":
    - button "Filtre" [expanded]
    - text: Søk
    - searchbox "Søk"
    - text: Status
