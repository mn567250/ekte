        - textbox "API-nøkkel (valgfritt)":
          - /placeholder: sk-... eller env:EKTE_API_KEY
        - button "Vis nøkkel"
        - paragraph: Historikken lagrer aldri nøkkelen. La feltet stå tomt for en lokal eller selvdriftet modell.
        - button "Aktiver overvåking"
      - button "Kjør nå"
      - button "Slett"
    - paragraph: "Alt kjører lokalt. API-nøkkelen lagres ikke: den blir bare værende i minnet til ekte serve og blir aldri skrevet til disk, vist i overvåkingslisten eller sendt til nettleseren. Oppgi den igjen når ekte serve har startet på nytt."
- contentinfo:
  - paragraph: "Alt lokalt: revisjoner kjøres fra din egen maskin, og API-nøklene dine forlater den aldri."
  - paragraph: "En black box: ekte rapporterer reproduserbare bevis på avvik, ikke bevis på svindel. Ikke legg skylden på en leverandør etter én enkelt kjøring."
